# Concept lineage — HAND-AUTHORED governance record. Not generated.
#
# Two dispositions for a CONCEPT: marker that is not itself an architectural
# decision (see agent_utilities/governance/concept_lineage.py for the rules and
# .specify/design/concept-lineage-parent-doc/design.md for why this exists):
#
#   parents:  <child-id>: {parent: <id>, rationale: <why that doc covers this>}
#       The child realises a decision documented under the parent. The gate
#       (scripts/check_concept_governance.py) treats the child as documented —
#       but ONLY after verifying the parent is live and genuinely has a design
#       document. One hop only: a parent may not itself be a child.
#
#   retired:  <id>: {reason: <why this never named a decision>}
#       The marker was deleted. Recording it makes retirement a ratchet: a
#       re-introduced retired id FAILS the gate instead of silently returning.
#
# A rationale that merely re-spells the concept id is rejected by the loader.
# Propose entries with `scripts/concept_domain_triage.py propose <PILLAR>.<domain>`;
# a human confirms each decision; `... apply` does the typing.

