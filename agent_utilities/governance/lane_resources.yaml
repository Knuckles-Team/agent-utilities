# Shared-resource classification for concurrent lanes (CONCEPT:AU-OS.governance.lane-arbitration-classes).
#
# Every resource that more than one lane can touch belongs to exactly ONE
# arbitration class, and each class has exactly one mechanism
# (agent_utilities/governance/lanes.py):
#
#   partition    make it per-lane                -> partitioned_paths()
#   append-only  make writes non-conflicting     -> FragmentStore
#   lease        announce, others defer          -> hold_lease()
#   read-only    forbid the mutation entirely    -> require_mutable_tree() /
#                                                   require_resettable_tree()
#
# `evidence` is the real collision this row exists to prevent — every one of
# these was observed, not hypothesised. Adding a resource is a row here, never a
# new mechanism.
resources:
  - name: cargo-target-dir
    class: partition
    mechanism: partitioned_paths().cargo_target_dir
    evidence: >-
      A shared CARGO_TARGET_DIR both serialises and CORRUPTS concurrent
      epistemic-graph worktree builds. The per-lane target dir was a convention
      nothing enforced.

  - name: pytest-tmp
    class: partition
    mechanism: partitioned_paths().pytest_basetemp
    evidence: >-
      ~28 concurrent pytest processes shared a basetemp and made a baseline
      measurement read materially worse, nearly causing a false regression call.

  - name: git-stash
    class: partition
    mechanism: partitioned_paths().stash_ref
    evidence: >-
      refs/stash is a SINGLE ref shared by all worktrees; six collisions across
      38 worktrees, plus four reflexive violations in one day by careful actors
      with the never-stash rule in front of them. Prohibition alone does not
      hold — but the lane that found a substitute stopped violating it. Two
      distinct needs hide behind the reflex: (1) READ the pristine file while
      yours is dirty -> `git show <ref>:<path>`, which mutates nothing and is the
      common case; (2) actually PARK work -> a scratch commit on your own branch,
      or `lane park` against the per-lane ref. Name the replacement or the rule
      loses.

  - name: lane-scratch
    class: partition
    mechanism: partitioned_paths().scratch_dir
    evidence: >-
      Lanes writing scratch into the repo tree or a shared temp dir overwrite
      each other's intermediate state.

  - name: concept-reservations
    class: append-only
    mechanism: FragmentStore(docs/concept_reservations.d) folded to docs/concept_reservations.yaml
    evidence: >-
      docs/concept_reservations.yaml was a mutable shared ledger many sessions
      rewrote whole-file; it needed repair via a verified line-union and several
      lanes declined to commit it at all rather than clobber it.

  - name: deferred-register
    class: append-only
    mechanism: reports/deferred/lane-*.md fragments folded to the generated program document
    evidence: >-
      63 lane files plus a program markdown, a wave plan, and a wave status file
      left readers with no single authority and writers with shared files.

  - name: dependency-lock
    class: lease
    scope: workspace   # ~26 worktrees across several repos contend for ONE venv
    mechanism: hold_lease("dependency-lock")
    evidence: >-
      One shared .venv and uv.lock across ~26 worktrees; a bare `uv sync` would
      have uninstalled all 555 packages, the venv silently rotted for 10 days
      hiding 13 real defects, and a lane observed another actor swapping
      packages mid-run. The venvctl lane's /proc-based activity detector is the
      other half of this lease: an explicit lease covers actors that participate,
      activity detection catches the ones that do not.

  - name: precommit-all-files
    class: lease
    mechanism: hold_lease("precommit-all-files")
    evidence: >-
      `pre-commit run --all-files` can destroy unstaged work (D-OB-12) and
      concurrent runs contend for the same caches; the safe wrapper existed but
      nothing forced its use.

  - name: reconciliation-merge
    class: lease
    mechanism: hold_lease("reconciliation-merge") — held by merge_queue.run_queue()
    evidence: >-
      A reconciliation gate accumulated 26 commits on a DETACHED HEAD with no
      ref, having already orphaned an earlier correct merge resolution the same
      way. Concurrent merges into the shared base are the cause. This is now the
      lease the SERIALIZED MERGE QUEUE holds (merge_queue.py) — deliberately the
      same resource, not a second one, so a queue runner and any residual bulk
      reconciliation can never run at once. The queue also removes the detached
      HEAD entirely: the merge is built as objects (merge-tree -> commit-tree)
      and main only ever fast-forwards, so there is no state for a crash to
      strand.

  - name: merge-queue
    class: append-only
    mechanism: FragmentStore(<git-common-dir>/agent-lanes/merge-queue) folded by merge_queue.queued()
    evidence: >-
      Hundreds of lanes offer candidates concurrently; a single mutable queue
      file would be the shared ledger this workspace has already had to repair
      once (docs/concept_reservations.yaml). One fragment per lane, appended
      never rewritten, and a terminal record supersedes rather than edits — so
      enqueue is lock-free and no lane can drop another's candidate. It lives in
      the shared git dir, so it is identical from every worktree and no
      checkout, reset, or merge can touch it.

  - name: canonical-checkout
    class: read-only
    mechanism: require_mutable_tree() / require_resettable_tree()
    evidence: >-
      A background actor reset a canonical checkout mid-pre-commit and destroyed
      ~20 minutes of a lane's work — precisely the window in which the lane
      cannot yet commit. "Commit often" does not close this hole.

  - name: canonical-mutation
    class: lease
    mechanism: guarded_tree_mutation()
    evidence: >-
      repository-manager switched the canonical checkout's branch with no
      dirty-tree guard at all (worktree.py add/merge) and a weak one in
      pull_project. The verb was `git checkout`, not `git reset` — so the guard
      must cover every tree-mutating verb, held under one lease across the whole
      check-then-mutate so the tree cannot go dirty in between.
