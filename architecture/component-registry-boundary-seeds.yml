schema: au-boundary-owner-seeds/v1
owner_repository: agent-utilities
manifest_version: 1
generator: scripts/check_boundary_owners.py
source_spec: specs/au-boundary-deconstruction/requirements.md

# AU-BOUNDARY-R038 boundary seeds: module path prefixes (and, by resolving
# `[project.scripts]` targets, console scripts) that `requirements.md` or
# `coverage.md` name as moving to graph-os or agent-connector-sdk. Every
# entry below cites the exact requirement row it is derived from; none is
# guessed beyond what those two documents say.
#
# A seed path may be a directory (covers itself and everything under it) or
# an exact file. `scripts/check_boundary_owners.py` fails when a real module
# or console-script target matches a seed for owner O and the covering
# `coverage.md` row for that path does not say "relocate to O" (coverage.md's
# own phrasing for "moving, still present"). As each path is actually cut
# over, its coverage.md row stops saying that, and the gate then forbids the
# path from reappearing.
#
# This file is independent of `architecture/component-registry.yml`'s
# cryptographically signed component schema (see
# `agent_utilities/skills/validation.py`): that registry is a generated,
# digest-verified artifact for a different, already-wired certification
# path, and hand-adding boundary seeds to it would desynchronize its
# signatures. Boundary seeds get their own small, human-read manifest.
seeds:
  - owner_repository: graph-os
    requirement_id: AU-BOUNDARY-R001
    owned_module_paths:
      - agent_utilities/gateway
  - owner_repository: graph-os
    requirement_id: AU-BOUNDARY-R002
    owned_module_paths:
      - agent_utilities/deployment
