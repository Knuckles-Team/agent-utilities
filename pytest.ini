[pytest]
# This is the ONE effective pytest config for the repo. pytest.ini takes
# precedence over any [tool.pytest.ini_options] in pyproject.toml (pytest's
# own file-precedence order), so a second, disagreeing block there was dead
# config that only misled readers -- removed 2026-08-13. Kept here,
# unchanged: --timeout=300 (not the pyproject block's dead timeout=30) and
# testpaths=tests (the whole tree: unit+integration+gates+scale+retrieval+...,
# not the pyproject block's dead tests/unit+tests/integration subset) --
# both are the behaviour actually in force today and CI/pre-commit already
# depend on this full testpaths scope (release.yml's bare `pytest -q`).
# Parallel by default. 17,974 tests ran in ONE process, which is why the
# pre-push gate exceeded 90 minutes and never returned a verdict -- pytest-xdist
# was already a declared dependency and simply never switched on.
#
#   -n auto          scale to the box; a constrained CI runner gets its own core
#                    count, not a hardcoded number.
#   --maxprocesses   cap it. `_session_engine` is session-scoped AND autouse, so
#                    every worker spawns its own epistemic-graph engine; 24
#                    workers means 24 engines. 12 bounds that cost.
#   --dist loadfile  keep every test in a file on ONE worker. The suite has
#                    order-dependent module state, so per-test round-robin
#                    (the default) would turn latent coupling into flakes.
#   -p no:logfire    the `logfire` distribution registers TWO pytest11
#   -p no:pytest_logfire  plugins via entry points (`logfire` ->
#                    logfire.testing, `pytest_logfire` ->
#                    logfire._internal.integrations.pytest), autoloaded on
#                    EVERY pytest process -- the controller AND each of up
#                    to 12 workers, so up to 13x per invocation. Zero test
#                    in tests/ uses either plugin's fixtures (grepped for
#                    capfire/logfire_backend/logfire.testing/IsolatedLogfire:
#                    no hits) -- the application's own `import logfire`
#                    calls for real runtime tracing are unaffected by
#                    blocking the PYTEST plugin; only the unused
#                    test-integration hook is disabled. `python -X
#                    importtime` showed loading these two plugins pulls in
#                    the full opentelemetry SDK + requests + rich: ~300ms of
#                    self-time, ~37% of one process's traced pytest-startup
#                    self-time in an isolated run. Repeated min-of-8 A/B on
#                    tests/unit/agents/ --collect-only (noisy shared host,
#                    so min/median across 8 runs, not one sample): ~9.6s ->
#                    ~7.1s, ~26% less collection wall time.
#
# `certification` is the 24-72h production soak campaign, documented below as
# explicit-invocation-only -- it has no business in a pre-push gate. `slow` is
# deliberately NOT excluded: it is meant to run in the full/pre-push tier.
addopts = --timeout=300 -m "not live and not certification" -n auto --maxprocesses=12 --dist loadfile -p no:logfire -p no:pytest_logfire
asyncio_mode = auto
pythonpath = .
testpaths = tests
markers =
    integration: Integration tests using subprocess/TestClient (no external services)
    live: Tests requiring live external services (LLM endpoints, real networks)
    slow: Slow / real-resource timing tests excluded from the fast pre-commit gate (run in full/nightly)
    certification: Exact-release 24-72h production soak/chaos campaign (explicit invocation only)
    engine: Requires the real ephemeral epistemic-graph test engine (the `tiny_engine`/`engine_graph` fixtures in tests/conftest.py) -- skips cleanly (not a hard failure) when no prebuilt engine binary is available in this environment
    quarantine: Real test, currently RED (or requires infra unavailable in the standard sandbox: a live model class, the native epistemic-graph engine binary, an embedding-model API key). Still COLLECTED and RUN (never skip/xfail) so the failure stays visible. Enumerated in reports/test-collection-audit.md; each site names its deferred-item ID. Remove the marker only when the underlying cause is actually fixed.
    concept(id): Mark test as validating a specific documentation concept (e.g., CONCEPT:ORCH-1.2). Merged in from the now-removed pyproject.toml block -- it was registered there but, because pytest.ini always won, was never actually registered until now.
env =
    AGENT_UTILITIES_TESTING=true
    GRAPH_DB_PATH=:memory:
    # Production trips the model breaker on the FIRST overload (fail_threshold=1)
    # -- correct in production, where one 503 means the server is already
    # shedding. Under `-n auto` that same hair-trigger makes the suite flaky:
    # 12 workers contend for CPU, an incidental slow/failed call trips the
    # process-wide breaker for that model key, and unrelated tests that route
    # through it fail with `circuit_breaker_open`. Observed varying 3-12
    # failures per run across six unrelated files.
    # A test-only floor, so no production default changes. The two tests that
    # genuinely assert tripping (test_embedding_failover,
    # test_model_server_capacity_guard) opt back into 1 explicitly.
    MODEL_BREAKER_FAIL_THRESHOLD=4
    MODEL_BREAKER_BASE_COOLDOWN_S=0.01
    MODEL_BREAKER_MAX_COOLDOWN_S=0.05
