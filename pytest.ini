[pytest]
# This is the ONE effective pytest config for the repo. pytest.ini takes
# precedence over any [tool.pytest.ini_options] in pyproject.toml (pytest's
# own file-precedence order), so a second, disagreeing block there was dead
# config that only misled readers -- removed 2026-08-13. Kept here,
# unchanged: --timeout=300 (not the pyproject block's dead timeout=30) and
# testpaths=tests (the whole tree: unit+integration+gates+scale+retrieval+...,
# not the pyproject block's dead tests/unit+tests/integration subset) --
# both are the behaviour actually in force today and CI/pre-commit already
# depend on this full testpaths scope (release.yml's bare `pytest -q`).
addopts = --timeout=300 -m "not live"
asyncio_mode = auto
pythonpath = .
testpaths = tests
markers =
    integration: Integration tests using subprocess/TestClient (no external services)
    live: Tests requiring live external services (LLM endpoints, real networks)
    slow: Slow / real-resource timing tests excluded from the fast pre-commit gate (run in full/nightly)
    certification: Exact-release 24-72h production soak/chaos campaign (explicit invocation only)
    engine: Requires the real ephemeral epistemic-graph test engine (the `tiny_engine`/`engine_graph` fixtures in tests/conftest.py) -- skips cleanly (not a hard failure) when no prebuilt engine binary is available in this environment
    quarantine: Real test, currently RED (or requires infra unavailable in the standard sandbox: a live model class, the native epistemic-graph engine binary, an embedding-model API key). Still COLLECTED and RUN (never skip/xfail) so the failure stays visible. Enumerated in reports/test-collection-audit.md; each site names its deferred-item ID. Remove the marker only when the underlying cause is actually fixed.
    concept(id): Mark test as validating a specific documentation concept (e.g., CONCEPT:ORCH-1.2). Merged in from the now-removed pyproject.toml block -- it was registered there but, because pytest.ini always won, was never actually registered until now.
env =
    AGENT_UTILITIES_TESTING=true
    GRAPH_DB_PATH=:memory:
