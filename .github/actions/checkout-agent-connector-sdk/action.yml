name: Checkout pinned sibling sources
description: >-
  Materialize the editable sibling sources uv.lock needs, at the commits pinned
  in scripts/siblings.lock (the same pins scripts/bootstrap.sh uses locally).
runs:
  using: composite
  steps:
    - name: Checkout pinned sibling sources
      shell: bash
      run: bash scripts/bootstrap.sh --siblings-only
