name: Advisory

# ─────────────────────────────────────────────────────────────────────────
# Half of the two-workflow model — see release.yml's header comment for the
# full explanation. In short: this workflow REPORTS, it never BLOCKS.
#
# Every step below runs with `continue-on-error: true` (or an equivalent
# non-blocking wrapper for a step that must still surface its own failure
# text) so a red check here never fails the job/workflow, but is still
# clearly visible as a red step in the Actions UI, in `::warning::`/
# `::error::` annotations, and in the job summary written at the end. Debt
# stays visible; it just never silently skips a release the way the old
# `workflow_run`-chained pipeline.yml did.
#
# This file is the union of what used to be guardrails.yml's ADVISORY
# section, concept-governance.yml, security.yml's non-test-suite steps, and
# the advisory half of guardrails.yml's BLOCKING section that did not make
# the release-critical cut defined in release.yml (see the coverage table in
# the redesign's handoff notes / PR description for the full old-check ->
# new-home mapping).
#
# Also carries the `pages` job (formerly the standalone pages.yml). Pages is a
# static documentation pipeline: it checks out the shared theme, installs only
# pinned documentation tooling, validates the committed docs, and deploys the
# generated site. It deliberately never installs this package or resolves any
# Agent Utilities runtime dependency. Documentation publication therefore stays
# independent of the epistemic-graph / Agent Utilities package release order.
# It intentionally does not carry per-job path filtering (GitHub Actions
# triggers are workflow-scoped, not job-scoped, and this workflow's own `push`
# trigger is unconditional), so it runs on every push to `main`.
# ─────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    paths:
      - 'agent_utilities/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'deploy/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'MANIFEST.in'
      - 'build_backend.py'
      - 'requirements*.txt'
      - 'agent_utilities/dependency-license-catalog.json'
      - 'AGENTS.md'
      - '**/Dockerfile*'
      - '**/*compose*.yml'
      - '**/*compose*.yaml'
      - '**/*.stack.yml'
      - '**/*.stack.yaml'
      - '.config/pre-commit.yaml'
      - '.github/**'
  push:
    branches:
      - 'main'
  # GOC-84/GOC-16/BUG-234: on-demand, operator-invoked connector-manifest freeze +
  # diff report (see the `connector-manifest-diff` job below). Never runs
  # automatically -- regenerating the fleet is a deliberate check, not a per-push
  # cost, and this trigger touches no signing key (report only, same as every other
  # job in this file).
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  advisory:
    name: Advisory gates (report only, never blocks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: python
          build-mode: none
          queries: security-extended

      - &setup-python-312
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - &setup-uv-locked
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: uv.lock

      # D-CIP-2: uv.lock pins epistemic-graph/langfuse-agent as editable workspace
      # siblings at .uv-workspace-siblings/<name>. Materialize their real source
      # trees for lock/source-policy inspection, but do not compile/install them in
      # this report-only source-contract lane. Native EG build and wheel execution
      # belong to release.yml; rebuilding the database here exceeded the job's
      # 25-minute budget before any advisory gate could run.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Knuckles-Team/epistemic-graph
          path: .uv-workspace-siblings/epistemic-graph
          persist-credentials: false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: Knuckles-Team/langfuse-agent
          path: .uv-workspace-siblings/langfuse-agent
          persist-credentials: false

      - &sdk-checkout
        name: Checkout pinned Agent Connector SDK source
        uses: ./.github/actions/checkout-agent-connector-sdk

      - name: Sync advisory environment (source contracts, no native engine build)
        run: |
          uv sync --frozen --extra test --group guardrails --extra agent-runtime \
            --no-install-package epistemic-graph \
            --no-install-package langfuse-agent
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Install a published wheel satisfying Agent Utilities' declared runtime
      # contract rather than compiling the sibling Rust checkout. Until the floor
      # is published this one advisory step is visibly red, but continue-on-error
      # lets engine-independent source gates run. release.yml remains the blocking
      # owner of floor availability, wheel completeness, and native execution.
      - name: Install published Epistemic Graph wheel
        id: published-engine
        continue-on-error: true
        run: |
          EG_REQUIREMENT="$(python3 - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              dependencies = tomllib.load(stream)["project"]["dependencies"]
          print(next(row for row in dependencies if row.startswith("epistemic-graph[")))
          PY
          )"
          uv pip install \
            --python "$PWD/.venv/bin/python" \
            --no-deps \
            --only-binary=:all: \
            "$EG_REQUIREMENT"

      # ── The commit-stage hooks a contributor runs locally
      # (scripts/bootstrap.sh installs them), so local and CI share one
      # definition instead of a hand-kept copy of each gate here. Skipped:
      # check-import-safety (routes through the ecosystem-workspace launcher;
      # the `windows` job runs it on a real interpreter) and
      # check-release-catalogs (derived from the provider fleet checkout,
      # which is not part of this repository).
      - name: pre-commit (commit stage, all files)
        continue-on-error: true
        env:
          PROHIBITED_IDENTITY_CATALOG: ${{ vars.PROHIBITED_IDENTITY_CATALOG }}
          SKIP: check-import-safety,check-release-catalogs
        run: |
          set -euo pipefail
          if [ -n "$PROHIBITED_IDENTITY_CATALOG" ]; then
            policy_dir="$HOME/.config/agent-utilities/governance"
            mkdir -p "$policy_dir"
            printf '%s' "$PROHIBITED_IDENTITY_CATALOG" > "$policy_dir/prohibited-identities.json"
          fi
          uv tool install bump2version==1.0.1
          uvx pre-commit run --config .config/pre-commit.yaml --all-files --show-diff-on-failure

      # ── Gates without a commit-stage hook (manual-stage hooks route through
      # the ecosystem-workspace launcher, so their commands run directly) ──
      - name: Ontology library gate (valid + connected, no unlinked/broken)
        continue-on-error: true
        run: python3 scripts/check_ontology.py

      - name: Prod-profile guard
        continue-on-error: true
        run: python3 -m pytest tests/scale/test_prod_profile_guard.py -q -p no:cacheprovider -o addopts="" -k "prod or profile"

      - name: Gate meta-tests (prove every gate can fail)
        continue-on-error: true
        run: python3 -m pytest tests/gates -q -p no:cacheprovider -o addopts=""

      - name: Status page freshness gate (docs/status.md vs concepts.yaml/concept_reservations.yaml)
        continue-on-error: true
        run: python3 scripts/check_status_page.py

      - name: Production cell source contract
        continue-on-error: true
        run: python3 scripts/deployment/check_production_assets.py

      - name: Hardened Swarm source contract
        continue-on-error: true
        run: python3 scripts/deployment/check_swarm_assets.py --self-check

      - name: Tenant and identity source contract
        continue-on-error: true
        run: python3 scripts/security/check_tenant_identity_contract.py --self-check

      - name: Compatibility and release-train contract
        continue-on-error: true
        run: python3 scripts/release/check_compatibility.py --matrix-only

      - name: Public graph-boundary contract
        continue-on-error: true
        run: python3 scripts/check_public_graph_boundary.py

      - name: Engine-native ChangeEnvelope boundary
        continue-on-error: true
        run: python3 scripts/check_native_change_envelope_boundary.py

      - name: Universal external-graph connector contract
        continue-on-error: true
        run: python3 scripts/check_external_graph_contract.py

      - name: Current-only API and configuration contract
        continue-on-error: true
        run: python3 scripts/check_current_only_contract.py

      - name: Connector live-certification source contract
        continue-on-error: true
        run: python3 scripts/check_connector_live_certification.py --self-check

      - name: Exact-installed local certification source contract
        continue-on-error: true
        run: python3 scripts/check_exact_local_gates_harness.py

      - name: Exact local promoter behavioral contract
        continue-on-error: true
        run: python3 -m pytest tests/unit/release/test_promote_local_release.py tests/gates/test_exact_local_release_contract.py -q -p no:cacheprovider -o addopts=""

      - name: CI bootstrap and supply-chain policy behavioral contract
        continue-on-error: true
        run: python3 -m pytest tests/unit/scripts/test_run_guardrails_lean.py tests/unit/scripts/test_check_fleet_supply_chain.py -q -p no:cacheprovider -o addopts=""

      - name: Mandatory ContextCompiler boundary
        continue-on-error: true
        run: python3 scripts/check_context_compiler_boundary.py

      # Report-only until the 17 undecided coverage.md rows (images/, data/,
      # protocols/voice_supply_chain/, and 14 skill-content directories) get
      # an owner ruling -- see this script's module docstring and
      # tests/gates/test_boundary_coverage_gate.py for the exact list. The
      # owning boundary requirement forbids inventing a disposition for them,
      # so this step stays red until an owner resolves each row; it is
      # deliberately not in the blocking commit-stage hook set until then.
      - name: Boundary deletion/relocation coverage inventory (report only)
        continue-on-error: true
        run: python3 scripts/check_boundary_coverage.py

      - name: Governed HTTP egress boundary
        continue-on-error: true
        run: python3 scripts/check_http_egress_boundary.py

      # ── formerly security.yml (SBOM/license + auth/tenant test subsets are
      # now also exercised as part of release.yml's consolidated "Test suite"
      # step over the whole tests/ tree; kept here too so a failure is
      # visible on every PR/push without needing to cross-reference the
      # release workflow, and so CodeQL -- which release.yml deliberately
      # does not run, being slow and non-packaging-related -- has a home) ──
      - name: CycloneDX SBOM and license policy
        continue-on-error: true
        run: >-
          python3 scripts/security/check_sbom_licenses.py
          --output "$RUNNER_TEMP/agent-utilities.cdx.json"

      - name: Upload sanitized SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-utilities-cyclonedx
          path: ${{ runner.temp }}/agent-utilities.cdx.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Bounded parser fuzzing
        continue-on-error: true
        run: >-
          python3 -m pytest tests/unit/security/test_parser_fuzz.py
          -q -p no:cacheprovider -o addopts=""

      - name: Authentication negative paths
        continue-on-error: true
        run: >-
          python3 -m pytest
          tests/unit/core/test_request_identity.py
          tests/unit/mcp/test_graphos_bootstrap_isolation.py
          tests/unit/security/test_cli_secret_references.py
          -q -p no:cacheprovider -o addopts=""

      - name: Tenant-isolation regression suite
        continue-on-error: true
        run: >-
          python3 -m pytest
          tests/unit/security/test_tenant_identity_contract.py
          tests/unit/test_tenant_e2e_au_p0_5.py
          -q -p no:cacheprovider -o addopts=""

      - name: CodeQL analysis
        continue-on-error: true
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          category: /language:python

      # ── formerly concept-governance.yml ───────────────────────────────
      - name: Merged-Concept Visibility Audit (D-RG2-3, push only)
        if: github.event_name == 'push'
        continue-on-error: true
        run: uv run --no-sync python3 scripts/check_concept_governance.py --audit-merged

      - name: Extend-Before-Invent Gate (new CONCEPT tags need a design doc, PR only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          echo "Scanning for new CONCEPT: tags in this PR..."
          pip install pyyaml >/dev/null 2>&1 || true
          VALID=$(python -c "import yaml; d=yaml.safe_load(open('docs/concepts.yaml')) or {}; print(' '.join(sorted({p.split('-')[0] for p in d.get('pillars', [])})))")
          if [ -z "$VALID" ]; then
            VALID="ORCH KG AHE ECO OS SAFE EE ML"
          fi
          NEW_CONCEPTS=$(git diff origin/main...HEAD --unified=0 | \
            grep -oP '(?<=CONCEPT:)[A-Z]{2}-(?:ORCH|KG|AHE|ECO|OS|GBOT)(?:\.[a-z0-9-]+)+' | \
            sort -u || true)
          if [ -z "$NEW_CONCEPTS" ]; then
            echo "No new CONCEPT: tags found. Governance check passed."
            exit 0
          fi
          echo "New CONCEPT tags found:"
          echo "$NEW_CONCEPTS"
          VIOLATIONS=""
          for concept in $NEW_CONCEPTS; do
            PILLAR=$(echo "$concept" | grep -oP '^[A-Z]+')
            DESIGN_DIR=".specify/design/"
            if ! find "$DESIGN_DIR" -name "*.md" -exec grep -l "$concept" {} \; 2>/dev/null | head -1 | grep -q .; then
              VIOLATIONS="$VIOLATIONS\n  $concept -- No design document references this concept"
            fi
            if echo "$VALID" | tr ' ' '\n' | grep -qx "$PILLAR"; then
              echo "  OK: $concept -- valid pillar: $PILLAR"
            else
              VIOLATIONS="$VIOLATIONS\n  $concept -- invalid pillar prefix: $PILLAR (must be one of: $VALID)"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::warning::Governance violations found (advisory, does not block):"
            echo -e "$VIOLATIONS"
            exit 1
          fi
          echo "All new concepts have design documents. Governance check passed."

      - name: Advisory summary
        if: always()
        run: |
          echo "## Advisory gates ran in report-only mode" >> "$GITHUB_STEP_SUMMARY"
          echo "Every step above uses \`continue-on-error: true\`. A red step here" >> "$GITHUB_STEP_SUMMARY"
          echo "is real debt and never blocks a release -- release-blocking checks" >> "$GITHUB_STEP_SUMMARY"
          echo "live only in \`release.yml\`. Scroll up for which step(s) failed." >> "$GITHUB_STEP_SUMMARY"

  # ── formerly the standalone pages.yml — see the header comment for why it
  # moved here. Runs on push to main only; a failure is a red job in this
  # workflow's run, never a blocker for release.yml.
  #
  # Was previously a hand-rolled job that checked out
  # Knuckles-Team/pipelines at a pinned commit SHA for its shared theme and
  # spec_dashboard.py script. That pin predated pipelines#27 (the
  # ASD-STE100 drawing-sheet spec-delivery template), so the deployed page
  # never picked up the new template -- unlike epistemic-graph, graph-os and
  # agent-connector-sdk, which already call the reusable Pages workflow at
  # `@main` per the repository-wide "pipelines is always referenced at
  # main -- never SHA-pin" policy. Wired identically to those three repos
  # below; `pages-privacy-check` keeps the standalone-tracked-identity
  # guardrail the old inline job ran, now as its own fast, report-only job
  # (the reusable workflow's job cannot carry extra steps -- `uses:` jobs
  # accept only name/uses/with/secrets/needs/if/permissions/strategy/
  # concurrency).
  pages-privacy-check:
    name: Docs privacy guardrail (report only, never blocks)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Scan tracked public artifacts for host-specific data or local identities
        continue-on-error: true
        env:
          PROHIBITED_IDENTITY_CATALOG: ${{ vars.PROHIBITED_IDENTITY_CATALOG }}
        run: |
          python -m pip install --disable-pip-version-check "platformdirs==4.11.0"
          policy="$RUNNER_TEMP/prohibited-identities.json"
          if [ -n "$PROHIBITED_IDENTITY_CATALOG" ]; then
            printf '%s' "$PROHIBITED_IDENTITY_CATALOG" > "$policy"
          else
            echo "::notice::PROHIBITED_IDENTITY_CATALOG is not configured; running the repository privacy scanner with a safe fallback policy."
            fallback_identity="pagesprivacy""catalogfallback"
            printf '{"version":"pages-default-v1","identities":["%s"]}' "$fallback_identity" > "$policy"
          fi
          python3 scripts/check_tracked_privacy.py --identity-catalog "$policy"

  pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push'
    uses: Knuckles-Team/pipelines/.github/workflows/pages_pipeline.yml@main
    with:
      content_source: docs
      shared_theme_enabled: true
      spec_dashboard_enabled: true
      spec_dashboard_config: .config/spec-dashboard.json
    permissions:
      contents: read
      pages: write
      id-token: write

  # ── Windows coverage (report only, never blocks) ──────────────────────────
  #
  # release.yml's numeric-runtime-gate ALREADY runs on windows-latest, but
  # narrowly: install the built wheel and smoke-import 2 modules
  # (agent_utilities.observability.langfuse_trust,
  # agent_utilities.security.persistence_privacy). That is release-critical
  # and stays put. This job is the broader, non-blocking complement: it
  # walks EVERY agent_utilities module on a real Windows interpreter (not a
  # simulation -- see scripts/check_import_safety.py, which also runs this
  # same walk in the fast pre-commit tier with a POSIX-side simulation of
  # this exact platform), then runs a bounded, cross-platform-relevant unit
  # test subset.
  #
  # Deliberately excluded, with reasons (not silently skipped):
  #   * `engine`-marked tests (13 files) -- need the prebuilt native
  #     epistemic-graph engine binary. The Rust engine itself already falls
  #     back to TCP on Windows (epistemic-graph/src/main.rs:2135,
  #     agent_utilities/knowledge_graph/core/shard_topology.py:57) but this
  #     job does not build/install a Windows engine binary -- that is a
  #     separate undertaking, not a fundamental blocker, tracked
  #     separately.
  #   * `live`-marked tests (13 files) -- require live external services,
  #     platform-independent exclusion (also excluded on Linux by
  #     pytest.ini's default addopts).
  #   * `slow`/`certification`/`quarantine`-marked tests -- long-running
  #     soak/chaos/known-red, out of scope for a per-push CI job on ANY
  #     platform, not Windows-specific.
  #   * AF_UNIX-dependent socket tests, `systemd-run`-based tests, Docker-
  #     in-CI tests, and anything assuming a specific self-hosted build host -- these
  #     assume infrastructure that plainly does not exist on a Windows
  #     GitHub-hosted runner; none are in the selected subset below.
  #   * The remaining ~90% of tests/unit (1244 files total; this job
  #     selects 119) is a COST-SCOPING choice for this first Windows job,
  #     not a "cannot run on Windows" claim -- most of it is plain platform-
  #     agnostic Python and would likely pass unmodified. Expanding the
  #     selected subset is the natural next step once this job's signal is
  #     trusted; see the job summary step below for the exact fraction.
  windows:
    name: Windows coverage (report only, never blocks)
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - *setup-python-312

      - *setup-uv-locked

      - *sdk-checkout

      # Same pattern release.yml's `gates` job uses for its static/test-suite
      # lane: no native engine (Linux-built binary; not what this job is
      # proving), test extras + guardrails group only. agent-connector-sdk is
      # a hard base dependency (not excludable like epistemic-graph/
      # langfuse-agent) so its editable sibling must be checked out above.
      - name: Sync test environment (no native engine)
        id: sync
        continue-on-error: true
        run: |
          uv sync --frozen --extra test --group guardrails \
            --no-install-package epistemic-graph \
            --no-install-package langfuse-agent
          echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # This IS the highest-value check in this job: on a real Windows
      # interpreter, POSIX-only stdlib modules are simply absent, so any
      # module with an unconditional top-level `import fcntl` (etc.) fails
      # here exactly as it would for a real Windows user -- no simulation
      # needed (that's only for catching the same class of bug on a Linux
      # dev machine; see the pre-commit hook of the same script).
      - name: Cross-platform import safety (real Windows interpreter)
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        run: python3 scripts/check_import_safety.py --package agent_utilities

      # Bounded, cross-platform-relevant subset (see header comment for what
      # is excluded and why): venv sync/lock, KG single-instance/file locks,
      # lane arbitration, merge-queue, concept allocator -- every one of
      # them a fcntl/advisory-lock consumer -- plus tests/unit/core for
      # general platform-agnostic coverage.
      - name: Unit tests (cross-platform-relevant subset)
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        run: >-
          python3 -m pytest
          tests/unit/deployment
          tests/unit/knowledge_graph/core
          tests/unit/core
          tests/unit/test_lanes.py
          tests/unit/test_merge_queue.py
          tests/unit/test_concept_allocator.py
          -q -p no:cacheprovider -o addopts=""
          -m "not live and not engine and not slow and not certification and not quarantine"

      - name: Windows coverage summary
        if: always()
        run: |
          echo "## Windows coverage ran in report-only mode" >> "$GITHUB_STEP_SUMMARY"
          echo "Both steps above use `continue-on-error: true` -- a red step" >> "$GITHUB_STEP_SUMMARY"
          echo "here is a real Windows regression and never blocks a release;" >> "$GITHUB_STEP_SUMMARY"
          echo "release-blocking Windows coverage is numeric-runtime-gate in" >> "$GITHUB_STEP_SUMMARY"
          echo "release.yml. This job's unit-test step selects 119 of 1244" >> "$GITHUB_STEP_SUMMARY"
          echo "tests/unit test files (~9.6%) -- a deliberately bounded," >> "$GITHUB_STEP_SUMMARY"
          echo "cross-platform-relevant subset, not the whole suite. See" >> "$GITHUB_STEP_SUMMARY"
          echo "this file's header comment for exactly what is excluded" >> "$GITHUB_STEP_SUMMARY"
          echo "and why (engine/live/slow/certification/quarantine markers," >> "$GITHUB_STEP_SUMMARY"
          echo "AF_UNIX/systemd/Docker/self-hosted-host-dependent tests, and CI-minute" >> "$GITHUB_STEP_SUMMARY"
          echo "cost-scoping of the remaining ~90%)." >> "$GITHUB_STEP_SUMMARY"

  # ── GOC-84/GOC-16 -- connector-manifest freeze + diff report (BUG-234) ──────
  #
  # This is the KEYLESS half of the connector-manifest-signing custody path: it
  # regenerates the in-tree native connector manifest (no external fleet checkout,
  # no signing key needed -- `regenerate_and_sign_connector_manifests.py` without
  # --sign runs every generator in its existing --dry-run/temp-output mode) and
  # publishes exactly the frozen commit SHA + dependency-lock digest an operator
  # needs to run the REAL signing step. The report runs against a non-editable,
  # locally built wheel; its output is the one public review artifact uploaded by
  # this job. Signing itself never happens in GitHub Actions -- it happens in the
  # separate, human-triggered Kubernetes Job
  # (deploy/release/connector-manifest-signing-job.yaml), which holds the real key
  # via OpenBao workload identity, never a GitHub Actions secret. See
  # docs/release/connector-manifest-signing-custody.md for the full runbook this
  # job's output feeds.
  #
  # workflow_dispatch-only (see the `on:` block above): an operator runs this when
  # they want a fresh drift report, not on every push/PR -- regenerating the fleet
  # is a deliberate check, not a routine cost.
  connector-manifest-diff:
    name: Connector-manifest freeze + diff report (report only, never blocks, no key)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - *setup-python-312

      - *setup-uv-locked

      - *sdk-checkout

      # RF-ADR-009 (43197d7c6) deleted the `owl` extra (owlready2/pyshacl full
      # OWL-DL reasoning) when semantic authority moved to epistemic-graph;
      # scripts/generate_connector_manifests.py and
      # scripts/generate_native_connector_manifest.py only ever imported
      # rdflib for manifest compilation, which is the narrower `rdf` extra.
      - name: Sync environment (rdf extra for manifest compile)
        run: |
          uv sync --frozen --extra test --extra rdf \
            --no-install-package epistemic-graph \
            --no-install-package langfuse-agent
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build and install the report wheel (non-editable)
        run: |
          mkdir -p "$RUNNER_TEMP/connector-manifest-wheel" "$RUNNER_TEMP/connector-manifest-site"
          uv build --wheel --no-build-isolation --out-dir "$RUNNER_TEMP/connector-manifest-wheel"
          WHEEL="$(find "$RUNNER_TEMP/connector-manifest-wheel" -maxdepth 1 -type f -name 'agent_utilities-*.whl' -print -quit)"
          test -n "$WHEEL"
          # This venv is uv-managed and carries no `pip` module -- `python3 -m
          # pip install` dies before ever reaching the guard below, so step 6
          # silently ran against whatever agent_utilities happened to resolve
          # first on sys.path instead of this built wheel.
          uv pip install \
            --no-index --no-deps --only-binary=:all: \
            --target "$RUNNER_TEMP/connector-manifest-site" "$WHEEL"
          # Every local-path install (editable or not) carries a direct_url.json
          # per PEP 610 -- rejecting on its mere existence rejected every
          # install, editable or not. Parse it and reject only dir_info.editable.
          DIRECT_URL="$(find "$RUNNER_TEMP/connector-manifest-site" -name direct_url.json -print -quit)"
          if [ -n "$DIRECT_URL" ] && python3 -c "
          import json, sys
          with open(sys.argv[1]) as f:
              data = json.load(f)
          sys.exit(0 if data.get('dir_info', {}).get('editable') else 1)
          " "$DIRECT_URL"; then
            echo "editable installation is forbidden" >&2
            exit 1
          fi
          echo "PYTHONPATH=$RUNNER_TEMP/connector-manifest-site" >> "$GITHUB_ENV"

      - name: Assert the installed location is the built wheel
        run: |
          python3 -c "
          import agent_utilities, pathlib, os, sys
          installed = pathlib.Path(agent_utilities.__file__).resolve()
          target = pathlib.Path(os.environ['RUNNER_TEMP']).resolve() / 'connector-manifest-site'
          if target not in installed.parents:
              print(f'agent_utilities resolved from {installed}, not the built wheel under {target}', file=sys.stderr)
              sys.exit(1)
          print(f'agent_utilities resolved from the built wheel: {installed}')
          "

      - name: Freeze + regenerate (no key, no fleet -- native manifest only)
        id: diff
        continue-on-error: true
        run: |
          FROZEN_SHA="$(git rev-parse HEAD)"
          echo "frozen_sha=$FROZEN_SHA" >> "$GITHUB_OUTPUT"
          python3 scripts/release/regenerate_and_sign_connector_manifests.py \
            --frozen-sha "$FROZEN_SHA" \
            --native-output-dir "$RUNNER_TEMP/connector-manifest-native" \
            --require-built-artifact | tee /tmp/connector-manifest-diff-report.json # noqa

      - name: Upload diff report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: connector-manifest-diff-report
          path: /tmp/connector-manifest-diff-report.json
          retention-days: 30

      - name: Job summary -- what the operator does next
        if: always()
        run: |
          echo "## Connector-manifest freeze + diff report" >> "$GITHUB_STEP_SUMMARY"
          echo "Frozen commit: \`${{ steps.diff.outputs.frozen_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This job never touches the release signing key. To actually sign a" >> "$GITHUB_STEP_SUMMARY"
          echo "regenerated manifest, review the uploaded diff report artifact, then" >> "$GITHUB_STEP_SUMMARY"
          echo "an operator applies \`deploy/release/connector-manifest-signing-job.yaml\`" >> "$GITHUB_STEP_SUMMARY"
          echo "with this run's frozen commit SHA — see" >> "$GITHUB_STEP_SUMMARY"
          echo "\`docs/release/connector-manifest-signing-custody.md\` for the exact steps." >> "$GITHUB_STEP_SUMMARY"
