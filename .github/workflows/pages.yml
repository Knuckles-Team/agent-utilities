name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'scripts/docs_contract.py'
      - 'scripts/check_tracked_privacy.py'

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publish-pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # D-CIP-9: '3.x' floats to the runner's newest CPython. requires-python
          # is '>=3.12,<3.15' (pyproject.toml); every other workflow already pins
          # an explicit version ('3.12') for exactly this reason. Pin here too so
          # a future ubuntu-latest image shipping 3.15 breaks loudly in a version
          # bump review instead of silently the day the runner image rolls.
          python-version: '3.12'

      - name: Install package and MkDocs
        run: |
          pip install -e .
          pip install mkdocs-material mkdocs-awesome-pages-plugin

      - name: Build Docs
        run: |
          python3 scripts/docs_contract.py --check
          python3 scripts/check_tracked_privacy.py
          mkdocs build --strict

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
