name: Guardrails

# Plan 10: wire the guardrail gates into CI. Each gate defends a specific
# failure vector and has a meta-test (tests/gates/) proving it trips on a broken
# fixture. BLOCKING gates currently pass on main and red the build on regression.
# ADVISORY gates (continue-on-error) defend a vector whose pre-existing debt has
# not yet cleared; they warn but never red the build until that debt is paid.
#
# NOTE: this repo is standalone (polyrepo). Every gate runs from the repo root
# against this repo's own scripts/. Cross-repo / workspace-level gates
# (No-PyO3 lives in epistemic-graph; cross-UI parity lives at the workspace
# root) cannot run in isolated CI and are enforced by the pre-commit/workspace
# tooling instead, not here.

on:
  pull_request:
    paths:
      - 'agent_utilities/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'deploy/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'MANIFEST.in'
      - 'build_backend.py'
      - 'requirements*.txt'
      - 'agent_utilities/dependency-license-catalog.json'
      - '**/Dockerfile*'
      - '**/*compose*.yml'
      - '**/*compose*.yaml'
      - '**/*.stack.yml'
      - '**/*.stack.yaml'
      - '.pre-commit-config.yaml'
      - '.github/**'
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  guardrails:
    name: Guardrail gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Static source-contract lane only. Installed/runtime certification is the
      # publish pipeline's exact-wheel + epistemic-graph[full] numeric gate.
      - name: Sync immutable source-contract environment (no runtime engine)
        run: |
          uv sync --frozen --group guardrails \
            --no-install-package epistemic-graph \
            --no-install-package langfuse-agent
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # ---- BLOCKING gates (pass today; a regression reds the build) ----------

      - name: No-stub gate
        run: python3 scripts/check_no_stub.py

      - name: Concept-freshness gate
        run: python3 scripts/check_concepts.py

      - name: OKF-CIS domain-vocab gate (closed vocab + registered slugs)
        run: python3 scripts/check_domain_vocab.py agent_utilities

      - name: Prompt-schema gate (canonical StructuredPrompt + fresh prompt.schema.json)
        run: python3 scripts/check_prompt_schema.py

      - name: Genesis-manifest freshness gate
        run: python3 scripts/check_genesis_manifest.py

      - name: Ontology library gate (valid + connected, no unlinked/broken)
        run: python3 scripts/check_ontology.py

      - name: Skill-name collision gate (fleet-wide install-all uniqueness)
        run: python3 scripts/check_skill_name_collision.py

      - name: Retrieval-quality gate
        run: python3 scripts/check_retrieval_quality.py

      - name: Eval-corpus gate
        run: python3 scripts/check_eval_corpus.py

      - name: Reliability-corpus gate
        run: python3 scripts/check_reliability_corpus.py

      - name: Prod-profile guard
        run: python3 -m pytest tests/scale/test_prod_profile_guard.py -q -p no:cacheprovider -o addopts="" -k "prod or profile"

      - name: Gate meta-tests (prove every gate can fail)
        run: python3 -m pytest tests/gates -q -p no:cacheprovider -o addopts=""

      - name: Documentation contract gate
        run: python3 scripts/docs_contract.py --check

      - name: Epistemic Operations Protocol gate (catalog + Python projection)
        run: python3 scripts/check_epistemic_operations_protocol.py --self-only

      - name: Release version consistency gate
        run: python3 scripts/check_version_consistency.py

      - name: Production cell source contract
        run: python3 scripts/deployment/check_production_assets.py

      - name: Hardened Swarm source contract
        run: python3 scripts/deployment/check_swarm_assets.py --self-check

      - name: Tenant and identity source contract
        run: python3 scripts/security/check_tenant_identity_contract.py --self-check

      - name: Compatibility and release-train contract
        run: python3 scripts/release/check_compatibility.py --matrix-only

      - name: Public graph-boundary contract
        run: python3 scripts/check_public_graph_boundary.py

      - name: Engine-native ChangeEnvelope boundary
        run: python3 scripts/check_native_change_envelope_boundary.py

      - name: Universal external-graph connector contract
        run: python3 scripts/check_external_graph_contract.py

      - name: Current-only API and configuration contract
        run: python3 scripts/check_current_only_contract.py

      - name: Connector live-certification source contract
        run: python3 scripts/check_connector_live_certification.py --self-check

      - name: Exact-installed local certification source contract
        run: python3 scripts/check_exact_local_gates_harness.py

      - name: Exact local promoter behavioral contract
        run: python3 -m pytest tests/unit/release/test_promote_local_release.py tests/gates/test_exact_local_release_contract.py -q -p no:cacheprovider -o addopts=""

      - name: CI bootstrap and supply-chain policy behavioral contract
        run: python3 -m pytest tests/unit/scripts/test_run_guardrails_lean.py tests/unit/scripts/test_check_fleet_supply_chain.py -q -p no:cacheprovider -o addopts=""

      - name: Mandatory ContextCompiler boundary
        run: python3 scripts/check_context_compiler_boundary.py

      - name: Governed HTTP egress boundary
        run: python3 scripts/check_http_egress_boundary.py

      - name: Consolidated pre-bundled skill contract
        run: python3 scripts/check_prebundled_skills.py

      - name: Tracked artifact privacy gate
        run: python3 scripts/check_tracked_privacy.py

      - name: Software supply-chain source contract
        run: python3 scripts/check_fleet_supply_chain.py .

      - name: Dependency vulnerability audit (OSV, fail closed)
        run: python3 scripts/audit_dependencies.py uv.lock

      # BLOCKING: anti-sprawl (versioned clones, conflict artifacts, oversized
      # tracked binaries, merge dividers).
      - name: Anti-sprawl gate
        run: python3 scripts/check_sprawl.py

      # BLOCKING: config-flag anti-sprawl — no NEW bare os.environ.get("KG_/GRAPH_/
      # EPISTEMIC_...") outside core/config.py (ratchet vs scripts/env_flag_baseline.txt).
      - name: Config-flag anti-sprawl gate
        run: python3 scripts/check_no_env_sprawl.py

      # BLOCKING: liveness ratchet (CE-038) — no NEW dead pathways. Complements the
      # static check_wiring gate with the typed-seam/contract-drift + never-executed
      # layers; fails only on regression vs .liveness_baseline.json. Skips cleanly
      # if the code-enhancer skill (universal-skills) is not installed.
      - name: Liveness ratchet gate
        run: python3 scripts/check_liveness.py

      # ADVISORY: the coupling gate enforces that geniusbot imports
      # agent_utilities only via the allowlisted adapter seam. Kept advisory so
      # in-flight decoupling churn cannot red the build. Flip continue-on-error
      # to false once the adapter seam has stabilized.
      - name: Coupling gate (advisory)
        continue-on-error: true
        run: python3 scripts/check_coupling.py
