name: Release

# Publish only: a v* tag or a manual dispatch. CI (spec gates, harness gates, the
# 3.12 floor and the wheel build) runs as the pre-publish guard by calling
# ci.yml; publish and the GitHub release happen only from an exact vX.Y.Z tag
# push. A pull request never reaches this workflow.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish-pypi:
    name: publish to PyPI
    needs: ci
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meristem-dist
          path: dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Require tag, source and wheel versions to match
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not an exact vX.Y.Z tag: $TAG_NAME"; exit 1; }
          source_version="$(python3 -c "import ast,pathlib;m=ast.parse(pathlib.Path('agent_utilities/_version.py').read_text());print(next(n.value.value for n in m.body if isinstance(n,ast.Assign)))")"
          ls "dist/meristem-${TAG_NAME#v}-"*.whl >/dev/null
          [[ "${TAG_NAME#v}" == "$source_version" ]] || { echo "::error::tag $TAG_NAME != source $source_version"; exit 1; }
      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish dist/*

  github-release:
    name: GitHub release (links PyPI)
    needs: publish-pypi
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          printf '## meristem %s\n\nPublished to PyPI: https://pypi.org/project/meristem/%s/\n' "$version" "$version" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --latest --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --latest --title "$TAG" --generate-notes --notes-file "$RUNNER_TEMP/notes.md"
          fi
