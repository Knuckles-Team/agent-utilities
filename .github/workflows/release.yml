name: Release

# PRs and main qualify the exact installed engine candidate, the full suite,
# reproducible AU wheel, and Linux/Windows installed-wheel smokes. This is
# integration evidence; it does not establish public package availability.
# Tag pushes additionally require the public EG floor before building and clean
# public-only installs on both OSes before the unchanged protected publish chain.
# A public gate skipped on a candidate event is not a public-installability pass.
# advisory.yml retains its existing independent reporting responsibilities.

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'agent_utilities/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'MANIFEST.in'
      - 'build_backend.py'
      - '.github/workflows/release.yml'
      - 'docs/**'
      - '**/*.md'
      - '**/*.json'
      - '**/*.toml'
      - '**/*.yaml'
      - '**/*.yml'

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── STAGE 0: source-checkout clone gates. ───────────────────────────────
  # This job deliberately installs the exact native tools on an ephemeral
  # runner. The pre-commit hooks never download dependencies; this CI lane is
  # the reproducible provisioning boundary and is required by `build` below.
  clone-scanners:
    name: pinned clone scanners
    runs-on: ubuntu-24.04
    steps:
      # A pull_request's default checkout is a synthetic merge commit. Pin the
      # checkout to the immutable contributor SHA so the wrapper's HEAD and
      # the range resolved below describe the same candidate.
      - &release-checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - &sdk-checkout
        name: Checkout pinned Agent Connector SDK source
        uses: ./.github/actions/checkout-agent-connector-sdk

      - &release-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - &release-uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync source-checkout wrapper environment
        run: |
          set -euo pipefail
          uv sync --frozen \
            --no-install-package epistemic-graph \
            --no-install-package langfuse-agent
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Resolve immutable clone-gate range
        id: clone-range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          sha_re='^[0-9a-f]{40}$'

          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == push ]]; then
            base="$PUSH_BEFORE_SHA"
            head="$WORKFLOW_SHA"
          else
            echo "::error::unsupported event for immutable clone range: $EVENT_NAME"
            exit 1
          fi

          if [[ ! "$head" =~ $sha_re ]] || ! git cat-file -e "$head^{commit}"; then
            echo "::error::head is not a full commit SHA present in the checkout: $head"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$head" ]]; then
            echo "::error::checkout HEAD does not match the immutable candidate SHA"
            exit 1
          fi

          if [[ -z "$base" || "$base" == "$zero" ]]; then
            base="$(git rev-parse --verify "$head^" 2>/dev/null || git rev-list --max-parents=0 "$head")"
          fi
          if [[ ! "$base" =~ $sha_re ]] || ! git cat-file -e "$base^{commit}"; then
            echo "::error::base is not a full commit SHA present in the checkout: $base"
            exit 1
          fi

          {
            echo "base_sha=$base"
            echo "head_sha=$head"
          } >> "$GITHUB_OUTPUT"

      # The local installer pins provider source and verifies every cached build.
      - name: Restore pinned clone scanner toolchain
        id: scanner-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanners
          key: au-clone-scanners-${{ runner.os }}-${{ runner.arch }}-rust1.95.0-1.97.0-${{ hashFiles('scripts/install_scanners.sh') }}

      - name: Install exact clone scanner toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustup toolchain install 1.97.0 --profile minimal
          SCANNER_ROOT="$RUNNER_TEMP/scanners" bash scripts/install_scanners.sh

      - name: Save pinned clone scanner toolchain
        if: steps.scanner-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanners
          key: ${{ steps.scanner-cache.outputs.cache-primary-key }}

      - name: Record clone scanner provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clone-scanner-provenance
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/scanners/jscpd/*/bin/jscpd.provenance.json
            ${{ runner.temp }}/scanners/jscpd.sha256

      - name: Dupehound changed-function gate
        env:
          CX_DUP_BASE_REF: ${{ steps.clone-range.outputs.base_sha }}
          CX_DUP_HEAD_REF: ${{ steps.clone-range.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CX_DUP_HEAD_REF"
          python3 scripts/check_dupehound.py --base-ref "$CX_DUP_BASE_REF"

      - name: jscpd changed-block gate
        env:
          CX_DUP_BASE_REF: ${{ steps.clone-range.outputs.base_sha }}
          CX_DUP_HEAD_REF: ${{ steps.clone-range.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CX_DUP_HEAD_REF"
          python3 scripts/check_duplication.py enforce --base-ref "$CX_DUP_BASE_REF"

      - name: jscpd full-tree census (advisory evidence)
        run: python3 scripts/check_duplication.py census

  # Public availability is a release prerequisite. Keep it independent so a
  # missing release never hides the engine-present full-suite evidence.
  engine-release-order:
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    name: epistemic-graph release is resolvable on PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify required epistemic-graph release is resolvable on PyPI
        run: python3 scripts/release/check_eg_pypi_resolvable.py

  # ── STAGE 1: release-critical checks only. Nothing else may live here. ──
  gates:
    name: gates
    outputs:
      engine-contract: ${{ steps.candidate-receipts.outputs.contract }}
    runs-on: ubuntu-latest
    env:
      # Frozen 2.27 Linux x86_64 wheel, built by epistemic-graph's OWN release
      # workflow at source commit 7f5179650d87e6f763b129cfeea6dfb4f8b0273b
      # (Knuckles-Team/epistemic-graph PR #35). That workflow run's overall
      # conclusion is "cancelled" (its macOS legs were cancelled after this
      # Linux wheel job had already completed and uploaded -- see the pull
      # request description for the full per-job evidence), but the artifact
      # itself is untouched and not expired.
      #
      # Artifact expires 2026-12-30T16:03:35Z. Before then, either re-pin all
      # values below from a current successful epistemic-graph release
      # run, or -- preferably -- switch this job to installing the published
      # PyPI package once epistemic-graph 2.27 ships there.
      EG_REPOSITORY_ID: "1248541673"
      EG_WORKFLOW_ID: "333719087"
      EG_RUN_ATTEMPT: "1"
      EG_LINUX_JOB_ID: "110489463714"
      EG_WINDOWS_JOB_ID: "110489401420"
      EG_WINDOWS_ARTIFACT_ID: "11193049469"
      EG_WINDOWS_FILENAME: "epistemic_graph-2.27.0-py3-none-win_amd64.whl"
      EG_WINDOWS_SHA256: "88cf9acd0a32edd22ae495e523120ad3e0e445bbd2b06d5962e1f5a2b3d55286"
      EG_WHEEL_SOURCE: "7f5179650d87e6f763b129cfeea6dfb4f8b0273b"
      EG_WHEEL_RUN_ID: "36889097785"
      EG_WHEEL_ARTIFACT_ID: "11196548715"
      EG_WHEEL_ARTIFACT_NAME: "wheel-linux-x86_64"
      EG_WHEEL_FILENAME: "epistemic_graph-2.27.0-py3-none-manylinux_2_28_x86_64.whl"
      EG_WHEEL_SHA256: "b8c805e54c68f57623c8a99f76ad25e2bc0f3d23b9056fc7c0434f8c1c0b36d3"
    permissions:
      contents: read
      # Read the preserved engine wheel artifact from the epistemic-graph repository.
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - *sdk-checkout

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # ---- Secret-history scan (D-CIP-13). Stdlib-only; no environment sync
      # needed yet. Scans the patch text actually introduced by this push/PR
      # against origin/main (or the merge-base for a PR) for credential-shaped
      # content. Was previously wired ONLY as a local pre-push pre-commit
      # hook ("CI parity" in name only) with no CI enforcement at all.
      - name: Secret-history scan (D-CIP-13)
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            if git rev-parse --verify --quiet HEAD~1 >/dev/null; then
              BASE="HEAD~1"
            else
              BASE="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi
          echo "Scanning ${BASE}..HEAD for credential-shaped content"
          python3 scripts/security/check_secret_history.py --base "$BASE"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install reviewed source-freeze tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          python3 - <<'PYTHON'
          from scripts.source_freeze_gate import _resolve_reviewed_tool

          for name in ("git", "rg"):
              print(f"{name}: {_resolve_reviewed_tool(name)}")
          PYTHON

      # Install the test plugins from the locked test extra, then install the
      # verified engine wheel below. Engine-dependent tests run in this job;
      # their failures remain part of the gate and require attribution.
      - name: Sync test environment (the engine wheel is installed next)
        run: |
          uv sync --frozen --extra test --group guardrails \
            --no-install-package epistemic-graph \
            --no-install-package langfuse-agent
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Check authoritative producer metadata before executing any engine bytes.
      # The pinned overall run was cancelled; only these successful producer
      # jobs qualify. A fork PR has the same read-only acquisition requirements.
      - name: Verify official candidate producer provenance
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          import datetime
          import json
          import os
          import subprocess
          from pathlib import Path

          repository = "Knuckles-Team/epistemic-graph"
          repository_id = int(os.environ["EG_REPOSITORY_ID"])
          run_id = int(os.environ["EG_WHEEL_RUN_ID"])
          attempt = int(os.environ["EG_RUN_ATTEMPT"])
          source = os.environ["EG_WHEEL_SOURCE"]

          def api(endpoint):
              return json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{repository}/{endpoint}"], text=True
              ))

          def require(actual, expected, boundary):
              for key, value in expected.items():
                  if type(actual.get(key)) is not type(value) or actual[key] != value:
                      raise SystemExit(f"candidate {boundary} mismatch: {key}")

          run = api(f"actions/runs/{run_id}/attempts/{attempt}")
          require(run, {
              "id": run_id, "run_attempt": attempt, "head_sha": source,
              "workflow_id": int(os.environ["EG_WORKFLOW_ID"]),
              "path": ".github/workflows/release.yml", "event": "push",
              "head_branch": "v2.27.0", "status": "completed",
              "conclusion": "cancelled",
          }, "producer run")
          for key in ("repository", "head_repository"):
              require(run[key], {"id": repository_id, "full_name": repository}, key)

          contract = {
              "ubuntu-latest": {
                  "platform": "linux-x86_64",
                  "job_id": int(os.environ["EG_LINUX_JOB_ID"]),
                  "job_name": "wheel linux-x86_64 / wheel linux-x86_64 (trusted tag)",
                  "artifact_id": int(os.environ["EG_WHEEL_ARTIFACT_ID"]),
                  "artifact_name": os.environ["EG_WHEEL_ARTIFACT_NAME"],
                  "filename": os.environ["EG_WHEEL_FILENAME"],
                  "sha256": os.environ["EG_WHEEL_SHA256"],
              },
              "windows-latest": {
                  "platform": "windows-x86_64",
                  "job_id": int(os.environ["EG_WINDOWS_JOB_ID"]),
                  "job_name": "wheel windows-x86_64",
                  "artifact_id": int(os.environ["EG_WINDOWS_ARTIFACT_ID"]),
                  "artifact_name": "wheel-windows-x86_64",
                  "filename": os.environ["EG_WINDOWS_FILENAME"],
                  "sha256": os.environ["EG_WINDOWS_SHA256"],
              },
          }
          candidate = os.environ["EVENT_NAME"] == "pull_request" or (
              os.environ["EVENT_NAME"] == "push"
              and os.environ["EVENT_REF"] == "refs/heads/main"
          )
          for runner, pin in contract.items():
              if runner == "windows-latest" and not candidate:
                  continue
              job = api(f"actions/jobs/{pin['job_id']}")
              require(job, {
                  "id": pin["job_id"], "name": pin["job_name"],
                  "run_id": run_id, "run_attempt": attempt, "head_sha": source,
                  "status": "completed", "conclusion": "success",
                  "run_url": f"https://api.github.com/repos/{repository}/actions/runs/{run_id}",
              }, "producer job")
              uploads = [step for step in job["steps"] if step["name"] == "Upload wheel artifact"]
              if len(uploads) != 1 or uploads[0]["conclusion"] != "success":
                  raise SystemExit("candidate producer upload did not succeed")
              artifact = api(f"actions/artifacts/{pin['artifact_id']}")
              require(artifact, {"id": pin["artifact_id"], "name": pin["artifact_name"], "expired": False}, "artifact")
              require(artifact["workflow_run"], {
                  "id": run_id, "head_sha": source,
                  "repository_id": repository_id, "head_repository_id": repository_id,
              }, "artifact producer")
              timestamps = [datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))
                            for value in (job["started_at"], artifact["created_at"], job["completed_at"])]
              if not timestamps[0] <= timestamps[1] <= timestamps[2]:
                  raise SystemExit("candidate artifact is outside the pinned producer attempt")
              pin.update(repository=repository, repository_id=repository_id,
                         head_repository_id=repository_id, run_id=run_id,
                         run_attempt=attempt, source=source,
                         workflow_id=int(os.environ["EG_WORKFLOW_ID"]))
          Path("engine-contract.json").write_text(json.dumps(contract, sort_keys=True))

      # Two download attempts, same artifact, no retries beyond that: `gh run
      # download` first (simplest, handles pagination/zip extraction itself),
      # then the raw REST zip endpoint if that fails -- most likely because
      # the default GITHUB_TOKEN issued to this workflow has no read access to
      # a DIFFERENT repository's Actions artifacts even though
      # epistemic-graph is public. Either way this fails closed: a missing or
      # inaccessible artifact stops the job with the real HTTP/CLI error, it
      # never falls back to a different build.
      - name: Download frozen epistemic-graph Linux wheel artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p eg-wheel
          gh api "repos/Knuckles-Team/epistemic-graph/actions/artifacts/${EG_WHEEL_ARTIFACT_ID}" > eg-wheel-identity.json
          python -I scripts/release/verify_test_engine.py artifact eg-wheel-identity.json \
            --id "$EG_WHEEL_ARTIFACT_ID" --name "$EG_WHEEL_ARTIFACT_NAME" \
            --run "$EG_WHEEL_RUN_ID" --source "$EG_WHEEL_SOURCE"
          echo "Attempting cross-repo artifact download via gh CLI..."
          if gh run download "$EG_WHEEL_RUN_ID" \
              -R Knuckles-Team/epistemic-graph \
              -n "$EG_WHEEL_ARTIFACT_NAME" \
              --dir eg-wheel 2>gh-download.err; then
            echo "gh run download succeeded"
          else
            echo "::warning::gh run download failed; falling back to the REST artifact zip endpoint"
            cat gh-download.err >&2
            rm -rf eg-wheel && mkdir -p eg-wheel
            http_status="$(curl --location --proto '=https' --proto-redir '=https' -sS -w '%{http_code}' -o eg-wheel/artifact.zip \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/Knuckles-Team/epistemic-graph/actions/artifacts/${EG_WHEEL_ARTIFACT_ID}/zip")"
            if [ "$http_status" != "200" ]; then
              echo "::error::Both download methods failed for epistemic-graph run $EG_WHEEL_RUN_ID artifact $EG_WHEEL_ARTIFACT_NAME (REST status $http_status). The default GITHUB_TOKEN most likely cannot read Actions artifacts from a different repository; response body follows."
              cat eg-wheel/artifact.zip || true
              exit 1
            fi
            (cd eg-wheel && unzip -oq artifact.zip && rm -f artifact.zip)
          fi
          ls -la eg-wheel

      - name: Verify downloaded wheel sha256
        run: |
          set -euo pipefail
          python -I scripts/release/verify_test_engine.py wheel "eg-wheel/${EG_WHEEL_FILENAME}" \
            --filename "$EG_WHEEL_FILENAME" --sha256 "$EG_WHEEL_SHA256"

      - name: Install the frozen epistemic-graph[full] wheel
        run: |
          set -euo pipefail
          wheel_url="$(python -I -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve().as_uri())' "eg-wheel/${EG_WHEEL_FILENAME}")"
          uv pip install --reinstall-package epistemic-graph --python "$PWD/.venv/bin/python" \
            "epistemic-graph[full] @ ${wheel_url}#sha256=${EG_WHEEL_SHA256}"

      - name: Assert the real engine is importable
        run: |
          .venv/bin/python -I scripts/release/verify_test_engine.py installed "eg-wheel/${EG_WHEEL_FILENAME}" \
            --sha256 "$EG_WHEEL_SHA256"

      # ---- THE test suite. pytest.ini's testpaths covers the whole `tests/`
      # tree (gates, scale, unit, integration, security, retrieval, ...) in
      # ONE run, which is what previously ran as ~6 separately-invoked
      # subsets scattered across guardrails.yml/security.yml/pipeline.yml
      # (gate meta-tests, prod-profile guard, exact-local-release-contract,
      # CI-bootstrap contract, parser fuzzing, auth negative paths, tenant
      # isolation, ...). Consolidating onto pytest.ini's own testpaths is
      # what makes the async-drift fix (above) apply uniformly instead of
      # needing to be replicated at N call sites.
      #
      # `-n auto` (pytest-xdist, already a declared dependency) is the
      # dominant lever on the suite's 36-47min serial wall-clock: this job
      # runs with the verified real engine installed above. Engine-dependent
      # test failures remain blocking and require their own attribution.
      #
      # `--dist loadfile` here (not `loadgroup`) is deliberate, and matches
      # pytest.ini's addopts exactly -- CLI args win over addopts (pytest's
      # own precedence), so a prior version of this line that passed
      # `--dist loadgroup` silently overrode pytest.ini's `loadfile` and made
      # CI run under a DIFFERENT distribution than every local/pre-push run.
      # That is precisely the class of bug pytest.ini's own comment warns
      # about: order-dependent module state turning into flakes once tests
      # are split across workers.
      #
      # Why loadfile is the correct mode, not loadgroup: `loadgroup` is a
      # superset of `load` (dynamic item-level balancing) that ADDITIONALLY
      # colocates tests explicitly marked `@pytest.mark.xdist_group` -- but
      # as of this fix only ONE file in the whole 17k+-test suite
      # (tests/integration/protocols/test_a2a_epistemic_live.py) carries that
      # mark. Every other file's order-dependent module state (e.g. the
      # process-wide intent-surface-resolution-cache in tests/conftest.py)
      # had NO protection under `loadgroup` -- `load`'s item-level balancing
      # is free to split a file's tests across workers and interleave them
      # with unrelated tests, which is exactly what pytest.ini's `loadfile`
      # comment says must not happen. `loadfile` keeps every test in a file
      # on one worker, in collection order, for the WHOLE suite -- a strictly
      # stronger, already-proven-green guarantee (it's what every local and
      # pre-push run has used) -- and it does so without needing per-test
      # `xdist_group` marks: a module-scoped fixture (e.g. the real-engine
      # binary in test_a2a_epistemic_live.py, the original reason
      # `loadgroup` was chosen) only pays its startup cost once per worker
      # under `loadfile` too, since all of that file's tests already land on
      # the same worker. The `xdist_group` mark on that file is therefore
      # redundant under `loadfile` (inert, harmless to leave in place) rather
      # than load-bearing.
      - name: Test suite
        run: python3 -m pytest -q -n auto --dist loadfile

      - name: Acquire verified Windows candidate for installed-wheel smoke
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref == 'refs/heads/main')
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          pin = json.loads(Path("engine-contract.json").read_text())["windows-latest"]
          directory = Path("eg-wheel-windows")
          directory.mkdir()
          endpoint = f"repos/{pin['repository']}/actions/artifacts/{pin['artifact_id']}"
          metadata = subprocess.check_output(["gh", "api", endpoint])
          identity = directory / "identity.json"
          identity.write_bytes(metadata)
          verifier = [sys.executable, "-I", "scripts/release/verify_test_engine.py"]
          subprocess.check_call(verifier + ["artifact", str(identity), "--id", str(pin["artifact_id"]),
              "--name", pin["artifact_name"], "--run", str(pin["run_id"]), "--source", pin["source"]])
          archive = directory / "artifact.zip"
          with archive.open("wb") as output:
              subprocess.check_call(["gh", "api", endpoint + "/zip"], stdout=output)
          with zipfile.ZipFile(archive) as bundle:
              if bundle.namelist() != [pin["filename"]]:
                  raise SystemExit("candidate Windows archive must contain only its pinned wheel")
              bundle.extract(pin["filename"], directory)
          subprocess.check_call(verifier + ["wheel", str(directory / pin["filename"]),
              "--filename", pin["filename"], "--sha256", pin["sha256"]])

      - name: Bind candidate artifacts to this qualification run
        id: candidate-receipts
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref == 'refs/heads/main')
        shell: python
        env:
          CONSUMER_SOURCE: ${{ github.sha }}
        run: |
          import json
          import os
          from pathlib import Path

          contract = json.loads(Path("engine-contract.json").read_text())
          for runner, directory in (("ubuntu-latest", "eg-wheel"), ("windows-latest", "eg-wheel-windows")):
              receipt = {"engine": contract[runner], "runner": runner,
                         "repository": os.environ["GITHUB_REPOSITORY"],
                         "run_id": os.environ["GITHUB_RUN_ID"],
                         "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                         "source": os.environ["CONSUMER_SOURCE"]}
              Path(directory, "candidate-receipt.json").write_text(json.dumps(receipt, sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("contract=" + json.dumps(contract, sort_keys=True) + "\n")

      - name: Preserve qualified Linux candidate
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eg-candidate-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-latest
          path: |
            eg-wheel/${{ env.EG_WHEEL_FILENAME }}
            eg-wheel/candidate-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Preserve qualified Windows candidate
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eg-candidate-${{ github.run_id }}-${{ github.run_attempt }}-windows-latest
          path: |
            eg-wheel-windows/${{ env.EG_WINDOWS_FILENAME }}
            eg-wheel-windows/candidate-receipt.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: build
    needs: [gates, clone-scanners, engine-release-order]
    if: >-
      ${{ !cancelled() && needs.gates.result == 'success' &&
          needs.clone-scanners.result == 'success' &&
          (((github.event_name == 'pull_request' ||
             (github.event_name == 'push' && github.ref_type == 'branch' && github.ref == 'refs/heads/main')) &&
            needs.engine-release-order.result == 'skipped') ||
           (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') &&
            needs.engine-release-order.result == 'success')) }}
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - *sdk-checkout

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: uv.lock

      # A wheel build does not import its runtime engine. This installs
      # exactly this wheel's declared epistemic-graph[full] dependency
      # metadata, not the engine itself.
      - name: Sync immutable wheel-build environment (no runtime engine)
        run: |
          uv sync --frozen --group guardrails --group build \
            --no-install-package epistemic-graph \
            --no-install-package langfuse-agent
      - name: Build primary wheel from the validated source revision
        run: uv build --wheel --no-build-isolation --out-dir dist-primary
      - name: Build reproduction wheel from the same source revision
        run: uv build --wheel --no-build-isolation --out-dir dist-reproduction
      - name: Validate both packaged release candidates
        run: |
          uv run --no-sync python -m pytest tests/gates/test_exact_local_release_contract.py -q -p no:cacheprovider -o addopts=""
          uv run --no-sync python scripts/release/check_release_wheel.py dist-primary/agent_utilities-*.whl
          uv run --no-sync python scripts/release/check_release_wheel.py dist-reproduction/agent_utilities-*.whl
          uv run --no-sync python scripts/check_wheel_privacy.py dist-primary/agent_utilities-*.whl
          uv run --no-sync python scripts/check_wheel_privacy.py dist-reproduction/agent_utilities-*.whl
      - name: Require byte-identical wheels and stage the sole candidate
        run: |
          python -c "from hashlib import sha256; from pathlib import Path; primary=sorted(Path('dist-primary').glob('agent_utilities-*.whl')); reproduction=sorted(Path('dist-reproduction').glob('agent_utilities-*.whl')); assert len(primary)==len(reproduction)==1, 'release wheel cardinality mismatch'; assert primary[0].name==reproduction[0].name, 'release wheel filename mismatch'; assert sha256(primary[0].read_bytes()).digest()==sha256(reproduction[0].read_bytes()).digest(), 'release wheel digest mismatch'; print('release_wheel_reproducibility=passed')"
          mkdir dist
          cp dist-primary/agent_utilities-*.whl dist/
      - name: Upload the sole publish candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-utilities-wheel
          path: dist/agent_utilities-*.whl
          if-no-files-found: error
          retention-days: 7

  # Both OS legs prove the exact AU wheel. Candidate events install the
  # qualified same-run engine; tags resolve all dependencies from public PyPI.
  numeric-runtime-gate:
    name: numeric runtime (${{ matrix.os }})
    needs: [build, gates]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.gates.result == 'success' &&
          (github.event_name == 'pull_request' ||
           (github.event_name == 'push' && github.ref_type == 'branch' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - *release-python
      - *release-uv
      - name: Download the sole publish candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-utilities-wheel
          path: dist
      - name: Download this run's qualified engine candidate
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref == 'refs/heads/main')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: eg-candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
          path: engine-candidate
      # Python's checked subprocesses fail immediately on both Windows and
      # Linux; a later native command cannot overwrite an earlier failure.
      - name: Install exact Agent Utilities wheel with declared full engine
        id: runtime-install
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          CONSUMER_SOURCE: ${{ github.sha }}
          MATRIX_OS: ${{ matrix.os }}
          ENGINE_CONTRACT: ${{ needs.gates.outputs.engine-contract }}
        run: |
          import json
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          candidate = os.environ["EVENT_NAME"] == "pull_request" or (
              os.environ["EVENT_NAME"] == "push" and os.environ["REF_TYPE"] == "branch"
              and os.environ["EVENT_REF"] == "refs/heads/main"
          )
          public = (os.environ["EVENT_NAME"] == "push" and os.environ["REF_TYPE"] == "tag"
                    and os.environ["REF_NAME"].startswith("v")
                    and os.environ["EVENT_REF"] == "refs/tags/" + os.environ["REF_NAME"])
          if not (candidate or public):
              raise SystemExit("unsupported qualification event")
          wheels = list(Path("dist").glob("agent_utilities-*.whl"))
          if len(wheels) != 1 or wheels[0].is_symlink() or not wheels[0].is_file():
              raise SystemExit("expected exactly one regular AU wheel")
          requirements = [str(wheels[0].resolve())]
          verifier = str(Path("scripts/release/verify_test_engine.py").resolve())
          if candidate:
              runner = os.environ["MATRIX_OS"]
              pin = json.loads(os.environ["ENGINE_CONTRACT"])[runner]
              receipt = json.loads(Path("engine-candidate/candidate-receipt.json").read_text())
              expected = {"engine": pin, "runner": runner,
                          "repository": os.environ["GITHUB_REPOSITORY"],
                          "run_id": os.environ["GITHUB_RUN_ID"],
                          "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                          "source": os.environ["CONSUMER_SOURCE"]}
              if receipt != expected:
                  raise SystemExit("candidate receipt OS, producer, source or run mismatch")
              engine = Path("engine-candidate", pin["filename"])
              subprocess.check_call([sys.executable, "-I", verifier, "wheel", str(engine),
                                     "--filename", pin["filename"], "--sha256", pin["sha256"]])
              engine = engine.resolve()
              requirements.append(f"epistemic-graph[full] @ {engine.as_uri()}#sha256={pin['sha256']}")
          # Ignore user/project resolver configuration and every inherited
          # installer/Python override. The fresh venv has no system packages;
          # --no-cache prevents a prior candidate wheel rescuing a public miss.
          clean = {key: value for key, value in os.environ.items()
                   if not key.upper().startswith(("UV_", "PIP_", "PYTHON", "CONDA_"))
                   and key.upper() not in {"VIRTUAL_ENV", "VIRTUAL_ENV_PROMPT"}}
          directory = Path(tempfile.mkdtemp(prefix="au-runtime-", dir=os.environ["RUNNER_TEMP"]))
          subprocess.check_call([sys.executable, "-I", "-m", "venv", str(directory)], env=clean)
          python = directory / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          uv = shutil.which("uv")
          if uv is None:
              raise SystemExit("pinned uv executable is missing")
          subprocess.check_call([uv, "--no-config", "--no-cache", "pip", "install",
                                 "--python", str(python), "--index-url", "https://pypi.org/simple",
                                 *requirements], env=clean, cwd=directory)
          if candidate:
              subprocess.check_call([str(python), "-I", verifier, "installed", str(engine),
                                     "--sha256", pin["sha256"]], env=clean, cwd=directory)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("python=" + str(python) + "\n")
      - name: Smoke installed numeric runtime outside the checkout
        working-directory: ${{ runner.temp }}
        shell: python
        env: &installed-runtime-env
          RUNTIME_PYTHON: ${{ steps.runtime-install.outputs.python }}
        run: |
          import os
          import subprocess

          subprocess.check_call([os.environ["RUNTIME_PYTHON"], "-I",
              os.path.join(os.environ["GITHUB_WORKSPACE"], "scripts/check_numeric_runtime.py")])
      - name: Smoke installed Langfuse privacy support outside the checkout
        working-directory: ${{ runner.temp }}
        shell: python
        env: *installed-runtime-env
        run: |
          import os
          import subprocess

          subprocess.check_call([os.environ["RUNTIME_PYTHON"], "-I", "-c",
              "import agent_utilities.observability.langfuse_trust; import agent_utilities.security.persistence_privacy"])

  # ── STAGE 4: publish to PyPI. Needs: numeric-runtime-gate (which needs:
  # build, which needs: gates) — publishing is unreachable if any earlier
  # stage failed. D-ORC-10 combines the protected environment with an exact
  # vX.Y.Z tag/version/commit identity check on the tagged commit.
  publish-pypi:
    needs: numeric-runtime-gate
    # Main pushes and pull requests run candidate validation/build/runtime
    # gates; tag pushes also require public dependency closure. Publishing is reachable only from an explicit release-tag
    # push; the exact semver/tag/commit checks below remain the fail-closed
    # boundary before the protected environment is used.
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    # D-ORC-10: publishing is irreversible (PyPI versions can be yanked but never
    # reused) so it must never be a side effect of an ordinary green push to main.
    # Gate 1 (native): `environment:` enables GitHub's required-reviewers /
    # wait-timer protection rules. Configure them once in
    # Settings > Environments > pypi-publish; until an admin does, this line
    # alone does not block anything, which is why gate 2 exists.
    # Gate 2 (structural, no external config needed): refuse to publish unless
    # the exact commit that passed the gates+build+numeric-runtime-gate chain
    # is also pointed at by the exact `vX.Y.Z` tag whose wheel version matches.
    environment: pypi-publish
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Download the sole publish candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-utilities-wheel
          path: dist

      - name: Require exact release tag, source version, and wheel version
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          TAG_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          semver_re='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ "$EVENT_NAME" != "push" || "$REF_TYPE" != "tag" \
            || "$REF" != refs/tags/* || ! "$TAG_NAME" =~ $semver_re ]]; then
            echo "::error::D-ORC-10 release gate: publish requires a push of an exact vX.Y.Z tag; got event=$EVENT_NAME ref_type=$REF_TYPE ref=$REF"
            exit 1
          fi

          tag_ref_json="$(gh api "repos/${REPOSITORY}/git/ref/tags/${TAG_NAME}")"
          tag_object_type="$(jq -er '.object.type' <<<"$tag_ref_json")"
          tag_object_sha="$(jq -er '.object.sha' <<<"$tag_ref_json")"
          case "$tag_object_type" in
            commit)
              tag_commit="$tag_object_sha"
              ;;
            tag)
              tag_commit="$(gh api "repos/${REPOSITORY}/git/tags/${tag_object_sha}" \
                | jq -er 'select(.object.type == "commit") | .object.sha')"
              ;;
            *)
              echo "::error::D-ORC-10 release gate: tag ref resolved to unsupported object type $tag_object_type"
              exit 1
              ;;
          esac
          if [[ "$tag_commit" != "$HEAD_SHA" ]]; then
            echo "::error::D-ORC-10 release gate: tag $TAG_NAME resolves to $tag_commit, but the validated commit is $HEAD_SHA"
            exit 1
          fi
          checkout_commit="$(git rev-parse --verify "${TAG_NAME}^{commit}")"
          if [[ "$checkout_commit" != "$HEAD_SHA" ]]; then
            echo "::error::D-ORC-10 release gate: checkout tag $TAG_NAME resolves to $checkout_commit, not $HEAD_SHA"
            exit 1
          fi

          source_version="$(python3 - <<'PY'
          import ast
          from pathlib import Path

          module = ast.parse(
              Path("agent_utilities/_version.py").read_text(encoding="utf-8")
          )
          for node in module.body:
              if not isinstance(node, ast.Assign):
                  continue
              if not any(
                  isinstance(target, ast.Name) and target.id == "__version__"
                  for target in node.targets
              ):
                  continue
              if isinstance(node.value, ast.Constant) and isinstance(
                  node.value.value, str
              ):
                  print(node.value.value)
                  break
          else:
              raise SystemExit("agent_utilities/_version.py has no string __version__")
          PY
          )"

          mapfile -t wheels < <(
            find dist -maxdepth 1 -type f -name 'agent_utilities-*.whl' -print | sort
          )
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::release identity gate: expected exactly one wheel, found ${#wheels[@]}"
            exit 1
          fi
          wheel_path="${wheels[0]}"
          wheel_version="$(python3 - "$wheel_path" <<'PY'
          import sys
          from email.parser import Parser
          from pathlib import Path
          from zipfile import ZipFile

          wheel = Path(sys.argv[1])
          with ZipFile(wheel) as archive:
              metadata_files = [
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_files) != 1:
                  raise SystemExit(
                      f"expected one wheel METADATA file, found {metadata_files!r}"
                  )
              metadata = Parser().parsestr(
                  archive.read(metadata_files[0]).decode("utf-8")
              )
          if metadata.get("Name") != "agent-utilities":
              raise SystemExit(f"wheel name is not agent-utilities: {metadata.get('Name')!r}")
          version = metadata.get("Version")
          if not version:
              raise SystemExit("wheel metadata has no Version")
          print(version)
          PY
          )"

          tag_version="${TAG_NAME#v}"
          if [[ "$tag_version" != "$source_version" \
            || "$tag_version" != "$wheel_version" ]]; then
            echo "::error::release identity gate: tag=$TAG_NAME source=$source_version wheel=$wheel_version"
            exit 1
          fi
          echo "release identity verified: tag=$TAG_NAME version=$tag_version commit=$HEAD_SHA wheel=$(basename "$wheel_path")"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'
      - name: Publish the exact wheel validated on Linux and Windows
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple dist/agent_utilities-*.whl

      - name: Verify exact version and wheel on PyPI
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${EXPECTED_TAG#v}"
          mapfile -t wheels < <(
            find dist -maxdepth 1 -type f -name 'agent_utilities-*.whl' -print | sort
          )
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::PyPI verification: expected exactly one wheel, found ${#wheels[@]}"
            exit 1
          fi
          expected_wheel_name="$(basename "${wheels[0]}")"
          for attempt in $(seq 1 12); do
            if EXPECTED_WHEEL_NAME="$expected_wheel_name" python3 - "$expected_version" <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          version = sys.argv[1]
          expected_wheel = os.environ["EXPECTED_WHEEL_NAME"]
          url = f"https://pypi.org/pypi/agent-utilities/{version}/json"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:  # noqa: S310
                  payload = json.load(response)
          except (
              urllib.error.HTTPError,
              urllib.error.URLError,
              TimeoutError,
              json.JSONDecodeError,
          ) as exc:
              print(f"PyPI exact-version check not ready: {exc}", file=sys.stderr)
              raise SystemExit(1) from exc

          info = payload.get("info") or {}
          if info.get("name") != "agent-utilities" or info.get("version") != version:
              print(
                  "PyPI returned a mismatched project/version: "
                  f"name={info.get('name')!r} version={info.get('version')!r}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          releases = payload.get("releases") or {}
          if version not in releases:
              print(f"PyPI has no exact release key for {version}", file=sys.stderr)
              raise SystemExit(1)
          if not any(
              item.get("filename") == expected_wheel
              for item in (payload.get("urls") or [])
          ):
              print(
                  f"PyPI {version} has no published wheel named {expected_wheel}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print(f"PyPI exact release verified: agent-utilities=={version}")
          PY
            then
              exit 0
            fi
            if (( attempt < 12 )); then
              sleep 10
            fi
          done
          echo "::error::PyPI exact-version verification failed after publication for agent-utilities==$expected_version"
          exit 1

  # BUG-072: the docker publish needs its OWN approval gate, not an inherited one.
  #
  # The previous design had `publish-docker` declare no `environment:` and rely on
  # `needs: publish-pypi`, justified by the claim that the protection rule lives in
  # the called `container_pipeline.yml`. That claim is FALSE, verified twice: the
  # file is 154 lines with no `environment:` key, and `git log --all -S"environment:"`
  # shows the string has never existed in its history on any branch. So the gate on
  # an effectively irreversible action -- a pulled `:latest` cannot be un-pulled --
  # was guarding nothing.
  #
  # `needs:` alone only proves ORDERING, not that a reviewer approved *this* step:
  # a single pypi-publish approval was silently authorizing the container push too.
  #
  # The constraint that produced the original mistake is real: a job using `uses:`
  # accepts only name/uses/with/secrets/needs/if/permissions/strategy/concurrency,
  # and adding `environment:` there makes the parser treat it as a normal job,
  # failing with "Unexpected value 'uses'" and taking the WHOLE file down.
  # A plain wrapper job sidesteps that -- it can legitimately declare `environment:`
  # -- and `publish-docker` then gates on it.
  #
  # NOTE: the `docker-publish` environment must have required reviewers configured
  # in Settings -> Environments. Until it does, the key exists but enforces nothing.
  # That caveat applied to the pre-existing `pypi-publish` gate too.
  docker-publish-approval:
    needs: publish-pypi
    runs-on: ubuntu-latest
    environment: docker-publish
    steps:
      - name: Approval checkpoint for an irreversible container publish
        run: echo "docker-publish environment approved; proceeding to container publish"

  publish-docker:
    needs: docker-publish-approval
    # SC-GHA-001 (this repo's own supply-chain-source-contract gate) requires every
    # external reusable workflow pinned to a full commit SHA, never a floating branch
    # ref -- so unlike epistemic-graph/agent-webui (no such gate), this cannot be
    # `@main`. Use the reviewed merged provider also pinned by the scanner installer.
    uses: Knuckles-Team/pipelines/.github/workflows/container_pipeline.yml@c0a089c83eea9d0d08f48e6c00681eb989268d9a # pipelines-hooks 2.0.2
    permissions:
      contents: read
    secrets:
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
