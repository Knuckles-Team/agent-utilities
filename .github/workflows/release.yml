name: Release

# One workflow: spec gates and the harness gates (ruff, format, mypy, tests)
# on every pull request and main push; build on every run; publish to PyPI
# and create the GitHub release only from an exact vX.Y.Z tag push.

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  spec-gates:
    name: spec gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: spec-status
        run: uvx --from 'git+https://github.com/Knuckles-Team/pipelines@main' pipelines-hook spec-status
      - name: spec-decomposition
        run: uvx --from 'git+https://github.com/Knuckles-Team/pipelines@main' pipelines-hook spec-decomposition
      - name: spec-trailers
        if: github.event_name == 'pull_request'
        run: uvx --from 'git+https://github.com/Knuckles-Team/pipelines@main' pipelines-hook spec-trailers --base-ref "origin/${{ github.base_ref }}"

  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install
        run: uv sync --locked --group dev
      - name: boundary owner registry
        run: uv run --no-sync python scripts/check_boundary_owners.py
      - name: boundary directory coverage
        run: uv run --no-sync python scripts/check_boundary_coverage.py
      - name: boundary file ownership
        run: uv run --no-sync python scripts/check_boundary_file_owners.py
      - name: ruff check
        run: uv run --no-sync ruff check .
      - name: ruff format
        run: uv run --no-sync ruff format --check .
      - name: mypy
        run: uv run --no-sync mypy agent_utilities
      - name: tests
        run: uv run --no-sync pytest -q -p randomly

  backward-python:
    # The one backward-support leg (pipelines reference/gate-standard.md
    # "Python version"): the environment is 3.14, requires-python keeps a 3.12
    # floor, so install the lock on 3.12 and import the package.
    name: backward-python (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - name: Install and import on the 3.12 floor
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev --python 3.12
          uv run --frozen --no-sync python -c 'import sys, agent_utilities; print(sys.version)'

  build:
    name: build
    needs: [spec-gates, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.14'
      - name: Build wheel and sdist
        run: uv build --out-dir dist
      - name: Import the built wheel in a clean environment
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check dist/meristem-*.whl
          /tmp/wheel-check/bin/python -c "import agent_utilities, agent_utilities.harness, agent_utilities.runtime, agent_utilities.host_ports"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meristem-dist
          path: dist/

  publish-pypi:
    name: publish to PyPI
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: pypi-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meristem-dist
          path: dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Require tag, source and wheel versions to match
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not an exact vX.Y.Z tag: $TAG_NAME"; exit 1; }
          source_version="$(python3 -c "import ast,pathlib;m=ast.parse(pathlib.Path('agent_utilities/_version.py').read_text());print(next(n.value.value for n in m.body if isinstance(n,ast.Assign)))")"
          ls "dist/meristem-${TAG_NAME#v}-"*.whl >/dev/null
          [[ "${TAG_NAME#v}" == "$source_version" ]] || { echo "::error::tag $TAG_NAME != source $source_version"; exit 1; }
      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish dist/*

  github-release:
    name: GitHub release (links PyPI)
    needs: publish-pypi
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          printf '## meristem %s\n\nPublished to PyPI: https://pypi.org/project/meristem/%s/\n' "$version" "$version" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --latest --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --latest --title "$TAG" --generate-notes --notes-file "$RUNNER_TEMP/notes.md"
          fi
