apiVersion: v1
kind: ConfigMap
metadata:
  name: graphos-loadgen-mock-contract
  labels:
    agent-utilities.io/certification: "false"
    agent-utilities.io/non-certifying: "true"
immutable: true
data:
  LOADGEN_MODE: mock
  LOADGEN_WORKLOAD_CONTRACT_DIGEST: "${LOADGEN_WORKLOAD_CONTRACT_DIGEST:?rendered contract digest required}"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: graphos-certification-load-mock
  labels:
    agent-utilities.io/certification: "false"
    agent-utilities.io/non-certifying: "true"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphos-certification-load-mock
        agent-utilities.io/certification: "false"
        agent-utilities.io/non-certifying: "true"
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: certification-load-mock
          image: "${LOADGEN_IMAGE:?rendered immutable image required}"
          imagePullPolicy: IfNotPresent
          command: [graphos-certification-load]
          args:
            - --engine
            - mock
            - --scale
            - "0.001"
            - --duration-s
            - "5"
            - --report-json
            - /var/run/loadgen/mock-report.json
          envFrom:
            - configMapRef:
                name: graphos-loadgen-mock-contract
                optional: false
          volumeMounts:
            - {name: report, mountPath: /var/run/loadgen}
          resources:
            requests: {cpu: "100m", memory: 128Mi}
            limits: {cpu: "500m", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      volumes:
        - name: report
          emptyDir: {sizeLimit: 64Mi}
