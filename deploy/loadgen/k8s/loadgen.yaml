apiVersion: v1
kind: ConfigMap
metadata:
  name: graphos-loadgen-contract
  labels:
    agent-utilities.io/certification: production
immutable: true
data:
  LOADGEN_RELEASE_DIGEST: "${LOADGEN_RELEASE_DIGEST:?rendered release digest required}"
  LOADGEN_TOPOLOGY_DIGEST: "${LOADGEN_TOPOLOGY_DIGEST:?rendered topology digest required}"
  LOADGEN_IMAGE_DIGEST: "${LOADGEN_IMAGE_DIGEST:?rendered image digest required}"
  LOADGEN_WORKLOAD_CONTRACT_DIGEST: "${LOADGEN_WORKLOAD_CONTRACT_DIGEST:?rendered contract digest required}"
  LOADGEN_DURATION_SECONDS: "${LOADGEN_DURATION_SECONDS:?rendered duration required}"
  LOADGEN_SOURCE_REPOSITORY: "${LOADGEN_SOURCE_REPOSITORY:?rendered source repository required}"
  LOADGEN_SOURCE_REVISION: "${LOADGEN_SOURCE_REVISION:?rendered source revision required}"
  LOADGEN_SOURCE_MANIFEST_DIGEST: "${LOADGEN_SOURCE_MANIFEST_DIGEST:?rendered source manifest digest required}"
  LOADGEN_SOURCE_AUTHORITY_DIGEST: "${LOADGEN_SOURCE_AUTHORITY_DIGEST:?rendered source authority digest required}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: graphos-certification-load
  labels:
    agent-utilities.io/workload-identity: graphos-certification-load
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: graphos-certification-load
  labels:
    agent-utilities.io/certification: production
    agent-utilities.io/workload-identity: graphos-certification-load
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 259200
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphos-certification-load
        agent-utilities.io/certification: production
    spec:
      serviceAccountName: graphos-certification-load
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: certification-load
          image: "${LOADGEN_IMAGE:?rendered immutable image required}"
          imagePullPolicy: IfNotPresent
          command: [graphos-certification-load]
          args:
            - --engine
            - live
            - --scale
            - "1.0"
            - --duration-s
            - "$(LOADGEN_DURATION_SECONDS)"
            - --report-json
            - /var/run/loadgen/load-report.json
            - --release-digest
            - "$(LOADGEN_RELEASE_DIGEST)"
          envFrom:
            - configMapRef:
                name: graphos-loadgen-contract
                optional: false
          env:
            - {name: KG_DAEMON_ROLE, value: client}
            - {name: WORKLOAD_IDENTITY_TOKEN_FILE, value: /var/run/secrets/tokens/loadgen-token}
            - name: GRAPH_SERVICE_ENDPOINTS
              valueFrom:
                secretKeyRef: {name: graphos-loadgen-secrets, key: GRAPH_SERVICE_ENDPOINTS, optional: false}
            - name: KG_AUTH_TOKEN_REF
              valueFrom:
                secretKeyRef: {name: graphos-loadgen-secrets, key: KG_AUTH_TOKEN_REF, optional: false}
            - name: ENGINE_TLS_PROFILE_REF
              valueFrom:
                secretKeyRef: {name: graphos-loadgen-secrets, key: ENGINE_TLS_PROFILE_REF, optional: false}
            - name: LOADGEN_TENANT
              valueFrom:
                secretKeyRef: {name: graphos-loadgen-secrets, key: LOADGEN_TENANT, optional: false}
            - name: LOADGEN_PRINCIPAL
              valueFrom:
                secretKeyRef: {name: graphos-loadgen-secrets, key: LOADGEN_PRINCIPAL, optional: false}
            - name: LOADGEN_AUDIENCE
              valueFrom:
                secretKeyRef: {name: graphos-loadgen-secrets, key: LOADGEN_AUDIENCE, optional: false}
          volumeMounts:
            - {name: workload-identity, mountPath: /var/run/secrets/tokens, readOnly: true}
            - {name: report, mountPath: /var/run/loadgen}
          resources:
            requests: {cpu: "500m", memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      volumes:
        - name: workload-identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: "${LOADGEN_WORKLOAD_IDENTITY_AUDIENCE:?required}"
                  expirationSeconds: 3600
                  path: loadgen-token
        - name: report
          emptyDir: {sizeLimit: 256Mi}
