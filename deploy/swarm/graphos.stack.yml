# Security-hardened single-node GraphOS Swarm profile.
#
# Kubernetes production-cell remains the HA production reference. This profile
# keeps the same identity, session, secret, and native-engine TLS boundaries on
# a smaller Swarm. Operators must pre-create every external secret and the
# engine-data volume; this template contains no endpoint, credential, key, or
# certificate material.
#
# GRAPHOS_IMAGE_DIGEST must be an immutable image reference ending in
# @sha256:<64 lowercase hexadecimal characters>. Run the static contract before
# rendering or deploying:
#
#   python scripts/deployment/check_swarm_assets.py --runtime-image "$GRAPHOS_IMAGE_DIGEST"
#   docker stack deploy -c deploy/swarm/graphos.stack.yml graphos

version: "3.9"

x-runtime-secret: &runtime-secret
  uid: "10001"
  gid: "10001"
  mode: 0400

x-service-security: &service-security
  image: "${GRAPHOS_IMAGE_DIGEST:?set an immutable image digest}"
  user: "10001:10001"
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 60s
  networks: [graphos-internal]

networks:
  graphos-internal:
    driver: overlay
    attachable: false
    driver_opts:
      encrypted: ""

services:
  front:
    <<: *service-security
    command:
      - graph-os
      - --transport
      - streamable-http
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --tls-certfile
      - /run/secrets/front-tls.crt
      - --tls-keyfile
      - /run/secrets/front-tls.key
    environment:
      APP_PROFILE: production
      TRANSPORT: streamable-http
      HOST: "0.0.0.0"
      PORT: "8000"
      AUTH_TYPE: jwt
      KG_DAEMON_ROLE: client
      MCP_TOOL_MODE: intent
      MCP_CLIENT_AUTH: oidc-client-credentials
      REQUESTS_CA_BUNDLE: /run/secrets/ca-bundle.pem
      SSL_CERT_FILE: /run/secrets/ca-bundle.pem
      ENGINE_CA_BUNDLE: /run/secrets/ca-bundle.pem
      ENGINE_CLIENT_CERT: /run/secrets/engine-client.crt
      ENGINE_CLIENT_KEY: /run/secrets/engine-client.key
      UV_NATIVE_TLS: "true"
      PERSISTENCE_IDENTITY_HMAC_KEY_REF: env://PERSISTENCE_IDENTITY_HMAC_KEY
    secrets:
      - <<: *runtime-secret
        source: graphos-jwt-jwks-uri
        target: FASTMCP_SERVER_AUTH_JWT_JWKS_URI
      - <<: *runtime-secret
        source: graphos-jwt-issuer
        target: OIDC_ISSUER
      - <<: *runtime-secret
        source: graphos-jwt-audience
        target: FASTMCP_SERVER_AUTH_JWT_AUDIENCE
      - <<: *runtime-secret
        source: graphos-mcp-allowed-hosts
        target: MCP_ALLOWED_HOSTS
      - <<: *runtime-secret
        source: graphos-front-tls-server-name
        target: MCP_TLS_SERVER_NAME
      - <<: *runtime-secret
        source: graphos-engine-endpoints
        target: GRAPH_SERVICE_ENDPOINTS
      - <<: *runtime-secret
        source: graphos-engine-tls-server-name
        target: ENGINE_TLS_SERVER_NAME
      - <<: *runtime-secret
        source: graphos-engine-auth-secret
        target: GRAPH_SERVICE_AUTH_SECRET
      - <<: *runtime-secret
        source: graphos-state-db-uri
        target: STATE_DB_URI
      - <<: *runtime-secret
        source: graphos-graph-db-connection-profile-ref
        target: GRAPH_DB_CONNECTION_PROFILE_REF
      - <<: *runtime-secret
        source: graphos-policy-version
        target: KG_POLICY_VERSION
      - <<: *runtime-secret
        source: graphos-persistence-identity-key
        target: PERSISTENCE_IDENTITY_HMAC_KEY
      - <<: *runtime-secret
        source: graphos-oidc-client-id
        target: OIDC_CLIENT_ID
      - <<: *runtime-secret
        source: graphos-oidc-client-secret
        target: OIDC_CLIENT_SECRET
      - <<: *runtime-secret
        source: graphos-oidc-audience
        target: OIDC_AUDIENCE
      - <<: *runtime-secret
        source: graphos-oidc-token-url
        target: OIDC_TOKEN_URL
      - <<: *runtime-secret
        source: graphos-ca-bundle
        target: ca-bundle.pem
        mode: 0444
      - <<: *runtime-secret
        source: graphos-front-tls-cert
        target: front-tls.crt
      - <<: *runtime-secret
        source: graphos-front-tls-key
        target: front-tls.key
      - <<: *runtime-secret
        source: graphos-engine-client-cert
        target: engine-client.crt
      - <<: *runtime-secret
        source: graphos-engine-client-key
        target: engine-client.key
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=268435456,uid=10001,gid=10001,mode=0700
    ports:
      - target: 8000
        published: 8443
        protocol: tcp
        mode: ingress
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket,ssl;
          name=open('/run/secrets/MCP_TLS_SERVER_NAME',encoding='utf-8').read().strip();
          context=ssl.create_default_context(cafile='/run/secrets/ca-bundle.pem');
          raw=socket.create_connection(('127.0.0.1',8000),timeout=3);
          channel=context.wrap_socket(raw,server_hostname=name);
          channel.sendall(('GET /health HTTP/1.1\r\nHost: '+name+'\r\nConnection: close\r\n\r\n').encode());
          assert channel.recv(32).startswith(b'HTTP/1.1 200')
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 2
      placement:
        constraints: [node.role == worker]
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        reservations: {cpus: "0.50", memory: 1G}
        limits: {cpus: "4.00", memory: 4G}

  engine:
    <<: *service-security
    command:
      - /bin/sh
      - -ec
      - >-
        export GRAPH_SERVICE_AUTH_SECRET="$$(cat /run/secrets/GRAPH_SERVICE_AUTH_SECRET)";
        exec epistemic-graph-server
        --tcp-addr 0.0.0.0:9100
        --persist-dir /var/lib/epistemic-graph/data
        --tcp-tls-cert /run/secrets/engine-tls.crt
        --tcp-tls-key /run/secrets/engine-tls.key
        --tcp-tls-client-ca /run/secrets/ca-bundle.pem
    environment:
      APP_PROFILE: production
      GRAPH_SERVICE_PERSIST_DIR: /var/lib/epistemic-graph/data
      EPISTEMIC_GRAPH_REQUIRE_VERIFIED_CONTEXT: "1"
      EPISTEMIC_GRAPH_REQUIRE_SIGNED: "1"
      EPISTEMIC_GRAPH_RLS_DEFAULT_DENY: "1"
      EPISTEMIC_GRAPH_PERSIST_BACKEND: redb
      SSL_CERT_FILE: /run/secrets/ca-bundle.pem
    secrets:
      - <<: *runtime-secret
        source: graphos-engine-auth-secret
        target: GRAPH_SERVICE_AUTH_SECRET
      - <<: *runtime-secret
        source: graphos-engine-tls-server-name
        target: ENGINE_TLS_SERVER_NAME
      - <<: *runtime-secret
        source: graphos-ca-bundle
        target: ca-bundle.pem
        mode: 0444
      - <<: *runtime-secret
        source: graphos-engine-tls-cert
        target: engine-tls.crt
      - <<: *runtime-secret
        source: graphos-engine-tls-key
        target: engine-tls.key
      - <<: *runtime-secret
        source: graphos-engine-client-cert
        target: engine-client.crt
      - <<: *runtime-secret
        source: graphos-engine-client-key
        target: engine-client.key
    volumes:
      - engine-data:/var/lib/epistemic-graph/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1073741824,uid=10001,gid=10001,mode=0700
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket,ssl;
          name=open('/run/secrets/ENGINE_TLS_SERVER_NAME',encoding='utf-8').read().strip();
          context=ssl.create_default_context(cafile='/run/secrets/ca-bundle.pem');
          context.load_cert_chain('/run/secrets/engine-client.crt','/run/secrets/engine-client.key');
          raw=socket.create_connection(('127.0.0.1',9100),timeout=3);
          channel=context.wrap_socket(raw,server_hostname=name);
          channel.close()
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.graphos_engine == true]
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        reservations: {cpus: "4.00", memory: 16G}
        limits: {cpus: "16.00", memory: 64G}

volumes:
  engine-data:
    external: true
    name: graphos-engine-data

secrets:
  graphos-jwt-jwks-uri: {external: true}
  graphos-jwt-issuer: {external: true}
  graphos-jwt-audience: {external: true}
  graphos-mcp-allowed-hosts: {external: true}
  graphos-front-tls-server-name: {external: true}
  graphos-engine-endpoints: {external: true}
  graphos-engine-tls-server-name: {external: true}
  graphos-engine-auth-secret: {external: true}
  graphos-state-db-uri: {external: true}
  graphos-graph-db-connection-profile-ref: {external: true}
  graphos-policy-version: {external: true}
  graphos-persistence-identity-key: {external: true}
  graphos-oidc-client-id: {external: true}
  graphos-oidc-client-secret: {external: true}
  graphos-oidc-audience: {external: true}
  graphos-oidc-token-url: {external: true}
  graphos-ca-bundle: {external: true}
  graphos-front-tls-cert: {external: true}
  graphos-front-tls-key: {external: true}
  graphos-engine-tls-cert: {external: true}
  graphos-engine-tls-key: {external: true}
  graphos-engine-client-cert: {external: true}
  graphos-engine-client-key: {external: true}
