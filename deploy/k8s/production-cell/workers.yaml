apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: graphos-serving
value: 100000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: GraphOS serving and authoritative graph quorum.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: graphos-interactive-worker
value: 50000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: Interactive dispatch workers.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: graphos-background-worker
value: 10000
globalDefault: false
preemptionPolicy: Never
description: Ingestion and analytic workers that must yield to serving traffic.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphos-dispatch-worker
  namespace: graphos-cell
  labels:
    app.kubernetes.io/name: graphos-dispatch-worker
    graphos.io/worker-role: dispatch
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: graphos-dispatch-worker}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphos-dispatch-worker
        graphos.io/worker-role: dispatch
        graphos.io/resource-partition: interactive
      annotations:
        graphos.io/mtls-mode: strict
        sidecar.istio.io/nativeSidecar: "true"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts":true}'
    spec:
      serviceAccountName: graphos-dispatch
      automountServiceAccountToken: false
      priorityClassName: graphos-interactive-worker
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: graphos-dispatch-worker}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: graphos-dispatch-worker}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: graphos-dispatch-worker}
      containers:
        - name: worker
          image: graph-os-image
          command: ["agent-dispatch-worker"]
          args: ["--workers", "1"]
          envFrom:
            - configMapRef: {name: graphos-cell-contract}
            - secretRef: {name: graphos-runtime-secrets, optional: false}
          env:
            - {name: REQUESTS_CA_BUNDLE, value: /var/run/graphos/trust/ca-bundle.pem}
            - {name: SSL_CERT_FILE, value: /var/run/graphos/trust/ca-bundle.pem}
            - {name: WORKLOAD_IDENTITY_TOKEN_FILE, value: /var/run/secrets/tokens/graphos-token}
          volumeMounts:
            - {name: workload-identity, mountPath: /var/run/secrets/tokens, readOnly: true}
            - {name: trust-bundle, mountPath: /var/run/graphos/trust, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          startupProbe:
            exec: {command: ["agent-utilities-doctor", "--only", "engine"]}
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            exec: {command: ["agent-utilities-doctor", "--only", "engine"]}
            failureThreshold: 3
            periodSeconds: 20
          livenessProbe:
            exec: {command: ["python", "-c", "import os; os.kill(1, 0)"]}
            failureThreshold: 3
            periodSeconds: 30
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "4", memory: 8Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      volumes:
        - name: workload-identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {audience: "${GRAPHOS_WORKLOAD_IDENTITY_AUDIENCE:?required}", expirationSeconds: 3600, path: graphos-token}
        - name: trust-bundle
          secret: {secretName: graphos-trust-bundle, optional: false}
        - {name: tmp, emptyDir: {sizeLimit: 2Gi}}
---
