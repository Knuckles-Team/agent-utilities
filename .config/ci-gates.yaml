# CI-only gates (pipelines reference/precommit-standard.md). pre-commit format,
# never installed as a git hook: .github/workflows/advisory.yml runs it with
# `pre-commit run --config .config/ci-gates.yaml --all-files`. No manual stage:
# a gate runs here in CI or it is deleted. Local hooks: .config/pre-commit.yaml.
default_stages:
- pre-commit
exclude: ^scripts/
repos:
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: fc0f09a29bb495f4a91f00266155d6282d52485d
  hooks:
  - id: mypy
    additional_dependencies:
    - pydantic==2.13.4
    - types-PyYAML==6.0.12.20260518
    - types-requests==2.33.0.20260518
    args:
    - --ignore-missing-imports
    exclude: ^(tests/(?!unit/patterns/)|test/|scripts/|script/)
- repo: https://github.com/jendrikseipp/vulture
  rev: b0f67ba0044693aa9ec0d38fe460590facc98004
  hooks:
  - id: vulture
    pass_filenames: false
    args:
    - .
    - vulture_whitelist.py
    - --min-confidence
    - '95'
    - --exclude
    - node_modules,dotnet,.venv,build,tests
    require_serial: true
- repo: https://github.com/codespell-project/codespell
  rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a
  hooks:
  - id: codespell
    args:
    - -L
    - ans,linar,nam,tread,ot,disjointness,trough,nd,numer,statics
    - --ignore-words=.config/codespell.ignore
    exclude: ^(tests/|test/|scripts/|script/|\.specify/|agent_utilities/knowledge_graph/ontology/style_lint\.py$)
- repo: https://github.com/PyCQA/bandit
  rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08
  hooks:
  - id: bandit
    args:
    - --skip
    - B101,B104,B105,B110,B112,B404,B603,B607,B608
    exclude: ^(tests/|test/|scripts/|script/|__tests__/|run_test\.py|\.specify/)
- repo: https://github.com/Knuckles-Team/pipelines
  rev: main
  hooks:
  - id: complexity-staged
  - id: public-surface
  - id: spec-status
  - id: spec-decomposition
  - id: spec-standard
  - id: ste-staged
- repo: local
  hooks:
  - id: supply-chain-source-contract
    name: enforce immutable workflow, container, and dependency sources
    entry: scripts/hook_python.sh scripts/check_fleet_supply_chain.py .
    language: system
    files: ^(\.github/workflows/.*\.ya?ml|.*(?:Dockerfile|\.dockerfile).*|.*(?:compose|stack).*\.ya?ml|pyproject\.toml|package\.json|Cargo\.toml|.*\.lock|pnpm-lock\.yaml)$
    pass_filenames: false
  - id: check-mermaid
    name: Check Mermaid syntax
    entry: scripts/hook_python.sh scripts/mermaid_linter.py
    language: system
    files: \.md$
    pass_filenames: true
  - id: check-stubs
    name: Check for Active Stubs and TODOs
    entry: scripts/hook_python.sh scripts/check_stubs.py
    language: system
    types:
    - python
  - id: check-import-safety
    name: Cross-platform import safety (native + simulated-Windows fcntl/termios/pwd/resource)
    entry: scripts/hook_python.sh scripts/check_import_safety.py --package agent_utilities --simulate-windows --exclude agent_utilities.knowledge_graph.core.file_lock --exclude agent_utilities.__main__ --exclude agent_utilities.agent.factory --exclude agent_utilities.server --exclude agent_utilities.graphos_client.toolset_factory --exclude agent_utilities.mcp.tools --exclude agent_utilities.mcp.verbose_tools --exclude agent_utilities.patterns --exclude agent_utilities.knowledge_graph.adaptation.trace_distiller --exclude agent_utilities.cli --exclude agent_utilities.core.unified_install --exclude agent_utilities.governance.concept_allocator --exclude agent_utilities.governance.lanes --exclude agent_utilities.governance.merge_queue --exclude agent_utilities.knowledge_graph.core.engine_lock --exclude agent_utilities.knowledge_graph.core.host_lock --exclude agent_utilities.mcp.eunomia_principal --exclude agent_utilities.mcp.middlewares --exclude agent_utilities.mcp.multiplexer --exclude agent_utilities.mcp.shared_multiplexer
    language: system
    pass_filenames: false
    files: ^(agent_utilities/.*|pyproject\.toml|uv\.lock)$
  - id: check-http-transport-closure
    name: Governed HTTP transport import and dependency closure (NE-015)
    entry: scripts/hook_python.sh scripts/check_http_transport_closure.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-boundary-owners
    name: "Boundary ownership \u2014 reject a wrong-owner module or console script"
    entry: scripts/hook_python.sh scripts/check_boundary_owners.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-no-env-sprawl
    name: Config-flag anti-sprawl (no new bare os.environ KG_/GRAPH_ reads)
    entry: scripts/hook_python.sh scripts/check_no_env_sprawl.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-topology-authority
    name: One topology authority (no AU TopologyTemplate Cypher, success-rate selection or second selector)
    entry: scripts/hook_python.sh scripts/check_topology_authority.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-no-stdout-writes
    name: Stdio JSON-RPC purity (no print()/sys.stdout.write() in the served MCP surface, B-19)
    entry: scripts/hook_python.sh scripts/check_no_stdout_writes.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-concept-gaps
    name: Check Concept ID Gap contiguousness
    entry: scripts/hook_python.sh scripts/check_concept_gaps.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-root-hygiene
    name: Repository root hygiene (allowlisted entries only)
    entry: scripts/hook_python.sh scripts/check_root_hygiene.py
    language: system
    pass_filenames: false
    always_run: true
  - id: turtle-format
    name: Format Turtle with rdflib==7.6.0
    entry: python -m scripts.format_ttl
    language: python
    additional_dependencies:
    - rdflib==7.6.0
    files: \.ttl$
    exclude: (^|/)shapes/
  - id: check-identifier-interpolation
    name: "Identifier interpolation \u2014 every label/table/rel-type f-string is validated"
    entry: scripts/hook_python.sh scripts/check_identifier_interpolation.py
    language: system
    pass_filenames: false
    files: ^agent_utilities/.*\.py$
  - id: check-import-cycles
    name: "Import cycles \u2014 ZERO eager (load-time) cycles, absolute"
    entry: scripts/hook_python.sh scripts/check_import_cycles.py
    language: system
    pass_filenames: false
    files: ^agent_utilities/.*\.py$
  - id: check-swallowed-errors
    name: "Swallowed errors \u2014 census + no cause-dropping handler ADDED by this change"
    entry: scripts/hook_python.sh scripts/check_swallowed_errors.py
    language: system
    pass_filenames: false
    files: ^agent_utilities/.*\.py$
  - id: check-event-loop-blocking
    name: "Event-loop blocking heuristic (ratchet \u2014 no new candidate sites)"
    entry: scripts/hook_python.sh scripts/check_event_loop_blocking.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-no-per-element-ingest-loop
    name: No per-element ingest loop on the agent-facing MCP surface (ratchet, B-11/GOC-68)
    entry: scripts/hook_python.sh scripts/check_no_per_element_ingest_loop.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-wire-first
    name: "Wire-First \u2014 reachable != invoked (ratchet; D-OB-9/13/16)"
    entry: scripts/hook_python.sh scripts/check_wiring.py --wire-first-report
    language: system
    pass_filenames: false
    files: ^(agent_utilities/.*\.py|tests/.*\.py|scripts/wire_first_baseline\.json)$
  - id: check-release-catalogs
    name: Release catalogs match the checked-in connector manifests (D-35-9)
    entry: scripts/hook_python.sh scripts/release/check_release_catalogs.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-skill-name-collision
    name: Skill names globally unique across the fleet (install-all, no overlap)
    entry: scripts/hook_python.sh scripts/check_skill_name_collision.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-bumpversion
    name: validate bumpversion config
    entry: "bash -c '\n  if [ ! -f \".bumpversion.cfg\" ]; then exit 0; fi\n  bump2version_bin=\"\"\n  for candidate in bump2version \"$HOME/.local/bin/bump2version\" \"$HOME/.local/pipx/venvs/bump2version/bin/bump2version\"; do\n    if command -v \"$candidate\" >/dev/null 2>&1; then\n      bump2version_bin=\"$candidate\"\n      break\n    fi\n  done\n  if [ -z \"$bump2version_bin\" ]; then\n    reason=\"bump2version is not on PATH, \\$HOME/.local/bin or \\$HOME/.local/pipx (a MISSING TOOL, not a version-bump config defect; install it with \\`pipx install bump2version\\`)\"\n    if [ -n \"${CI:-}\" ]; then\n      echo \"check-bumpversion: CANNOT RUN: $reason\" >&2\n      exit 2\n    fi\n    echo \"SKIPPED (check-bumpversion): $reason\"\n    exit 0\n  fi\n  \"$bump2version_bin\" patch --dry-run --allow-dirty\n'"
    language: system
    pass_filenames: false
    always_run: true
- repo: https://github.com/AleksaC/hadolint-py
  rev: 458cb25edf664682e3e856a53a2f9af33e068297
  hooks:
  - id: hadolint
    args:
    - --ignore=DL3008
    - --ignore=DL3015
    - --ignore=DL3009
    - --ignore=DL4006
    - --ignore=SC2102
