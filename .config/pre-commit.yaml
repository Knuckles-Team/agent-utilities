# Local hooks: the pipelines pre-commit standard
# (https://github.com/Knuckles-Team/pipelines/blob/main/reference/precommit-standard.md,
# templates/pre-commit.yaml). Install both stages with
#   pre-commit install --config .config/pre-commit.yaml --hook-type pre-commit --hook-type pre-push
# The owner guard also checks the repository's current component registry.
# Only fast checks on the change live here; release.yml runs the spec gates,
# mypy, the test suite and the wheel build.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
- repo: local
  hooks:
  - id: boundary-owners
    name: boundary owner registry
    entry: python scripts/check_boundary_owners.py
    language: system
    pass_filenames: false
    always_run: true
  - id: boundary-coverage
    name: boundary directory coverage
    entry: python scripts/check_boundary_coverage.py
    language: system
    pass_filenames: false
    always_run: true
# --- pre-commit: hygiene on staged files ------------------------------------
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-merge-conflict
  - id: check-added-large-files
    args: [--maxkb=2000]
    exclude: ^uv\.lock$
  - id: check-yaml
    args: [--unsafe]
  - id: check-toml
  - id: check-json
  - id: detect-private-key
# --- pre-commit: format and lint staged Python (pinned ruff) ----------------
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c # v0.16.0
  hooks:
  - id: ruff-format
    args: [--check]
  - id: ruff-check
# --- shared push gates ------------------------------------------------------
- repo: https://github.com/Knuckles-Team/pipelines
  rev: main
  hooks:
  - id: spec-trailers
    stages: [pre-push]
    args: [--base-ref, origin/main]
