# Local hooks: the pipelines pre-commit standard
# (https://github.com/Knuckles-Team/pipelines/blob/main/reference/precommit-standard.md,
# templates/pre-commit.yaml). Install with
#   pre-commit install --config .config/pre-commit.yaml
# Only fast checks on the change live here. Every other gate is CI-only and
# lives in .config/ci-gates.yaml, which advisory.yml runs; release.yml runs the
# clone scanners, secret-history scan, spec gates, wheel checks and test suite.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: ^scripts/
repos:
# --- pre-commit: hygiene on staged files ------------------------------------
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
    exclude: \.ttl$ # turtle files are normalised by turtle-format (ci-gates.yaml)
  - id: check-merge-conflict
  - id: check-added-large-files
    args: [--maxkb=2000]
    exclude: ^uv\.lock$|.*\.db$|.*\.bak$|.*\.sqlite$
  - id: check-yaml
    args: [--unsafe]
  - id: check-toml
  - id: check-json
  - id: detect-private-key
# --- pre-commit: format and lint staged Python (pinned ruff) ----------------
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c # v0.16.0
  hooks:
  - id: ruff-format
    args: [--check]
    exclude: ^(tests/|test/|scripts/|script/)
  - id: ruff-check
    args: [--ignore=E402]
    exclude: ^(tests/|test/|scripts/|script/)
# --- shared push gates ------------------------------------------------------
- repo: https://github.com/Knuckles-Team/pipelines
  rev: main
  hooks:
  - id: spec-trailers
    stages: [pre-push]
    args: [--base-ref, origin/main]
  - id: fast-tests
    stages: [pre-push]
    args: [--src-root, agent_utilities]
- repo: local
  hooks:
  # Reason for the local id (instead of the shared uv-lock-check): the lock
  # resolves sibling path sources, which scripts/uv_workspace.py materialises
  # before running `uv lock --locked` (verify only, never rewrites).
  - id: uv-lock
    name: uv lock consistency (no install, no rewrite)
    entry: scripts/hook_python.sh scripts/uv_workspace.py lock --locked
    language: system
    pass_filenames: false
    files: ^(pyproject\.toml|uv\.lock)$
    stages: [pre-push]
  # Stated exception to the standard: guards the local canonical checkout
  # (lane rules), which CI cannot see. 1.7 s.
  - id: lane-guard
    name: Lane guard - canonical checkout is read-only; generated views stay generated
    entry: scripts/hook_python.sh scripts/check_lane_guard.py
    language: system
    pass_filenames: false
    always_run: true
