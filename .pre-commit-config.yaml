# Without this, `pre-commit install` wires ONLY the pre-commit hook, so `git push`
# runs nothing and every hook staged pre-push is silently dead code.
default_install_hook_types: [pre-commit, pre-push]
exclude: ^scripts/
# Phase 0 dev-velocity contract (graph-os-completion-program): a hook with no
# explicit `stages:` below is commit-only, never both. agent-utilities already
# staged most HEAVY hooks explicitly (D-ORC-48 etc); this codifies the same
# intent for the small remainder that still defaulted to commit-only.
default_stages: [pre-commit]
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--maxkb=2000"]
    exclude: ^uv\.lock$|.*\.db$|.*\.bak$|.*\.sqlite$
  - id: check-ast
    exclude: ^(tests/|test/|scripts/|script/)
  - id: check-yaml
    args: ["--unsafe"]
    # Helm templates contain Go actions and are validated by `helm lint` plus
    # rendered Kubernetes dry-run tests, not by a raw YAML parser.
    exclude: ^agent_utilities/skills/workflows/agent-os-genesis/assets/helm/.*/templates/
  - id: check-toml
  - id: check-json
  - id: fix-byte-order-marker
    exclude: .gitignore
  - id: check-merge-conflict
  - id: detect-private-key
  - id: trailing-whitespace
  - id: end-of-file-fixer
    exclude: \.ttl$
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c # v0.16.0
  hooks:
  - id: ruff-check
    args: ["--fix", "--unsafe-fixes", "--ignore=E402"]
    exclude: ^(tests/|test/|scripts/|script/)
  - id: ruff-format
    exclude: ^(tests/|test/|scripts/|script/)
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: fc0f09a29bb495f4a91f00266155d6282d52485d # v1.20.2
  hooks:
  - id: mypy
    additional_dependencies: [pydantic==2.13.4, types-PyYAML==6.0.12.20260518, types-requests==2.33.0.20260518]
    args: ["--ignore-missing-imports"]
    # Align with ruff/bandit/codespell, which all exclude tests — the repo does
    # not statically type-check test code (validated at runtime by pytest).
    exclude: ^(tests/|test/|scripts/|script/)
- repo: https://github.com/jendrikseipp/vulture
  rev: b0f67ba0044693aa9ec0d38fe460590facc98004 # v2.16
  hooks:
  - id: vulture
    pass_filenames: false
    args: [".", "vulture_whitelist.py", "--min-confidence", "95", "--exclude", "node_modules,dotnet,.venv,build,tests"]
    require_serial: true
- repo: https://github.com/codespell-project/codespell
  rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a # v2.4.2
  hooks:
  - id: codespell
    args: ["-L", "ans,linar,nam,tread,ot,disjointness,trough,nd,numer,statics", "--ignore-words=.codespellignore"]
    # style_lint.py's _COMMON_TYPOS dict is DATA — the misspelled forms (teh,
    # wich, recieve, ...) are its dictionary keys by design (it's the ontology
    # naming-style linter's own typo table). Whitelisting those words globally
    # in .codespellignore would blind codespell to the same real typos anywhere
    # else in the tree, so exclude this one file by path instead.
    exclude: ^(tests/|test/|scripts/|script/|\.specify/|agent_utilities/knowledge_graph/ontology/style_lint\.py$)
- repo: https://github.com/PyCQA/bandit
  rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # 1.9.4
  hooks:
  - id: bandit
    args: ["--skip", "B101,B104,B105,B110,B112,B404,B603,B607,B608"]
    exclude: ^(tests/|test/|scripts/|script/|__tests__/|run_test\.py|\.specify/)
- repo: https://github.com/nbQA-dev/nbQA
  rev: d31b7eae1767c43460afb3ba130e0a6602933abe # 1.9.1
  hooks:
  - id: nbqa-ruff
    args: ["--fix"]
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 6a280ba12b7901e47757c868c8c13c6a624c9ecb # 0.11.7
  hooks:
  # --locked: fail (don't silently rewrite) if uv.lock is out of sync with
  # pyproject.toml — keeps the committed lock authoritative and never stale.
  - id: uv-lock
    entry: python3 scripts/uv_workspace.py lock
    args: ["--locked"]
    stages: [pre-push, manual]
- repo: local
  hooks:
  - id: dependency-readiness
    name: Dependency readiness — every declared intra-fleet constraint is installable
    # Prefer the local repository-manager checkout, fall back to PyPI (CI).
    # PyPI still holds 2.0.1, which predates this module entirely, so a plain
    # `--with repository-manager` can never satisfy the import and the gate
    # fails everywhere it is declared. --no-project keeps the tool out of this
    # repo's own env and --prerelease=allow is required because agent-utilities
    # depends on fastmcp>=4.0.0b1.
    entry: bash -c 'P=../agents/repository-manager; [ -d "$P" ] || P=repository-manager; uv run --no-project --python 3.12 --prerelease=allow --with "$P" python -m repository_manager.dependency_readiness .'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: dependency-audit
    name: audit dependencies for known CVEs (OSV)
    entry: python3 scripts/audit_dependencies.py uv.lock
    language: system
    files: ^(uv\.lock|pyproject\.toml|\.security-audit-allow\.txt)$
    pass_filenames: false
  - id: supply-chain-source-contract
    name: enforce immutable workflow, container, and dependency sources
    entry: python3 scripts/check_fleet_supply_chain.py .
    language: system
    files: ^(\.github/workflows/.*\.ya?ml|.*(?:Dockerfile|\.dockerfile).*|.*(?:compose|stack).*\.ya?ml|pyproject\.toml|package\.json|Cargo\.toml|.*\.lock|pnpm-lock\.yaml)$
    pass_filenames: false
  - id: check-mermaid
    name: Check Mermaid syntax
    entry: python3 scripts/mermaid_linter.py
    language: system
    files: \.md$
    pass_filenames: true
  - id: check-stubs
    name: Check for Active Stubs and TODOs
    entry: python3 scripts/check_stubs.py
    language: system
    types: [python]
  - id: check-import-safety
    name: Cross-platform import safety (native + simulated-Windows fcntl/termios/pwd/resource)
    # Walks every agent_utilities module and imports it, with fcntl/termios/
    # pwd/resource poisoned out of sys.modules first to reproduce a Windows
    # import failure on this POSIX dev machine (see the script's own
    # docstring for exactly what --simulate-windows does and does not
    # model -- it deliberately does NOT flip sys.platform/os.name, which
    # would corrupt pathlib's WindowsPath/PosixPath dispatch on a live POSIX
    # host). Catches the whole "unconditional top-level import of a
    # POSIX-only stdlib module" defect class at commit time, cheaply,
    # before it ever reaches a human on Windows or Windows CI
    # (numeric-runtime-gate in release.yml, real Windows runner).
    #
    # The --exclude entries below are NOT Windows-related debt hidden here:
    #   * knowledge_graph.core.file_lock -- ALREADY correctly guards fcntl
    #     behind `sys.platform == "win32"` (this repo's own canonical
    #     pattern). This shim blocks the fcntl MODULE but (deliberately, see
    #     above) does not flip sys.platform, so a correctly-guarded module
    #     still takes the POSIX arm here and still hits the block -- a known
    #     false positive of a sys.modules-only shim, not a real defect.
    #     Verified for real only on the Windows runner in release.yml.
    #   * __main__, agent.factory, server, mcp.tools, mcp.verbose_tools,
    #     patterns.* -- all transitively import the third-party `mcp`
    #     package's MCPToolset, which itself hits `mcp/server/stdio.py`'s
    #     `if sys.platform != "win32": import fcntl` -- the EXACT SAME
    #     already-correctly-guarded pattern as file_lock.py above, and the
    #     exact same shim limitation, one dependency hop removed. Confirmed
    #     by direct traceback on 2026-08-13 (not assumed): the failure
    #     bottoms out at that guarded line, not an unconditional import.
    #   * agent_utilities.agent_utilities, knowledge_graph.adaptation.
    #     trace_distiller -- two PRE-EXISTING broken imports (missing
    #     memory_compaction.py / adaptation/synthesis.py modules),
    #     discovered BY this gate, reproducible on main with NO simulation
    #     at all (plain `import agent_utilities` fails the same way natively
    #     -- see `python3 scripts/check_import_safety.py --package
    #     agent_utilities` with no flag), unrelated to Windows/fcntl. Left
    #     for separate triage so this gate's signal stays specific to
    #     cross-platform import safety.
    #
    # NOT excluded, and expected to keep this hook RED until
    # fix/au-cross-platform-locking (or equivalent) merges: the 12 modules
    # with a genuinely unguarded top-level `import fcntl`/`import resource`
    # -- agent_utilities.deployment.{venv_sync,venv_autosync},
    # governance.{concept_allocator,lanes,merge_queue},
    # knowledge_graph.core.{engine_lock,host_lock}, mcp.{eunomia_principal,
    # kg_coordinator,middlewares,multiplexer,shared_multiplexer}. A hook
    # that stayed green through those would not be proving anything.
    entry: >-
      python3 scripts/check_import_safety.py --package agent_utilities --simulate-windows
      --exclude agent_utilities.knowledge_graph.core.file_lock
      --exclude agent_utilities.__main__
      --exclude agent_utilities.agent.factory
      --exclude agent_utilities.server
      --exclude agent_utilities.mcp.tools
      --exclude agent_utilities.mcp.verbose_tools
      --exclude agent_utilities.patterns
      --exclude agent_utilities.agent_utilities
      --exclude agent_utilities.knowledge_graph.adaptation.trace_distiller
    language: system
    pass_filenames: false
    # NOT `types: [python]` (this repo's own top-level `exclude: ^scripts/`,
    # line 4, would silently skip this exact hook on a commit whose only
    # .py change is under scripts/ -- confirmed: that is exactly what
    # happened while authoring this hook itself). Uses an explicit `files:`
    # regex instead so top-level `exclude:` cannot apply, while still
    # scoping the INVOCATION (not the internal check, which still walks the
    # whole `agent_utilities` package every time it runs) to commits that
    # could actually change the result: source under `agent_utilities/`
    # itself, or a dependency change (a new/updated dep can introduce an
    # unconditional platform-only import just as easily as new source can).
    # Measured 2026-08-15: ~12s standalone -- real cost, worth scoping;
    # skipping is provably safe because if none of these paths changed, the
    # whole-package Windows-import-safety result cannot have changed either
    # (it was already checked, always_run, on every prior commit).
    files: ^(agent_utilities/.*|pyproject\.toml|uv\.lock)$
  - id: check-no-env-sprawl
    name: Config-flag anti-sprawl (no new bare os.environ KG_/GRAPH_ reads)
    entry: python3 scripts/check_no_env_sprawl.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-no-stdout-writes
    name: Stdio JSON-RPC purity (no print()/sys.stdout.write() in the served MCP surface, B-19)
    entry: python3 scripts/check_no_stdout_writes.py
    language: system
    pass_filenames: false
    always_run: true
  - id: env-var-drift
    name: Env-var / config drift guard (.env.example matches the code-read surface)
    entry: python3 -m agent_utilities.mcp.check_env_var_drift --check
    language: system
    pass_filenames: false
    # Scoped, not always_run: the script's own `_NON_RUNTIME_SOURCE_DIRS`
    # (docs/examples/reports/scripts/test/tests) already declares those
    # trees irrelevant to its os.environ-read scan -- it only walks runtime
    # source (agent_utilities/, deploy/, docker/) plus .env.example itself.
    # A commit outside those paths cannot change this hook's verdict.
    # Measured 2026-08-15: ~13s standalone.
    files: ^(agent_utilities/.*|deploy/.*|docker/.*|\.env\.example|pyproject\.toml)$
  - id: lane-guard
    name: Lane guard — canonical checkout is read-only; generated views stay generated
    # Two rules that were documented and violated anyway, now mechanical:
    # (1) no non-merge, non-bump commit authored in the canonical checkout, and
    # (2) no hand-edited docs/concept_reservations.yaml (it is the fold of the
    #     per-lane append-only fragments). See docs/architecture/lane-concurrency.md.
    entry: python3 scripts/check_lane_guard.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-concept-gaps
    name: Check Concept ID Gap contiguousness
    entry: python3 scripts/check_concept_gaps.py
    language: system
    pass_filenames: false
    always_run: true
  # Repo-root hygiene: an ALLOWLIST of what may sit at the root. Two scratch
  # proof artifacts that said "safe to delete" in their own body, plus a
  # workspace-level `plans/` directory, reached a public GitHub repo before
  # anyone noticed. A denylist would only ever catch the junk we already
  # thought of.
  - id: check-root-hygiene
    name: Repository root hygiene (allowlisted entries only)
    entry: python3 scripts/check_root_hygiene.py
    language: system
    pass_filenames: false
    always_run: true
  - id: turtle-format
    name: Format Turtle with rdflib==7.6.0
    entry: python -m scripts.format_ttl
    language: python
    additional_dependencies: [rdflib==7.6.0]
    files: \.ttl$
    # SHACL shape files use anonymous `sh:property [ ]` shapes that rdflib==7.6.0's
    # turtle serializer cannot canonicalize idempotently (blank-node relabeling),
    # so the formatter would rewrite them on every run. They remain valid turtle
    # and are parsed/validated by the SHACL gate — just not cosmetically reformatted.
    exclude: ^agent_utilities/knowledge_graph/shapes/
  - id: check-ontology
    name: Ontology library — valid + connected (no unlinked/broken ontologies)
    entry: python3 scripts/check_ontology.py
    language: system
    pass_filenames: false
    # Scoped: every *.ttl in this repo lives under agent_utilities/knowledge_
    # graph/ (verified: `find . -name '*.ttl'` has no hits outside it), and
    # the gate's own 7th rule cross-references docs/architecture/
    # ontology_library.md. The graph-connectivity/SHACL checks themselves
    # still scan the WHOLE ontology library every time this runs (unchanged
    # -- adding/removing one file can only break connectivity if a .ttl
    # actually changed); only the invocation is scoped. If neither a .ttl
    # nor that one doc changed, the ontology library's validity/connectivity
    # cannot have changed either. Measured 2026-08-15: ~38s standalone --
    # the single most expensive per-file-scopable hook after the two
    # rejected below.
    files: \.ttl$|^docs/architecture/ontology_library\.md$
  - id: check-identifier-interpolation
    name: Identifier interpolation — every label/table/rel-type f-string is validated
    entry: python3 scripts/check_identifier_interpolation.py
    language: system
    pass_filenames: false
    # Scoped: scans agent_utilities/**.py only (pkg_root = ROOT/"agent_utilities"
    # in the script). ~19s standalone.
    files: ^agent_utilities/.*\.py$
  - id: check-swallowed-errors
    name: Swallowed errors — no NEW cause-dropping exception handler (ratchet)
    entry: python3 scripts/check_swallowed_errors.py
    language: system
    pass_filenames: false
    # Scoped: scans agent_utilities/**.py only (PKG = ROOT/"agent_utilities"
    # in the script) plus its own ratchet baseline file -- included so
    # editing the baseline itself still re-triggers the check. ~12s standalone.
    files: ^(agent_utilities/.*\.py|scripts/swallowed_error_baseline\.txt)$
  - id: check-event-loop-blocking
    name: Event-loop blocking heuristic (ratchet — no new candidate sites)
    entry: python3 scripts/check_event_loop_blocking.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-no-per-element-ingest-loop
    name: No per-element ingest loop on the agent-facing MCP surface (ratchet, B-11/GOC-68)
    entry: python3 scripts/check_no_per_element_ingest_loop.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-wire-first
    name: Wire-First — reachable != invoked (ratchet; D-OB-9/13/16)
    # Four sweeps in one report: (1) test files under tests/ that testpaths/CI
    # never collect (D-OB-13a), (2) MagicMock(spec=[])/patch(create=True) sites
    # in tests/ (D-OB-13b, informational), (3) except-ImportError handlers that
    # silently no-op instead of visibly skipping (D-OB-16, informational), and
    # (4) public agent_utilities/ classes/functions/methods referenced ONLY
    # from tests/ — no non-test caller (D-OB-9). (1) and (4) are ratcheted
    # against scripts/wire_first_baseline.json: this is a large pre-existing
    # backlog (see the audit in the lane's final report), so — matching
    # check-swallowed-errors above — only a NEW entry beyond the frozen
    # baseline fails the commit; the existing backlog burns down over time via
    # `--update-wire-first-baseline` after a genuine fix, never to silence a
    # regression.
    entry: python3 scripts/check_wiring.py --wire-first-report
    language: system
    pass_filenames: false
    # Scoped: cross-references agent_utilities/**.py (the reachable surface)
    # against tests/**.py (what's invoked from tests) plus its own ratchet
    # baseline file. If none of those changed, neither side of the
    # reachable-vs-invoked comparison could have moved. ~23s standalone.
    files: ^(agent_utilities/.*\.py|tests/.*\.py|scripts/wire_first_baseline\.json)$
  - id: check-release-catalogs
    name: Release catalogs match the checked-in connector manifests (D-35-9)
    entry: python3 scripts/release/check_release_catalogs.py
    language: system
    pass_filenames: false
    # NOT scoped, despite being expensive (~42s standalone, measured
    # 2026-08-15): its inputs cross a repo boundary this diff cannot see.
    # generate_connector_bundle_catalog.py's DEFAULT_AGENTS_ROOT resolves to
    # the SIBLING agent-packages/agents/ fleet checkout, outside this repo
    # entirely -- a connector added/changed there can drift this repo's
    # catalog with ZERO staged files here. always_run is already the only
    # thing giving that drift a chance to be caught (on whatever commit
    # happens next in this repo); a `files:` filter would only narrow that
    # window further with no corresponding safety proof, so left alone per
    # "only scope when scoping cannot make it miss a violation."
    always_run: true
  - id: check-skill-name-collision
    name: Skill names globally unique across the fleet (install-all, no overlap)
    entry: python3 scripts/check_skill_name_collision.py
    language: system
    pass_filenames: false
    always_run: true
  - id: pytest
    name: pytest
    # test_target intentionally left unquoted below: once the tests/unit-style
    # layout is detected, it is expanded to the same multi-directory scope as
    # pytest.ini's own `testpaths` (tests/unit tests/integration tests/retrieval)
    # so this hook and `pytest.ini` never drift — tests/retrieval was
    # previously reachable by neither (CONCEPT:AU-KG.retrieval.context-compiler dead-coverage fix).
    entry: bash -c 'export AGENT_UTILITIES_TEST_REPO_GUARD=revert; test_target="tests"; for d in tests/unit test/unit tests test; do if [ -d "$d" ]; then test_target="$d"; break; fi; done; if [ "$test_target" = "tests/unit" ]; then test_target="tests/unit tests/integration tests/retrieval"; fi; if [ -f uv.lock ]; then python3 scripts/uv_workspace.py run --all-extras pytest $test_target -q --tb=short -m "not slow" --timeout=60; else pytest $test_target -q --tb=short -m "not slow" --timeout=60; fi'
    language: system
    types: [python]
    pass_filenames: false
    always_run: false
    # D-ORC-48: moved off the pre-commit stage to [manual, pre-push], matching
    # the convention this file already uses for every other heavy CI-parity
    # suite (check-security-parser-fuzz, check-security-identity-isolation,
    # check-security-tenant-identity, ...).
    #
    # This is NOT a weakening. The same suite still runs on push, still runs on
    # demand (`pre-commit run pytest --hook-stage manual`), and -- critically --
    # the merge queue gates every candidate against the full suite
    # DIFFERENTIALLY before it lands, which is the standard that actually
    # governs `main`. `main` is legitimately red, so an absolute green at commit
    # time was never the bar being applied anyway.
    #
    # What it cost on the commit stage: once D-CIP-11 installed the missing
    # git hook, every `git commit` in every lane ran the entire suite. Measured
    # 2026-08-02 with ~8 concurrent lanes: 14 concurrent pre_commit hook-impl
    # processes, 52 pytest processes, 11 uv-pool holders, single commits
    # exceeding 40 minutes, and four lanes stalling outright. It also widens the
    # staged_files_only patch-file window, which is the mechanism behind this
    # program's pre-commit data-loss incidents (one lane emptied its own working
    # tree today and recovered only via `git fsck`).
    stages: [manual, pre-push]
  - id: constrained-parallelism
    name: pytest concurrency-sensitive tests under 2-core CPU affinity (GOC-70)
    # See scripts/constrained_parallelism_gate.sh's header for the full
    # rationale (epistemic-graph 2.25.0 shipped green-on-64-cores, red in
    # 2-core CI) and why this is a curated file list, not the full suite.
    entry: bash -c 'if [ -f "scripts/constrained_parallelism_gate.sh" ]; then bash scripts/constrained_parallelism_gate.sh; fi'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: check-agent-standards
    name: check agent standards
    entry: |-
      bash -c 'for f in $(find . -type f -name "agent_server.py" -not -path "*/\.venv/*" -not -path "*/__pycache__/*"); do grep -q "warnings.filterwarnings" "$f" && grep -q "file=sys.stderr" "$f" || { echo "Missing warnings.filterwarnings or file=sys.stderr in $f"; exit 1; }; done'
    language: system
    pass_filenames: false
    always_run: true
  - id: check-cli-help
    name: check cli help
    entry: |-
      bash -c 'for f in $(find . -type f \( -name "mcp_server.py" -o -name "agent_server.py" \) -not -path "*/\.venv/*" -not -path "*/__pycache__/*"); do mod=$(echo "$f" | sed -e "s/^\.\///" -e "s/\.py$//" -e "s/\//./g"); python3 scripts/uv_workspace.py run python -m "$mod" --help >/dev/null || exit 1; done'
    language: system
    pass_filenames: false
    always_run: true
  - id: check-bumpversion
    name: validate bumpversion config
    entry: |-
      bash -c 'if [ -f ".bumpversion.cfg" ]; then bump2version patch --dry-run --allow-dirty; fi'
    language: system
    pass_filenames: false
    always_run: true
- repo: https://github.com/AleksaC/hadolint-py
  rev: 458cb25edf664682e3e856a53a2f9af33e068297 # v2.14.0
  hooks:
  - id: hadolint
    args:
    - --ignore=DL3008
    - --ignore=DL3015
    - --ignore=DL3009
    - --ignore=DL4006
    - --ignore=SC2102
- repo: local
  hooks:
  # `docker compose config` interpolates a compose file's env vars before it
  # can schema-validate it, and 18 vars across docker/ are deliberately marked
  # REQUIRED via `${VAR:?...}` so a real deploy fails loudly on a missing image
  # digest or empty password. In a bare checkout those values do not exist, so
  # the upstream docker-pre-commit hook could NEVER pass here -- and because it
  # was staged on pre-push, it blocked every push rather than catching anything.
  #
  # Interpolation is a precondition for validation, not the thing being
  # validated: what the hook actually catches is schema (typos, bad keys,
  # malformed service definitions), and that needs no real secrets. So we run
  # the same `docker compose config` with an explicit --env-file of inert
  # placeholders. The `${VAR:?...}` guards are untouched and still protect
  # every real deploy -- docker/.env.validation is read only here.
  - id: docker-compose-check
    name: Validate docker compose files
    entry: scripts/check_compose_files.sh
    language: script
    files: ^docker/.*compose.*\.ya?ml$
    stages: [manual, pre-push]
- repo: local
  hooks:
  - id: security-sanitizer
    name: Security and Garbage Sanitizer
    entry: python scripts/security_sanitizer.py
    language: python
    pass_filenames: false
    # NOT scoped, despite measurable cost (~8s standalone, measured
    # 2026-08-15): secret/garbage-pattern scanning is exactly the class of
    # whole-repo invariant a `files:` filter cannot safely narrow -- an
    # unmasked secret can land in any tracked file type. Whole-repo by
    # design, same reasoning as guardrail-tracked-privacy below.
    always_run: true
# Plan 10 guardrail gates. Each defends a specific failure vector and has a
# meta-test in tests/gates/ proving it trips on a broken fixture. BLOCKING gates
# pass today; ADVISORY gates carry a comment explaining the deferred dependency.
- repo: local
  hooks:
  # BLOCKING ---------------------------------------------------------------
  - id: guardrail-no-stub
    name: Guardrail — no production stubs
    entry: python3 scripts/check_no_stub.py
    language: system
    pass_filenames: false
    always_run: true
  - id: guardrail-concept-freshness
    name: Guardrail — concept registry freshness
    entry: python3 scripts/check_concepts.py
    language: system
    pass_filenames: false
    always_run: true
  - id: guardrail-concept-domain-vocab
    name: Guardrail — OKF-CIS closed domain vocab + registered slugs
    entry: python3 scripts/check_domain_vocab.py agent_utilities
    language: system
    pass_filenames: false
    always_run: true
  - id: guardrail-prompt-schema
    name: Guardrail — canonical prompt schema (StructuredPrompt)
    entry: python3 scripts/check_prompt_schema.py
    language: system
    pass_filenames: false
    always_run: true
  - id: guardrail-genesis-manifest
    name: Guardrail — genesis.yaml freshness
    entry: python3 scripts/check_genesis_manifest.py
    language: system
    pass_filenames: false
    always_run: true
  - id: guardrail-surface-parity
    name: Guardrail — every feature reachable via gateway + MCP
    # Relative path so the gate analyzes the tree being committed (its script
    # derives ROOT/baseline from its own location) instead of an unrelated
    # absolute checkout — required for the gate to see this repo's source and
    entry: python3 scripts/check_surface_parity.py
    language: system
    pass_filenames: false
    # Scoped: this gate imports the live agent_utilities package and
    # introspects the runtime gateway/MCP tool registry (reflection, not a
    # static text scan of some other tree) -- its verdict is a pure function
    # of agent_utilities/ source. ~14s standalone.
    files: ^agent_utilities/.*
  - id: guardrail-cpd-drift
    name: Guardrail — Capability Power Descriptors stay in sync (Seam 8 CPD)
    entry: python3 scripts/check_cpd.py
    language: system
    pass_filenames: false
    # Scoped: regenerates the CPD set from the live tool registry (reflection
    # over agent_utilities/) and diffs it against the packaged
    # agent_utilities/knowledge_graph/retrieval/capabilities-power.json
    # catalog -- both sides of the comparison live under agent_utilities/,
    # so a single prefix pattern covers source and packaged-catalog drift
    # alike. ~8s standalone.
    files: ^agent_utilities/.*
  - id: guardrail-docs-contract
    name: Guardrail — docs catalog, links, nav, and generated inventories
    entry: python3 scripts/docs_contract.py --check
    language: system
    pass_filenames: false
    # Scoped: nav/link/catalog checks target docs/, mkdocs.yml, and README.md
    # directly; the "generated inventories" leg (capabilities-power.md/json
    # etc.) is derived from the live agent_utilities/ surface, so source
    # changes there are included too -- a commit touching neither docs/config
    # nor agent_utilities/ source cannot move either side of this contract.
    # ~18s standalone.
    files: ^(docs/.*|README\.md|mkdocs\.yml|agent_utilities/.*\.py)$
  - id: guardrail-tracked-privacy
    name: Guardrail — tracked public artifacts contain no host-specific data or local identities
    entry: python3 scripts/check_tracked_privacy.py
    language: system
    pass_filenames: false
    # NOT scoped, despite being expensive (~19s standalone, measured
    # 2026-08-15): same class as security-sanitizer/secret scanning below --
    # a privacy leak (hostname, local path, identity) can land in ANY
    # tracked file type (docs, config, fixtures, notebooks), not just
    # agent_utilities/**.py, so no `files:` regex narrower than "everything
    # tracked" can be proven not to miss one. Left whole-repo per the
    # explicit carve-out for security/privacy-critical invariant checks.
    always_run: true
  - id: guardrail-kg-skill-coverage
    name: Guardrail — every Graph-OS verb has domain-skill coverage
    # CONCEPT:AU-ECO.mcp.kg-skill-verb-coverage — third parity leg: every live
    # verb must be claimed explicitly in an agents/graph-os.yaml sidecar.
    # Provider-asset resolution needs a reachable graph-os/engine (a bare
    # checkout prints "Provider assets unavailable (error_code=
    # source_unresolved)" for each source) -- same heavy/env-infra class as
    # docs-build/wheel-build/backend-parity/guardrails-lean-parity above.
    # Staged manual/pre-push. Run it via:
    #   pre-commit run guardrail-kg-skill-coverage --hook-stage manual --all-files
    entry: python3 -m agent_utilities.mcp.skill_coverage
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: guardrail-prebundled-skills
    name: Guardrail — consolidated pre-bundled skills stay valid
    entry: python3 scripts/check_prebundled_skills.py
    language: system
    pass_filenames: false
    always_run: true
  - id: guardrail-epistemic-operations-protocol
    name: Guardrail — Epistemic Operations schema/Python/Rust parity
    entry: |-
      bash -c 'canonical_repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); root=${EPISTEMIC_GRAPH_ROOT:-"$(dirname "$canonical_repo")/epistemic-graph"}; python3 scripts/check_epistemic_operations_protocol.py --epistemic-graph-root "$root"'
    language: system
    pass_filenames: false
    always_run: true
  - id: guardrail-version-consistency
    name: Guardrail — release version consistency
    entry: python3 scripts/check_version_consistency.py
    language: system
    pass_filenames: false
    always_run: true
  - id: guardrail-no-pyo3
    name: Guardrail — PyO3 fully excised
    entry: |-
      bash -c 'canonical_repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); root=${EPISTEMIC_GRAPH_ROOT:-"$(dirname "$canonical_repo")/epistemic-graph"}; script="$root/scripts/check_no_pyo3.sh"; if [ ! -f "$script" ]; then echo "Set EPISTEMIC_GRAPH_ROOT to run the cross-repository gate"; exit 1; fi; bash "$script"'
    language: system
    pass_filenames: false
    always_run: true
  # ADVISORY: the cross-UI parity matrix (per CONTRIBUTING-guardrails.md at the
  # agent-packages workspace root) compares feature "Full"/"Absent" status across
  # the 3 UI frontends (agent-webui, agent-terminal-ui, geniusbot) via a
  # workspace-level `scripts/check_parity.py` + `design-system/parity_matrix.yaml`.
  # Neither has ever been implemented (confirmed absent from every repo's git
  # history workspace-wide, not merely moved/renamed) — building it is real
  # multi-repo product work (a genuine feature-parity audit across 3 frontends
  # this repo's worktree cannot touch), not a mechanical path fix, and
  # .github/workflows/guardrails.yml already documents this exact gate as
  # un-runnable in isolated per-repo CI for the same reason. Kept as a visible,
  # non-blocking advisory (rather than hard-failing every commit, in every
  # checkout, on a hardcoded host-specific absolute path that cannot exist
  # anywhere else). Flip back to blocking once the workspace-level script +
  # parity_matrix.yaml are actually built.
  - id: guardrail-parity
    name: Guardrail — cross-UI parity matrix (ADVISORY, script not yet implemented)
    entry: |-
      bash -c 'canonical_repo=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); script=${WORKSPACE_PARITY_SCRIPT:-"$(dirname "$canonical_repo")/scripts/check_parity.py"}; if [ -f "$script" ]; then python3 "$script"; else echo "SKIP -- configure WORKSPACE_PARITY_SCRIPT when the workspace parity gate is available; advisory, not blocking"; fi'
    language: system
    pass_filenames: false
    always_run: true
    verbose: true
  - id: guardrail-retrieval-quality
    name: Guardrail — retrieval quality (Recall@k / MRR floor)
    entry: python3 scripts/check_retrieval_quality.py
    language: system
    pass_filenames: false
    always_run: true
  - id: guardrail-prod-profile
    name: Guardrail — production profile guard
    # Runs in the repo being committed (pre-commit cwd = repo root) so worktrees
    # are gated on their OWN conftest/engine wiring, not the canonical checkout's.
    # AGENT_UTILITIES_ALLOW_ANY_INTERPRETER: deliberately plain system python3
    # for speed, like backend-interface-parity above — the sanctioned exception
    # to tests/conftest.py's D-CC-6 wrong-interpreter fail-fast guard.
    entry: bash -c 'AGENT_UTILITIES_ALLOW_ANY_INTERPRETER=1 python3 -m pytest tests/scale/test_prod_profile_guard.py -q -p no:cacheprovider -o addopts="" -k "prod or profile"'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  # BLOCKING: the anti-sprawl gate (versioned clones, conflict artifacts,
  # botched-merge dividers, oversized tracked binaries). Plan-03 cleared all
  # botched-merge dividers, so this now runs BLOCKING.
  - id: guardrail-sprawl
    name: Guardrail — anti-sprawl
    entry: python3 scripts/check_sprawl.py
    language: system
    pass_filenames: false
    always_run: true
  # ADVISORY: the coupling gate enforces that geniusbot imports agent_utilities
  # only via the allowlisted adapter seam. Kept non-blocking while the
  # concurrent decoupling work stabilizes so in-flight churn can't block
  # commits. Remove the `|| true` once the adapter seam has settled.
  - id: guardrail-coupling-advisory
    name: Guardrail — geniusbot coupling (ADVISORY, decoupling in flight)
    entry: bash -c 'python3 scripts/check_coupling.py || true'
    language: system
    pass_filenames: false
    always_run: true
    verbose: true
  - id: guardrail-entrypoint-engine-authority
    name: Guardrail — every entrypoint reaches the graph through ONE engine authority (D-WD-7)
    entry: python3 scripts/check_entrypoint_engine_construction.py
    language: system
    pass_filenames: false
    always_run: true
  # The four gates below mirror the CI "Guardrails" workflow (guardrails.yml) so
  # a push can't fail a gate that pre-commit didn't already catch locally.
  - id: guardrail-eval-corpus
    name: Guardrail — eval corpus
    entry: python3 scripts/check_eval_corpus.py
    language: system
    pass_filenames: false
    always_run: true
  - id: guardrail-reliability-corpus
    name: Guardrail — reliability corpus
    entry: python3 scripts/check_reliability_corpus.py
    language: system
    pass_filenames: false
    always_run: true
  - id: guardrail-citation-lineage
    name: Guardrail — citation lineage (mandatory evidence citation + embedding versioning)
    entry: python3 scripts/check_citation_lineage.py
    language: system
    pass_filenames: false
    always_run: true
  - id: guardrail-liveness
    name: Guardrail — liveness ratchet
    entry: python3 scripts/check_liveness.py
    language: system
    pass_filenames: false
    # NOT scoped, despite being the single most expensive default-stage
    # local hook measured (~65s standalone, 2026-08-15): its own docstring
    # names a TIME-based invariant a file diff cannot detect -- "a past-due
    # deferred entry also fails the gate" (scripts/liveness_deferred.tsv's
    # owner + review-by expiry). A deferred item can cross its review-by
    # date with zero files changed in this repo, so a `files:` filter would
    # let that regression go undetected past its expiry until some unrelated
    # future commit happens to touch a matched path. Left always_run per
    # "only scope when scoping cannot make it miss a violation" -- this is
    # exactly that case, not a rationalization to avoid the work.
    always_run: true
  - id: guardrail-removed-symbol-consumers
    name: Guardrail — no removed/renamed public symbol still imported by the fleet
    # B-19 (2026-08-13): protect_stdio_jsonrpc was deleted with no consumer
    # migration and broke agents/systems-manager (ImportError at module
    # import — the server could not start) and agents/tunnel-manager (stdio
    # transport). Neither had a control. Compares the public API surface
    # (agent_utilities/) against origin/main and fails on any symbol still
    # imported by a repo in the committed fleet consumer index
    # (scripts/fleet_symbol_consumers.json — regenerate with
    # `python3 scripts/gen_fleet_symbol_consumers.py --update`, needs the
    # agent-packages fleet checked out locally). Scans the whole
    # agent_utilities/ tree plus git history, same heavy/pre-push class as
    # guardrail-liveness and guardrail-surface-parity above; unlike those,
    # this one is stdlib-only (see scripts/_symbol_surface.py) so it needs no
    # managed-venv re-exec. FAILS CLOSED (not skip) if the consumer index is
    # missing, unparseable, or older than 30 days — see the script's
    # docstring for why silently skipping was rejected.
    entry: python3 scripts/check_removed_symbol_consumers.py
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: guardrail-gate-meta-tests
    name: Guardrail — gate meta-tests (prove every gate can fail)
    # Runs in the repo being committed (pre-commit cwd = repo root) so worktrees
    # are gated on their OWN gate tests, matching the prod-profile guard above.
    # D-CDOC-2: this suite imports the live MCP server surface (kg_server ->
    # gen_capability_power -> fastmcp), which the AGENT_UTILITIES_ALLOW_ANY_
    # INTERPRETER escape hatch used to route through the AMBIENT `python3` --
    # a single host-wide interpreter carrying a SHARED, mutable, non-venv
    # editable install of agent_utilities (whichever worktree last ran a
    # system-level `pip install -e .`) plus a stale fastmcp==3.3.1 with no
    # `fastmcp.server.extensions`. That produced two confirmed failure modes:
    # a crash (ModuleNotFoundError: fastmcp.server.extensions) and, worse, a
    # SILENT cross-lane leak -- a traceback rooted entirely in a DIFFERENT,
    # concurrently-running lane's worktree path while this lane's own hook
    # run believed it was checking its own tree. Routing through this
    # worktree's own managed .venv (like the CI-parity suites below) makes
    # `agent_utilities` and `fastmcp` resolve to what THIS lane actually
    # committed, every time. Not a D-CC-6 exception: that escape hatch is for
    # genuinely engine-free, dependency-light checks (see backend-interface-
    # parity), not for a suite that imports the full MCP surface.
    entry: bash -c 'if [ -f uv.lock ]; then python3 scripts/uv_workspace.py run --all-extras -- python3 -m pytest tests/gates -q -p no:cacheprovider -o addopts=""; else AGENT_UTILITIES_ALLOW_ANY_INTERPRETER=1 python3 -m pytest tests/gates -q -p no:cacheprovider -o addopts=""; fi'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
# ── CI parity: gates that live in a CI workflow but had no pre-commit mirror ──
# These close the remaining CI<->pre-commit parity gaps so that
# `pre-commit run --all-files` (default stage) == the union of the non-deploy,
# non-nightly CI gates, and `--hook-stage manual` adds the deploy/nightly build
# gates. Nothing CI checks is left out; heavy gates are staged (not omitted).
- repo: local
  hooks:
  # concept-governance.yml — Extend-Before-Invent gate. New CONCEPT: tags must
  # carry a design doc + a registered pillar prefix. Relative entry so the diff
  # runs against the repo being committed (the worktree), not the canonical
  # checkout. Fast → default (pre-commit) stage, runs on every --all-files.
  - id: check-concept-governance
    name: CI parity — concept governance (Extend-Before-Invent)
    entry: python3 scripts/check_concept_governance.py
    language: system
    pass_filenames: false
    always_run: true
  # concept-governance.yml's merged-audit job (D-RG2-3) — base-less: audits
  # EVERY live CONCEPT id in the tree (not just the diff), ratcheted against
  # scripts/concept_design_doc_baseline.txt. This scans the whole repo tree
  # (~9s), heavier than the diff-based hook above, so it is staged
  # manual/pre-push rather than added to every default --all-files run:
  #   pre-commit run check-concept-governance-merged --hook-stage manual --all-files
  - id: check-concept-governance-merged
    name: CI parity — concept governance (merged-but-undocumented audit, D-RG2-3)
    entry: python3 scripts/check_concept_governance.py --audit-merged
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  # pages.yml — `mkdocs build` (the docs build step of the GitHub Pages deploy
  # workflow). Staged manual/pre-push: it provisions an isolated mkdocs env and
  # is heavier than a per-commit gate, and the deploy itself is push-to-main
  # only. Run it via:  pre-commit run docs-build --hook-stage manual --all-files
  - id: docs-build
    name: CI parity — strict mkdocs docs build (pages.yml)
    entry: bash -c 'mkdocs build --strict --site-dir "$(mktemp -d)/site"'
    language: python
    additional_dependencies: [mkdocs-material==9.7.6, mkdocs-awesome-pages-plugin==2.10.1]
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  # pipeline.yml — `uv build` (the wheel/sdist build step of the PyPI release
  # workflow). Mirrors the packaging build so a broken pyproject/packaging is
  # caught locally instead of on the release push. Staged manual/pre-push.
  # Run it via:  pre-commit run wheel-build --hook-stage manual --all-files
  - id: wheel-build
    name: CI parity — package build (pipeline.yml uv build)
    entry: bash -c 'uv build --out-dir "$(mktemp -d)/dist"'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  # D-CIP-7: pipeline.yml's build-wheel job builds TWICE, requires
  # byte-identical sha256 digests, and runs check_release_wheel.py +
  # check_wheel_privacy.py against BOTH candidates before publishing. The
  # plain `uv build` above only proves the package builds at all — it does
  # not catch a non-reproducible build, a release-surface contract drift, or
  # a privacy leak baked into the wheel, all of which are CI-detectable and
  # were previously locally invisible. Run it via:
  #   pre-commit run wheel-build-reproducibility --hook-stage manual --all-files
  - id: wheel-build-reproducibility
    name: CI parity — wheel reproducibility + release contract + privacy (pipeline.yml)
    entry: python3 scripts/release/check_wheel_build_reproducibility.py
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  # D-CIP-13: the not-yet-pushed commit range is public the moment it is
  # pushed, and git history is not a hiding place — a credential deleted in a
  # later commit is still leaked. This was scratchpad tooling a human had to
  # remember to re-run by hand before the (deliberately deferred) push; now a
  # standing gate. Scoped to pre-push (not every commit): it scans the full
  # origin/main..HEAD patch text, which grows with every commit, so running it
  # per-commit would mean re-scanning an ever-larger range on every single
  # `git commit` for no new signal until the next push.
  # Run it via:  pre-commit run check-secret-history --hook-stage manual --all-files
  - id: check-secret-history
    name: CI parity — credential-shaped content in the unpushed range (D-CIP-13)
    entry: python3 scripts/security/check_secret_history.py --base origin/main
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  # w5-ci-gates-local (D-W5CG-1): mirrors `.mergequeue.yaml`'s `contract-checks`
  # gate (same glob, same bare-invocation shape) so a local `pre-commit run
  # --hook-stage pre-push` reproduces the queue verdict instead of only
  # discovering a contract regression after landing. Two exclusions from the
  # queue's literal glob, both verified live in this worktree, neither this
  # lane's to fix:
  #   * check_current_only_contract_gate.py — see the dedicated hook below.
  #   * check_sbom_licenses.py — needs `uv sync --group guardrails --extra
  #     agent-runtime` PLUS the epistemic-graph/langfuse-agent sibling repos
  #     checked out to audit their real installed license metadata; exits 1 in
  #     ANY bare checkout (confirmed here) for lack of that setup, not because
  #     of a license violation. The queue's `compare: lines` differential
  #     already absorbs this (main fails it identically), but pre-commit has no
  #     differential comparator, so including it here would make this hook
  #     permanently red for an environment reason, in every worktree, forever.
  # Like the queue's own gate, degrades honestly rather than masking: any
  # OTHER forwarder that cannot even launch its target still counts as a
  # failure. Measured cold on this worktree: ~80s for the full glob (dominated
  # by check_context_compiler_boundary_gate.py ~14s,
  # check_swallowed_errors_gate.py ~13s) — too slow for the default commit
  # stage next to this file's sub-second hygiene hooks, so pre-push, same
  # bucket as check-secret-history immediately above.
  - id: contract-checks
    name: CI/queue parity — scripts/security/check_*.py fast-tier forwarders (D-ML-1)
    entry: python3 -c "import glob,subprocess,sys; skip={'scripts/security/check_current_only_contract_gate.py','scripts/security/check_sbom_licenses.py'}; fails=[s for s in sorted(glob.glob('scripts/security/check_*.py')) if s not in skip and subprocess.run([sys.executable,s],capture_output=True,text=True).returncode]; print(chr(10).join(fails)); sys.exit(1 if fails else 0)"
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  # NOT bundled into the hook above, and deliberately not on any commit-time
  # stage at all: scripts/check_current_only_contract.py is real, currently-RED
  # debt (403 pre-existing "retired surface" references, re-measured live -- .mergequeue.yaml's own older comment estimated ~490 — legacy `KG_*`/
  # `kg_coordinator`/etc. tokens the codebase hasn't finished migrating off of,
  # confirmed live in this worktree). `.mergequeue.yaml`'s `contract-checks`
  # gate already anticipated exactly this count in its own `compare: lines`
  # rationale comment; the forwarder that wires it into that glob
  # (`check_current_only_contract_gate.py`) was the one gap — added this lane
  # (D-W5CG-1) — so the QUEUE now catches a NEW retired-surface reference
  # differentially (main's existing debt is not newly refused, only growth is).
  # pre-commit has no differential comparator (unlike the queue's
  # `compare: lines`), so wiring this hard-fail hook into ANY commit-blocking
  # stage today would brick local `git commit`/`git push` repo-wide over
  # pre-existing debt this lane does not own paying down — the same
  # false-green-vs-blocks-everyone tradeoff D-CIP-11 already named once for
  # this repo. `manual` only (not even pre-push) is the honest answer: run it
  # on purpose (`pre-commit run check-current-only-contract-debt --hook-stage
  # manual --all-files`) when you want the current backlog count, same as
  # `pre-commit run --all-files` already surfaces via the queue/CI path.
  - id: check-current-only-contract-debt
    name: Current-only contract debt (retired-surface references) — informational, manual-only
    entry: python3 scripts/security/check_current_only_contract_gate.py
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]
  # D-CIP-6: 9 test files that guardrails.yml/security.yml run directly (not
  # via tests/gates or tests/scale, which ARE already covered by
  # guardrail-gate-meta-tests/guardrail-prod-profile above) had no always-run
  # local mirror — the default `pytest` hook above is diff-scoped
  # (always_run: false, types: [python]) so it only fires when a staged file
  # happens to touch these suites. Split into the SAME 4 groups CI itself
  # uses (one pytest invocation per CI step) rather than one combined
  # invocation: bisected and confirmed that combining
  # tests/unit/mcp/test_graphos_bootstrap_isolation.py with
  # tests/unit/scripts/test_check_fleet_supply_chain.py in a single pytest
  # process causes 2 of the latter's tests to fail (their capsys-captured
  # stdout ends up on stderr) — a real cross-file global-state leak in the
  # test suite, but CI never exercises that combination either (they run in
  # different jobs/steps), so grouping any other way would test a
  # CI-parity gate against a combination CI itself never proves clean.
  - id: check-security-parser-fuzz
    name: CI parity — security.yml parser-fuzz suite
    entry: bash -c 'export AGENT_UTILITIES_TEST_REPO_GUARD=revert; if [ -f uv.lock ]; then python3 scripts/uv_workspace.py run --all-extras -- pytest tests/unit/security/test_parser_fuzz.py -q -p no:cacheprovider -o addopts=""; else pytest tests/unit/security/test_parser_fuzz.py -q -p no:cacheprovider -o addopts=""; fi'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: check-security-identity-isolation
    name: CI parity — security.yml identity/graphos-isolation/cli-secret-refs suite
    entry: bash -c 'export AGENT_UTILITIES_TEST_REPO_GUARD=revert; if [ -f uv.lock ]; then python3 scripts/uv_workspace.py run --all-extras -- pytest tests/unit/core/test_request_identity.py tests/unit/mcp/test_graphos_bootstrap_isolation.py tests/unit/security/test_cli_secret_references.py -q -p no:cacheprovider -o addopts=""; else pytest tests/unit/core/test_request_identity.py tests/unit/mcp/test_graphos_bootstrap_isolation.py tests/unit/security/test_cli_secret_references.py -q -p no:cacheprovider -o addopts=""; fi'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: check-security-tenant-identity
    name: CI parity — security.yml tenant-identity-contract suite
    entry: bash -c 'export AGENT_UTILITIES_TEST_REPO_GUARD=revert; if [ -f uv.lock ]; then python3 scripts/uv_workspace.py run --all-extras -- pytest tests/unit/security/test_tenant_identity_contract.py tests/unit/test_tenant_e2e_au_p0_5.py -q -p no:cacheprovider -o addopts=""; else pytest tests/unit/security/test_tenant_identity_contract.py tests/unit/test_tenant_e2e_au_p0_5.py -q -p no:cacheprovider -o addopts=""; fi'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  # D-CIP-17: 2 tests in this group (test_promote_local_release.py) are
  # EXPECTED to fail with `ReleaseError: unsupported-platform` when the
  # project's own sanctioned local interpreter (a uv-managed
  # python-build-standalone CPython) was built without os.memfd_create —
  # confirmed root cause via direct interpreter probe, not a code
  # regression, and not reproduced under the system python3 that CI's
  # actions/setup-python step most likely provides. Wired anyway (not
  # skipped) so the other 2 files in this group stay covered and the gap
  # stays visible with its tracked root cause, rather than silently omitted.
  - id: check-guardrails-release-supply-chain
    name: CI parity — guardrails.yml promote/supply-chain suite (D-CIP-17, needs memfd_create)
    entry: bash -c 'export AGENT_UTILITIES_TEST_REPO_GUARD=revert; if [ -f uv.lock ]; then python3 scripts/uv_workspace.py run --all-extras -- pytest tests/unit/release/test_promote_local_release.py tests/unit/scripts/test_run_guardrails_lean.py tests/unit/scripts/test_check_fleet_supply_chain.py -q -p no:cacheprovider -o addopts=""; else pytest tests/unit/release/test_promote_local_release.py tests/unit/scripts/test_run_guardrails_lean.py tests/unit/scripts/test_check_fleet_supply_chain.py -q -p no:cacheprovider -o addopts=""; fi'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  # backend-parity (replaces the deleted backend-parity-nightly.yml). That nightly
  # ran the LIVE cross-backend conformance matrix, which needs a running engine +
  # Docker testcontainers (pggraph/AGE, Neo4j, FalkorDB, Fuseki) and so could never
  # be a per-commit gate — it was never reliably green. Here it is split:
  #
  # 1. STATIC contract surrogate — DEFAULT stage, engine-free + fast (~5s, pure class
  #    introspection): asserts every concrete `GraphBackend` implements the SAME
  #    abstract interface, so a backend that drops/renames a contract method is caught
  #    on every commit. This is the engine-free portion the nightly couldn't run here.
  # Plain `python3 -m pytest` (not `uv run --all-extras`): this static surrogate only
  # needs `agent_utilities` importable — NO extras, NO engine — so it stays green
  # without resolving the full optional-dependency set (and runs in ~5s on every commit).
  - id: backend-interface-parity
    name: CI parity — backend interface parity (static, engine-free)
    # AGENT_UTILITIES_ALLOW_ANY_INTERPRETER: this hook deliberately runs under
    # plain system `python3`, not the uv_workspace-managed `.venv` (see the
    # comment above — no extras, no engine, ~5s), so it is the one sanctioned
    # exception to tests/conftest.py's D-CC-6 wrong-interpreter fail-fast guard.
    entry: bash -c 'AGENT_UTILITIES_ALLOW_ANY_INTERPRETER=1 python3 -m pytest tests/unit/test_backend_interface_parity.py -q -p no:cacheprovider -o addopts=""'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  # 2. The LIVE behavioral matrix stays available on demand — staged manual only
  #    (needs Docker + a running engine; never on a normal commit/push).
  #    Run it via:  pre-commit run backend-parity --hook-stage manual --all-files
  - id: backend-parity
    name: CI parity — live backend conformance matrix (manual; Docker + engine)
    entry: bash -c 'AGENT_UTILITIES_TESTING=true AGENT_UTILITIES_ALLOW_ANY_INTERPRETER=1 python3 -m pytest tests/integration/backends -m live -rs --timeout=900'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]
  # docs-consistency gate (tests/docs) — README concept block in sync with
  # docs/concepts.yaml, AGENTS.md regenerated + under its size ceiling, no cache
  # dirs leaked into the project tree. NOT run by the unit-pytest scope (tests/unit)
  # NOR by CI, yet it catches real doc drift on every concept change — so mirror it
  # here (fast, ~7s). Default stage so it runs on every --all-files.
  - id: docs-consistency
    name: CI parity — docs consistency (README/AGENTS vs concepts.yaml)
    entry: bash -c 'if [ -f uv.lock ]; then python3 scripts/uv_workspace.py run --all-extras pytest tests/docs -q -p no:cacheprovider -o addopts=""; else python3 -m pytest tests/docs -q -p no:cacheprovider -o addopts=""; fi'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  # release.yml `gates` job ENVIRONMENT parity — the highest-value parity closure.
  # The gates above run in the developer's FULL install; CI's release.yml `gates`
  # job runs them in a deliberately LEAN install (`uv sync --frozen --extra test
  # --group guardrails --no-install-package epistemic-graph --no-install-package
  # langfuse-agent` — NO [agent-runtime]/[all] extras). A gate that transitively
  # imports an extra-only dep (pydantic_ai, httpx, fastmcp, …) passes locally but
  # dies in CI. This hook reproduces CI's lean env in a throwaway venv and runs
  # EVERY blocking gate inside it (install + gate list both derived from
  # release.yml's `gates` job, so it can't drift). It builds a venv → staged
  # manual/pre-push, too slow for every commit. Run it via:
  #   pre-commit run guardrails-lean-parity --hook-stage manual --all-files
  - id: guardrails-lean-parity
    name: CI parity — guardrail gates in a CI-equivalent LEAN venv
    entry: python3 scripts/run_guardrails_lean.py
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
