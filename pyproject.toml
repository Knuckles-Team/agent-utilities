rdf = [
    "rdflib>=7.6.0"
]
# The lightweight fallback the hosted-ontology lifecycle
# (knowledge_graph/ontology/lifecycle.py) needs at SERVE time (CONCEPT:AU-KG.ontology.activation-icv-fallback):
