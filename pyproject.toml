    #     it is opt-in via `[graph]`, never shipped on the serving default. neo4j/falkordb stay
    #     because they remain actively-selectable mirrors; ladybug does not.
    #
    # RF-ADR-009 SUPERSEDES GOC-73: `epistemic-graph[full]` is a hard BASE
    # dependency again (see the `dependencies` block comment at the top of this
    # file), so `serving` no longer needs to pull it in itself — an existing
    # `pip install agent-utilities[serving]` still gets the engine unchanged,
    # now via base rather than via `graphos`. `feeds` remains an optional serving
    # dependency for RSS ingestion. Code parsing is delegated to the engine's
    # native tree-sitter — no Python tree-sitter is added to the serving plane.
    #
    # OWL reasoning and SHACL validation are engine-native generated contracts.
    # AU retains rdflib only for bounded RDF document construction/parsing.
    # CONCEPT:KG-2.3 — the serving/host plane RUNS ingestion + enrichment, so it needs the
    # CANONICAL embedder. D2 (GHSA-8mgp-746c-j5xp) removed llama-index entirely:
    # `create_embedding_model()`'s openai/ollama providers are now plain
