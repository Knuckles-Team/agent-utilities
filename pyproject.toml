    # floor before the Phase-1 bump), and it's the exact version ccxt==4.5.67
    # hard-pins its own aiohttp dependency to.
    "aiohttp>=3.14.1"   # CVE-2026-50269/54274/54275 — CRLF / websocket limit bypass
