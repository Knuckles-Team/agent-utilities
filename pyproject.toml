[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meristem"
dynamic = ["version"]
description = "Meristem, the in-run agent harness for explicit dependency DAGs and received plans: the agent run loop, edit application, tool contracts, constraints, pre-emit gates, the developer workspace and the host ports arbora fills"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.14.1,<2.15.0.dev0",
    "platformdirs>=4.13.3",
    "pydantic-ai-slim==2.57.0",
    "pydantic-graph==2.57.0",
    "pydantic-ai-harness>=0.57.0,<0.58.0",
]

[project.optional-dependencies]
openai = ["pydantic-ai-slim[openai]==2.57.0"]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.scripts]
agent-utilities = "agent_utilities.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "agent_utilities._version.__version__"}

[tool.setuptools.package-data]
agent_utilities = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_utilities*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "B008", "E501", "B007"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "pydantic-ai-slim[openai]==2.57.0",
    "mypy>=2.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-randomly>=4.0.1",
    "pytest-repeat>=0.9.4",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.0",
]

[tool.pipelines_hooks.public_surface]
repository = "Knuckles-Team/agent-utilities"
distribution = "meristem"
pages_url = "https://knuckles-team.github.io/agent-utilities/"
mcp_server = false

[tool.pipelines_hooks.ste]
paths = ["README.md", "AGENTS.md", "CLAUDE.md", "CHANGELOG.md", "specs"]
exempt = ["specs/_template/*"]
