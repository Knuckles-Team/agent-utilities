[build-system]
requires = ["setuptools>=80.9.0", "wheel", "packaging>=24.2,<26"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "agent-utilities"
dynamic = ["version"]
description = "GraphOS runtime for governed AI agents, orchestration, and the epistemic-graph knowledge engine"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3"]
requires-python = ">=3.11,<3.15"
license = "MIT"
# CURRENT BASE (the self-contained GraphOS floor). The full Rust engine is mandatory;
# configuration, envelopes, and transport dependencies used on every path live here.
# Optional Python application layers such as the agent runtime, document readers,
# provider SDKs, Kafka, ACP, RSS, and mirror backends remain in named extras. Native
# code parsing and database compute are delegated to the mandatory engine. See
# "Dependency discipline" in AGENTS.md.
dependencies = [
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "PyYAML>=6.0.3",
    # Native engine envelopes, analytics jobs, and ingestion batches use msgpack
    # directly on the base GraphOS path.
    "msgpack>=1.2.1",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
    # Security floor: pulled transitively by requests/httpx/anyio; CVE-2026-45409.
    "idna>=3.15",
    # Security floor: pulled transitively by CLI frameworks; PYSEC-2026-2132.
    "click>=8.3.3",
    # Security floor: pulled transitively by document/media features;
    # PYSEC-2026-2253..2257.
    "pillow>=12.3.0",
    "cryptography>=48.0.1,<49",
    "pathspec>=1.1.1",
    "platformdirs>=4.10.0",
    "packaging>=24.2,<26",
    "psutil>=7.2.2",
    "filelock>=3.29.4",
    # Tiny pure-Python safe-XML parser used on the hydration path; kept in base so the
    # XML path is never unguarded.
    "defusedxml>=0.7.1",
    # Parse external GraphQL documents into a bounded AST.  Connector read-only
    # enforcement must not rely on lexical keyword checks that can be confused by
    # comments, strings, fragments, or multiple operations.
    "graphql-core>=3.2.8,<4",
    # Exact release/certification commands validate their packaged JSON Schema
    # subjects at runtime; this cannot live only in the test guardrail group.
    "jsonschema>=4.26.0",
    # CONCEPT:KG-2.324 / CONCEPT:AU-OS.deployment.engine-resolver-auto-provision — the
    # engine is a HARD base dependency, so a bare `pip install agent-utilities` already
    # yields a self-contained, FULLY-CAPABLE graph-os when the approved `epistemic-graph`
    # artifact passes its release gate. The canonical wheel contract builds the whole main
    # CPU feature set (`MATURIN_FEATURES=full,ast-extended` →
    # compute/finance/datascience/mining/graphlearn/reasoning + query/cypher +
    # redb-authoritative durability + security + every wire protocol), and bundles the
    # `epistemic-graph-server` binary (next to `sys.executable`) that graph-os autostarts +
    # supervises over a private UDS socket (EngineResolver, OS-5.63) — no external DB/service.
    # `[full]` is the sole supported engine profile. It includes the compiled
    # `epistemic_graph.numeric` kernel and the numpy dependency used internally for
    # rust-numpy zero-copy interop; agent-utilities imports numpy nowhere.
    #
    # `[full]` (= `[owl,lmcache,numeric]`) adds the pyoxigraph SPARQL/RDF Python interop +
    # httpx accel on top of the numeric kernel; package metadata has exposed this extra
    # since v2.15.0. Consumer CI still imports and executes the folded kernel so metadata
    # alone cannot satisfy the release. NOT
    # `[full-extras]`: that is the engine's opt-in GPU (cudarc) + ROS2/DDS cargo layer, which
    # needs an external CUDA/robotics TOOLCHAIN to run — the opposite of "self-contained, no
    # external dependency" — and is a wheel BUILD variant, not a pip extra (absent from the
    # published CPU wheel).
    #
    # Floor `>=2.23.1` — the compatibility-matrix release used by this ecosystem workspace;
    # it includes the published `[full]` extra and the full Surface-A operation set. Never an
    # exact pin. See docs/guides/numeric-kernel.md.
    "epistemic-graph[full]>=2.23.1,<3.0.0",
]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@example.invalid"

[project.optional-dependencies]
# CONCEPT:ORCH-1.38 — RLM sandbox tiers. `monty` is the default fast/isolated tier
# (small pure-Rust wheel, no transitive deps; backend import guarded so absence degrades
# to the local floor); the CPython-WASI/wasm tier needs `wasmtime`. Both kept here so the
# base install stays light — the RLM router degrades to the local floor when neither is present.
sandbox = [
    "wasmtime>=45.0.0",
    "pydantic-monty>=0.0.18,<0.1.0"
]
# CONCEPT:KG-2.121 — native RSS/Atom feed connector (robust feed parsing). Pulled by
# `serving` (ingestion) and lazily imported by the connector; absent from the lean core.
feeds = [
    "feedparser>=6.0.0"
]
kafka = [
    "aiokafka>=0.14.0"
]
# CONCEPT:OS-5.23 — Python-tier gateway Prometheus metrics. Optional so the
# base install stays light; without it every gateway metric degrades to a
# no-op and GET /metrics returns a placeholder.
metrics = [
    "prometheus-client>=0.25.0"
]
nats = [
    "nats-py>=2.15.0"
]
mcp = [
    "fastmcp>=3.4.2",
    # Schema-only dependency. The native middleware avoids eunomia-mcp's
    # unpatched python-jose/ecdsa transitive chain and unsafe HTTP defaults.
    "eunomia-core>=0.3.10",
    "fastapi>=0.137.0",
    "httpx>=0.28.1",
    # Security floors: pulled transitively by mcp/fastmcp/fastapi.
    "pyjwt>=2.13.0",            # CVE-2026-48522..48526 (PyJWKClient SSRF/DoS/bypass)
    "starlette>=1.3.1",        # CVE-2026-54283 (form() limits ignored)
    "python-multipart>=0.0.31", # CVE-2026-42561/53537-53540 (DoS / param smuggling)
    # Default LLM connector for graph-os: the OpenAI-compatible model client. Local
    # LLMs (vLLM/llama.cpp/Ollama) all speak the OpenAI API, so `openai` is the ONE
    # provider graph-os ships by default (`graph_orchestrate` drives the local model
    # through it). Other providers are opt-in add-ons — `[agent-anthropic]`,
    # `[agent-google]`, `[agent-groq]`, `[agent-mistral]`, `[agent-huggingface]`.
    # `pydantic-ai-slim[openai]` is the lean provider extra (httpx + openai SDK, no
    # torch) — dependency-discipline safe on the serving plane.
    "pydantic-ai-slim[openai]>=2.0.0,<3.0.0"
]
agent-runtime = [
    "agent-utilities[mcp,ag-ui,terminal,sandbox]>=1.0.0",
    "universal-skills>=0.45.0",
    "skill-graphs>=0.38.0",
    "pydantic-ai-skills>=0.11.0",
    # openai is the default bundled provider (local LLMs use the OpenAI API); other
    # providers are opt-in add-ons (`[agent-anthropic]`, `[agent-google]`, …).
    "pydantic-ai-slim[mcp,openai,ag-ui,ui,web,cli]>=2.0.0,<3.0.0",
    "pydantic-graph>=2.0.0,<3.0.0",
    "fasta2a[pydantic-ai]>=0.6.1",
]
# Server-side agent runtime WITHOUT the frontend component libraries. `agent-runtime`
# pulls `ag-ui` (agent-webui) + `terminal` (agent-terminal-ui), which a serving
# process never renders — and agent-webui depends on the FULL `pydantic-ai`
# meta-package, dragging temporalio/botocore/google-genai/grpc/mistralai onto the
# serving image (~140 MB). `agent-headless` is the same skill/runtime stack the
# agent actually needs at serve time, minus those two frontend libs. Used by
# `[serving]`. See AGENTS.md "Dependency discipline".
agent-headless = [
    "agent-utilities[mcp,sandbox]>=1.0.0",
    "universal-skills>=0.45.0",
    "skill-graphs>=0.38.0",
    "pydantic-ai-skills>=0.11.0",
    # openai is the default bundled provider (local LLMs use the OpenAI API); other
    # providers are opt-in add-ons (`[agent-anthropic]`, `[agent-google]`, …).
    "pydantic-ai-slim[mcp,openai,web,cli]>=2.0.0,<3.0.0",
    "pydantic-graph>=2.0.0,<3.0.0",
    "fasta2a[pydantic-ai]>=0.6.1"
]
agent-google = [
    "pydantic-ai-slim[google]>=2.0.0,<3.0.0"
]
agent-groq = [
    "pydantic-ai-slim[groq]>=2.0.0,<3.0.0"
]
agent-mistral = [
    "pydantic-ai-slim[mistral]>=2.0.0,<3.0.0"
]
agent-anthropic = [
    "pydantic-ai-slim[anthropic]>=2.0.0,<3.0.0"
]
agent-huggingface = [
    "pydantic-ai-slim[huggingface]>=2.0.0,<3.0.0"
]
ag-ui = [
    "agent-webui>=0.41.0"]
terminal = [
    "agent-terminal-ui>=0.14.0"]
browser = [
    "playwright>=1.60.0"]
# CONCEPT:ECO-4.93 — GUI computer-use over a gui-sandbox container. Reuses
# container-manager-mcp's manager abstraction (which transitively brings the
# docker[ssh] + tunnel-manager deps), so the actuator never re-implements
# exec-over-ssh. Imported lazily by the driver; absent from lean core.
computer-use = [
    "container-manager-mcp>=1.43.0"]
acp = [
    "pydantic-acp>=0.9.6",
    "acpkit[pydantic]>=0.9.6"
]
documents = [
    "llama-index-core>=0.14.22",
    "llama-index-readers-file>=0.6.0",
    # Security floors: transitive via llama-index-*. uv resolves one version
    # graph-wide, so these raise the floor for the whole all-extras lock.
    "banks>=2.4.2",     # CVE-2026-44209 — CRITICAL Jinja2 SSTI RCE
    "nltk>=3.10.0",     # CVE-2026-54293 — path traversal in nltk.data.load
    "pypdf>=6.13.3",    # CVE-2026-57204 — stream-length limit bypass
    "aiohttp>=3.14.1"   # CVE-2026-50269/54274/54275 — CRLF / websocket limit bypass
]
embeddings = [
    "llama-index-core>=0.14.22"]
embeddings-openai = [
    "agent-utilities[embeddings]>=1.0.0",
    "llama-index-embeddings-openai>=0.6.0",
    # OpenAI LLM bindings (previously provided unconditionally via base); the embeddings
    # plane that talks to OpenAI needs it.
    "llama-index-llms-openai>=0.7.9"]
embeddings-huggingface = [
    "agent-utilities[embeddings]>=1.0.0",
    "llama-index-embeddings-huggingface>=0.7.0"]
embeddings-ollama = [
    "agent-utilities[embeddings]>=1.0.0",
    "llama-index-embeddings-ollama>=0.9.0"]
logfire = [
    # Observability must remain composable. Provider packages commonly request
    # `[agent-runtime,logfire]`; this extra stays independent of the full UI stack.
    # Declare the SDK directly because recursive self-extras can lose dependency
    # extras in lock projections, leaving an apparently enabled runtime without
    # the instrumentation package.
    "logfire[httpx]>=4.16.0,<5"
]
# Native read/write observability integration. The MCP child is mounted lazily
# only when credentials are configured, so the serving process pays no child
# process cost when Langfuse is unused.
langfuse = [
    "langfuse-agent[mcp]>=1.0.3,<2",
    # The graph-run exporter passes an isolated SDK TracerProvider to the
    # OpenTelemetry-backed client.  That is a Langfuse v4 constructor contract,
    # so do not let the provider package's broader transitive floor select an
    # older client that can fall back to GraphOS/logfire's global provider.
    "langfuse>=4.0.0,<5",
]
graph = [
    "ladybug>=0.17.1"
]
ann = [
    "hnswlib>=0.8.0"
]
neo4j = [
    "neo4j>=6.2.0"
]
falkordb = [
    "falkordb>=1.6.1"
]
owl = [
    "owlready2>=0.50",
    "rdflib>=7.6.0",
    "pyshacl>=0.31.0"
]
stardog = [
    "agent-utilities[owl]",
    "pystardog>=0.20.0"
]
fuseki = [
    "httpx>=0.28.1",
    "rdflib>=7.6.0"
]
event-kafka = [
    "confluent-kafka>=2.14.2"
]
ingest-dedup = [
    # CONCEPT:AHE-3.70 — cheap deterministic name normalizers for the entity-
    # resolution ladder. Accent folding uses the standard library; inflect adds
    # singularization without introducing a GPL transliteration dependency.
    "inflect>=7.0.0"
]
vault = [
    "hvac>=2.4.0"
]
auth = [
    "joserfc>=1.7.1"
]
serving = [
    # The serving plane (graph-os MCP, host daemon, messaging): NO heavy ML/native deps.
    # Heavy compute is remote (vLLM) or in the Rust engine; torch/transformers/AVX-ann are
    # excluded on purpose (they SIGILL on old CPUs + bloat the image). See AGENTS.md dep rule.
    #
    # Deliberately EXCLUDED from the serving plane (kept in the host-daemon / domain images):
    #   - finance: scipy + pandas + statsmodels (~360 MB). The only serving consumer was the
    #     `quant` MCP tool's boot-time registration; that registration is now guarded
    #     (mcp/tools/ontology_tools.py) so kg_server boots cleanly without it.
    #   - agent-runtime (→ ag-ui/terminal): agent-webui + agent-terminal-ui are FRONTEND component
    #     libs a server never renders, and agent-webui pulls the full pydantic-ai meta
    #     (temporalio/botocore/google-genai/grpc/mistralai, ~140 MB). Replaced by the
    #     `agent-headless` extra (same skill/runtime stack, no frontends).
    #   - documents: document readers are ingestion-only; the MCP query/serving
    #     surface never parses PDFs. PDF extraction uses the bounded pypdf path.
    #
    #   - graph (ladybug): a contrib MIRROR backend only (primary store is engine + postgres);
    #     it is opt-in via `[graph]`, never shipped on the serving default. neo4j/falkordb stay
    #     because they remain actively-selectable mirrors; ladybug does not.
    #
    # `epistemic-graph[full]` is a hard base dependency, while `feeds` remains an optional
    # serving dependency for RSS ingestion. Code parsing is delegated to the engine's native
    # tree-sitter — no Python tree-sitter is added to the serving plane.
    #
    # `owl` (rdflib/owlready2/pyshacl) is DELIBERATELY EXCLUDED from the serving plane
    # (CONCEPT:KG-2.242): the semantic-web stack — SPARQL, OWL DL reasoning, SHACL — is
    # demoted to the engine's native RDF/SPARQL/OWL surface (`client.rdf.*`), which ships
    # in every profile. rdflib/owlready2/pyshacl are now a
    # true last-resort Python fallback in the `[owl]` extra only, kept import-lazy so
    # `import agent_utilities` + a kg_server boot pull none of them. See AGENTS.md dep rule.
    # CONCEPT:KG-2.3 — the serving/host plane RUNS ingestion + enrichment, so it needs the
    # CANONICAL embedder, not the bare `embeddings` core. `embeddings` pulls only
    # `llama-index-core` (no provider), so `create_embedding_model()` / `make_embed_fn()`
    # (which import `llama_index.embeddings.openai` to talk to the bge-m3 vLLM endpoint) raise
    # `ModuleNotFoundError: No module named 'llama_index.embeddings'` on the host — dead-lettering
    # every document ingest and producing ZERO embeddings fleet-wide. `embeddings-openai` ships the
    # OpenAI-compatible provider (+ llms-openai) the vLLM embedding plane requires. See AGENTS.md.
    # Include Logfire so the enabled OTel/Langfuse profile can instrument
    # Pydantic-AI calls in the shipped GraphOS process instead of degrading to a
    # configuration-only warning.
    "agent-utilities[mcp,feeds,embeddings-openai,neo4j,falkordb,auth,metrics,agent-headless,logfire,langfuse]",
]
finance = [
    # NO torch / scikit-learn here: the torch-backed TradingLSTM walk-forward
    # trainer (the only sklearn user in finance) was re-homed to
    # data-science-mcp[training]. See AGENTS.md "Dependency discipline".
    # numpy/scipy are NOT declared here (CONCEPT:KG-2.324 — the hard drop): the finance
    # domain code computes through the `agent_utilities.numeric` kernel shim, and
    # statsmodels / hmmlearn / pandas pull numpy/scipy transitively for their own use.
    "statsmodels>=0.14.6",
    "yfinance>=1.4.1",
    "pandas>=2.0.0,<3",
    "httpx>=0.28.1",
    "websockets>=16.0",
    "hmmlearn>=0.3.3"
]
finance-kronos = [
    "agent-utilities[finance]",
    "transformers>=5.12.0",
    "safetensors>=0.8.0"
]
hr = []
medical = []
science = []
law = []
government = []
postgresql = [
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1"
]
# Native Messaging Backend Abstraction (CONCEPT:ECO-4.5)
messaging-discord = ["discord.py>=2.7.1"]
messaging-slack = ["slack-bolt>=1.28.0"]
messaging-telegram = ["python-telegram-bot>=22.8"]
messaging-whatsapp = ["neonize>=0.3.18.post0", "httpx>=0.28.1"]
messaging-teams = ["botbuilder-core>=4.17.1"]
messaging-googlechat = ["google-api-python-client>=2.197.0", "google-auth>=2.54.0"]
messaging-googlemeet = ["google-api-python-client>=2.197.0", "google-auth>=2.54.0"]
messaging-mattermost = ["mattermostdriver>=7.3.2"]
messaging-matrix = ["matrix-nio>=0.25.2"]
messaging-irc = ["irc>=20.5.0"]
messaging-signal = []
messaging-imessage = []  # macOS-only, AppleScript bridge
messaging-line = ["line-bot-sdk>=3.23.0"]
messaging-twitch = ["twitchio>=3.2.2"]
messaging-synology = ["httpx>=0.28.1"]
messaging-voicecall = ["twilio>=9.10.9"]
messaging-nextcloud = ["httpx>=0.28.1"]
messaging = [
    "agent-utilities[messaging-discord,messaging-slack,messaging-telegram,messaging-whatsapp,messaging-teams,messaging-googlechat,messaging-googlemeet,messaging-mattermost,messaging-matrix,messaging-irc,messaging-signal,messaging-line,messaging-twitch,messaging-synology,messaging-voicecall,messaging-nextcloud]"
]
test = [
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.155.2",
    "pytest-cov>=7.1.0",
    "mypy>=2.1.0",
    "ruff>=0.15.17",
    "mutmut>=3.6.0",
    "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",
    "pytest-env>=1.6.0",
    "pytest-timeout>=2.4.0",
    "syrupy>=4.0",
    "opentelemetry-instrumentation-starlette",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-asgi",
    # CONCEPT:KG-2.324 — numpy is a DEV/TEST-ONLY dependency (never runtime): it is the
    # GROUND-TRUTH reference in tests/test_numeric_parity.py that proves the compiled
    # `epistemic_graph.numeric` kernel matches numpy. The runtime path imports numpy
    # nowhere (the `xp` shim is kernel-or-raise). scipy is NOT needed — the four scipy ops
    # are native kernel exports (`xp.eigsh`/`spearmanr`/`ks_2samp`/`norm_ppf`/`norm_pdf`).
    "numpy>=2.4.6",
    # `agent-runtime` already implies mcp+sandbox; the full engine is a hard base
    # dependency. Add `feeds` (RSS ingestion tests)
    # and the explicit backend extras the suite exercises.
    "agent-utilities[agent-runtime,feeds,sandbox,graph,acp,owl,finance,event-kafka]"
]
# CONCEPT:KG-2.0 / KG-2.7 — live cross-backend parity + enterprise-profile e2e.
# Pulls every storage/queue/SPARQL driver plus testcontainers so
# `pytest -m live` can stand up throwaway pg-age/Neo4j/FalkorDB/Fuseki/Kafka.
test-backends = [
    "agent-utilities[test,neo4j,falkordb,postgresql,kafka,owl,fuseki]",
    "testcontainers>=4.14.2"
]
all = [
    "agent-utilities[mcp,feeds,agent-runtime,agent-google,agent-groq,agent-mistral,agent-anthropic,agent-huggingface,embeddings-openai,embeddings-huggingface,embeddings-ollama,logfire,langfuse,acp,documents,graph,ann,sandbox,browser,test,owl,stardog,vault,auth,finance,messaging]>=1.0.0"]

[project.scripts]
