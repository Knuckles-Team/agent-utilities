[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0", "packaging>=26.2.0"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "agent-utilities"
dynamic = ["version"]
description = "GraphOS runtime for governed AI agents, orchestration, and the epistemic-graph knowledge engine"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3"]
requires-python = ">=3.12,<3.15"
license = "MIT"
# CURRENT BASE (the eg-absent floor). Configuration, envelopes, and transport
# dependencies used on every path — including paths that never touch the engine —
# live here. GOC-73: `epistemic-graph[full]` moved OUT of base into the `[graphos]`
# extra (see `[project.optional-dependencies].graphos` below) because a hard base
# dependency on an unpublished eg floor (`>=2.23.2`, PyPI's newest is 2.23.0) blocked
# every consumer that imports `agent_utilities` but never touches the engine (e.g.
# agent-webui: 151 `agent_utilities` import sites, zero real `epistemic_graph` usage).
# `[full]`/`[all]`/`[serving]` all still pull `[graphos]` so an existing
# `pip install agent-utilities[full-or-all-or-serving]` is unaffected; only the
# BARE `pip install agent-utilities` (no extras) no longer gets the engine — see the
# `graphos` extra's comment for the full compatibility/blast-radius analysis. Optional
# Python application layers such as the agent runtime, document readers, provider
# SDKs, Kafka, ACP, RSS, and mirror backends remain in named extras. Native code
# parsing and database compute are delegated to the (now optional) engine. See
# "Dependency discipline" in AGENTS.md.
dependencies = [
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "PyYAML>=6.0.3",
    # Native engine envelopes, analytics jobs, and ingestion batches use msgpack
    # directly on the base GraphOS path.
    "msgpack>=1.2.1",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
    # Security floor: pulled transitively by requests/httpx/anyio; CVE-2026-45409.
    "idna>=3.18",
    # Security floor: pulled transitively by CLI frameworks; PYSEC-2026-2132.
    "click>=8.4.2",
    # Security floor: pulled transitively by document/media features;
    # PYSEC-2026-2253..2257.
    "pillow>=12.3.0",
    # Floor raised to the current major (49.0.0); repo carries no usage of the
    # aliases/modes/ciphers removed in 49 (PUBLIC_KEY_TYPES-style aliases, CFB/OFB/
    # CFB8, Camellia) — verified clean via grep before lifting the old `<49` cap.
    # D-W5AL-1: raised again to 50.0.0 to close GHSA-g6cj-pr64-35w5 / PYSEC-2026-3552
    # (fixed=50.0.0) — the OSV dependency-audit gate fails closed on the unpatched
    # 49.0.0 floor otherwise, and a bare `>=49.0.0` floor lets a future re-lock
    # silently re-select the vulnerable version.
    "cryptography>=50.0.0",
    "pathspec>=1.1.1",
    "platformdirs>=4.11.0",
    "packaging>=26.2.0",
    "psutil>=7.2.2",
    "filelock>=3.32.0",
    # Tiny pure-Python safe-XML parser used on the hydration path; kept in base so the
    # XML path is never unguarded.
    "defusedxml>=0.7.1",
    # Parse external GraphQL documents into a bounded AST.  Connector read-only
    # enforcement must not rely on lexical keyword checks that can be confused by
    # comments, strings, fragments, or multiple operations.
    "graphql-core>=3.2.11,<4",
    # Exact release/certification commands validate their packaged JSON Schema
    # subjects at runtime; this cannot live only in the test guardrail group.
    "jsonschema>=4.26.0",
    # CONCEPT:AU-OS.config.secrets-authentication — JWT bearer verification
    # (security/auth.py `_decode_jwt`, security/request_identity.py) is a base
    # capability of every served profile (non-loopback listeners REQUIRE this
    # boundary), not an opt-in extra. Formerly gated behind `[auth]`, a runtime
    # image that installed agent-utilities without that extra had NO joserfc, so
    # `_decode_jwt`'s ImportError was mis-surfaced as a 401 "Token validation
    # failed" for every caller — a dependency accident masquerading as a
    # rejected credential; see the fixed error-reporting path in
    # `security/auth.py`/`security/request_identity.py`. Promoted to base so
    # enforcement is a pure runtime/config toggle (`AUTH_JWT_JWKS_URI` set or
    # not — see `TestVerifyCredentials` in `tests/unit/core/test_auth.py`),
    # never a packaging accident. Pure-Python (no compiled extension); its only
    # dependency is `cryptography`, already required above — so this adds ~71 KB
    # wheel / ~560 KB installed and zero new transitive packages. Import is
    # lazy (inside `_decode_jwt`), so processes that never verify a JWT pay
    # nothing; the one-time cost when the path IS exercised is ~80ms (pulling
    # additional `cryptography.x509` submodules `import cryptography` alone
    # does not load). `[auth]` is kept below as a no-op alias extra: ~69
    # external fleet manifests still pin `agent-utilities[auth]` and must keep
    # resolving.
    "joserfc>=1.7.4",
]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@example.invalid"

[project.optional-dependencies]
# CONCEPT:KG-2.324 / CONCEPT:AU-OS.deployment.engine-resolver-auto-provision — GOC-73:
# the epistemic-graph engine moved from a hard base dependency to this OPT-IN extra.
# `pip install agent-utilities[graphos]` yields a self-contained, FULLY-CAPABLE
# graph-os when the approved `epistemic-graph` artifact passes its release gate. The
# canonical wheel contract builds the whole main CPU feature set
# (`MATURIN_FEATURES=full,ast-extended` → compute/finance/datascience/mining/
# graphlearn/reasoning + query/cypher + redb-authoritative durability + security +
# every wire protocol), and bundles the `epistemic-graph-server` binary (next to
# `sys.executable`) that graph-os autostarts + supervises over a private UDS socket
# (EngineResolver, OS-5.63) — no external DB/service. `[full]` is the sole supported
# engine profile. It includes the compiled `epistemic_graph.numeric` kernel, whose
# Python boundary accepts built-in sequences and has no NumPy package dependency;
# agent-utilities imports NumPy nowhere on the runtime path.
#
# `[full]` (= `[owl,lmcache,numeric]`) adds the pyoxigraph SPARQL/RDF Python interop +
# httpx accel on top of the numeric kernel; package metadata has exposed this extra
# since v2.15.0. Consumer CI still imports and executes the folded kernel so metadata
# alone cannot satisfy the release. NOT `[full-extras]`: that is the engine's opt-in
# GPU (cudarc) + ROS2/DDS cargo layer, which needs an external CUDA/robotics
# TOOLCHAIN to run — the opposite of "self-contained, no external dependency" — and
# is a wheel BUILD variant, not a pip extra (absent from the published CPU wheel).
#
# Floor `>=2.23.2` — the compatibility-matrix release used by this ecosystem
# workspace; it includes the published `[full]` extra and the full Surface-A
# operation set. Never an exact pin. See docs/guides/numeric-kernel.md.
#
# WHO ACTUALLY NEEDS THIS (see the module-load audit in the GOC-73 report): every
# direct `import epistemic_graph` / `from epistemic_graph import ...` in this
# repository is either (a) already a LAZY, function-scoped import (the
# `knowledge_graph` engine-client call sites in core/graph_compute.py,
# core/placement_catalog.py, pipeline/phases/parse.py, analytics_worker.py,
# protocols/a2a_epistemic.py, mcp/tools/engine_tools.py, deployment/production_ops.py
# — none of these execute at `import agent_utilities.<subpackage>` time) or (b) the
# ONE genuinely unconditional module-load-time import,
# `agent_utilities/numeric/__init__.py` (the `xp` numeric-kernel shim), which raises
# a clear `ImportError` naming this extra instead of failing silently or stubbing.
# `agent_utilities.numeric` is imported (transitively) by `domains/*` (finance) and a
# handful of `knowledge_graph` analytics call sites that *use* the kernel-backed `xp`
# surface — but NOT by importing the `knowledge_graph`, `server`, `core`, `security`,
# `gateway`, `observability`, `models`, `mcp`, `sdd`, or `orchestration` packages
# themselves; those only pull `agent_utilities.numeric` inside the specific functions
# that need array math. Bare `import agent_utilities.<subpackage>` for all ten stays
# eg-free — see the acceptance-test venv in the GOC-73 report.
graphos = [
    "epistemic-graph[full]>=2.23.2,<3.0.0",
]
# CONCEPT:ORCH-1.38 — RLM sandbox tiers. `monty` is the default fast/isolated tier
# (small pure-Rust wheel, no transitive deps; backend import guarded so absence degrades
# to the local floor); the CPython-WASI/wasm tier needs `wasmtime`. Both kept here so the
# base install stays light — the RLM router degrades to the local floor when neither is present.
sandbox = [
    "wasmtime>=47.0.1",
    "pydantic-monty>=0.0.18,<0.1.0"
]
# CONCEPT:KG-2.121 — native RSS/Atom feed connector (robust feed parsing). Pulled by
# `serving` (ingestion) and lazily imported by the connector; absent from the lean core.
feeds = [
    "feedparser>=6.0.12"
]
kafka = [
    "aiokafka>=0.14.0"
]
# CONCEPT:OS-5.23 — Python-tier gateway Prometheus metrics. Optional so the
# base install stays light; without it every gateway metric degrades to a
# no-op and GET /metrics returns a placeholder.
metrics = [
    "prometheus-client>=0.25.0"
]
# CONCEPT:AU-OS.observability.telemetry-observability (OBS-P1-2/X2) — standalone OTLP
# trace export. `TelemetryEngine._setup_otel()` (observability/__init__.py) and the
# engine-RPC span in `knowledge_graph/core/graph_compute.py` import-guard these two
# packages, so the base install/`[mcp]`/`[serving]` stay unaffected without this extra.
# `[logfire]` already carries `opentelemetry-sdk` + this same OTLP/HTTP exporter
# transitively (for the Logfire+pydantic-ai-instrumentation pipeline in
# `custom_observability.py`) — this extra is for a deployment that wants ONLY the
# standard OTel SDK + OTLP/HTTP exporter (e.g. a plain k8s Tempo/Alloy collector)
# without pulling Logfire's heavier dependency chain.
otel = [
    "opentelemetry-sdk>=1.30.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0,<2",
]
nats = [
    "nats-py>=2.15.0"
]
# CONCEPT:AU-KG.query.knowledge-stream-consumer — decode the engine's bounded Arrow-IPC
# `KnowledgeBatch` stream (`Method::KnowledgeStream`) into `pyarrow.RecordBatch`
# pages. Optional so the base install stays light: `knowledge_stream._pyarrow()`
# import-guards it and BOTH `KnowledgeGraph.query_batches` / `stream_epistemic_by_label`
# degrade to `None` when it (or the engine's `.knowledge` surface) is absent — a caller
# falls back to a non-columnar read. pyarrow >= 17 needs no numpy and no ML/CUDA wheel,
# so it is dependency-discipline safe on the serving plane.
pyarrow = [
    "pyarrow>=17.0.0"
]
# NE-114 — operator-only data-quality certification.  These extras are mutually
# optional and intentionally do not enter the serving/agent hot path.  The job
# imports the selected provider only when executed; the Arrow currency remains
# the existing pyarrow extra and the Rust engine remains the SHACL/ICV authority.
data-quality-ge = [
    "pyarrow>=17.0.0",
    "great-expectations>=1.3.0,<2",
]
data-quality-pandera = [
    "pyarrow>=17.0.0",
    "pandera>=0.26.0,<1",
]
mcp = [
    # fastmcp 4 is the default (CONCEPT:AU-ECO.mcp.protocol-compat-bridge). Empirically
    # verified (see agent_utilities/mcp/protocol_compat.py + docs/architecture/fastmcp4-default.md):
    # `pydantic_ai.mcp` (pydantic-ai-slim 2.29.0, the supported release) natively
    # handles both MCP SDK field spellings and modern FastMCP sessions. The exact
    # Pydantic-AI pin below is intentional: protocol_compat.py verifies this
    # contract and refuses an unverified runtime version; it no longer monkeypatches
    # upstream MCPToolset methods or installs process-global aliases.
    "fastmcp>=4.0.0b1",
    # Schema-only dependency. The native middleware avoids eunomia-mcp's
    # unpatched python-jose/ecdsa transitive chain and unsafe HTTP defaults.
    "eunomia-core>=0.3.10",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    # Security floors: pulled transitively by mcp/fastmcp/fastapi.
    "pyjwt>=2.13.0",            # CVE-2026-48522..48526 (PyJWKClient SSRF/DoS/bypass)
    "starlette>=1.3.1",        # CVE-2026-54283 (form() limits ignored)
    "python-multipart>=0.0.32", # CVE-2026-42561/53537-53540 (DoS / param smuggling)
    # Default LLM connector for graph-os: the OpenAI-compatible model client. Local
    # LLMs (vLLM/llama.cpp/Ollama) all speak the OpenAI API, so `openai` is the ONE
    # provider graph-os ships by default (`graph_orchestrate` drives the local model
    # through it). Other providers are opt-in add-ons — `[agent-anthropic]`,
    # `[agent-google]`, `[agent-groq]`, `[agent-mistral]`, `[agent-huggingface]`.
    # `pydantic-ai-slim[openai]` is the lean provider extra (httpx + openai SDK, no
    # torch) — dependency-discipline safe on the serving plane.
    "pydantic-ai-slim[openai]==2.29.0"
]
agent-runtime = [
    "agent-utilities[mcp,ag-ui,terminal,sandbox]>=1.0.0",
    "universal-skills>=1.2.1",
    "skill-graphs>=1.1.0",
    "pydantic-ai-skills>=1.2.0",
    # openai is the default bundled provider (local LLMs use the OpenAI API); other
    # providers are opt-in add-ons (`[agent-anthropic]`, `[agent-google]`, …).
    "pydantic-ai-slim[mcp,openai,ag-ui,ui,web,cli]==2.29.0",
    "pydantic-graph==2.29.0",
    "fasta2a[pydantic-ai]>=0.6.1",
    # CONCEPT:AU-OS.safety.harness-guardrails-adoption — bare harness (no extras): its
    # own metadata requires only httpx + pydantic-ai-slim (both already required above),
    # so it rides along wherever an agent can be built. Provides InputGuardrail/
    # OutputGuardrail, the live replacement for the dead PolicyEngine (D-48), wired
    # default-on via capabilities/content_guardrails.py. NOT `[dynamic-workflow]`/`[acp]`
    # — those extras' heavier deps (pydantic-monty, agent-client-protocol) stay opt-in.
    "pydantic-ai-harness>=0.14.0,<0.15.0",
]
# Server-side agent runtime WITHOUT the frontend component libraries. `agent-runtime`
# pulls `ag-ui` (agent-webui) + `terminal` (agent-terminal-ui), which a serving
# process never renders — and agent-webui depends on the FULL `pydantic-ai`
# meta-package, dragging temporalio/botocore/google-genai/grpc/mistralai onto the
# serving image (~140 MB). `agent-headless` is the same skill/runtime stack the
# agent actually needs at serve time, minus those two frontend libs. Used by
# `[serving]`. See AGENTS.md "Dependency discipline".
agent-headless = [
    "agent-utilities[mcp,sandbox]>=1.0.0",
    "universal-skills>=1.2.1",
    "skill-graphs>=1.1.0",
    "pydantic-ai-skills>=1.2.0",
    # openai is the default bundled provider (local LLMs use the OpenAI API); other
    # providers are opt-in add-ons (`[agent-anthropic]`, `[agent-google]`, …).
    "pydantic-ai-slim[mcp,openai,web,cli]==2.29.0",
    "pydantic-graph==2.29.0",
    "fasta2a[pydantic-ai]>=0.6.1",
    # See agent-runtime above: bare harness for InputGuardrail/OutputGuardrail
    # (CONCEPT:AU-OS.safety.harness-guardrails-adoption), the serving-plane path.
    "pydantic-ai-harness>=0.14.0,<0.15.0",
]
agent-google = [
    "pydantic-ai-slim[google]==2.29.0"
