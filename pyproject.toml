[tool.mypy]
# D-25-7: this pin had drifted below `requires-python`'s actual floor
# (">=3.12,<3.15"), so mypy type-checked against pre-3.12 stdlib/typeshed
# semantics while the resolved numpy stub already used a 3.12+ `type`
# statement -- failing before mypy ever reached any real source file.
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false

# --- mypy debt baseline (see .specify/reports/mypy-remediation-plan.md) ---
# 596 of ~723 errors are [attr-defined] false positives from pydantic-graph generic
# state/deps access: mypy cannot resolve concrete fields (ctx.state.query,
# node.plan, NodeSnapshot.run_id, ...) through BaseNode[StateT, ...] /
# GraphRunContext[StateT, DepsT]. These are framework-pattern noise, not bugs.
# Scope the suppression to attr-defined in the five graph/checkpoint hot files ONLY,
# so every other module — and all NEW code — stays strictly checked. The real fix
# (typed State/Deps protocols on each node generic) is tracked in the remediation
# plan as Phase 2; remove an entry here as each file is properly annotated.
[[tool.mypy.overrides]]
module = [
    "agent_utilities.graph._router_impl",
    "agent_utilities.graph.executor",
    "agent_utilities.graph.verification",
    "agent_utilities.graph.hierarchical_planner",
    "agent_utilities.core.checkpoint.manager",
]
disable_error_code = ["attr-defined"]

[tool.uv]
# INFRA-2 (RMDD-D2): the lock (`uv.lock:11`, `prerelease-mode = "allow"`) and this
# manifest disagreed — nothing here declared the mode, so any invocation without an
# explicit `--prerelease`/`UV_PRERELEASE` flag (e.g. `run_agent_utilities_gate.py`'s
# `uv run --project <au> --locked python`) fell back to uv's default
# `if-necessary-or-explicit`, forcing an unwanted re-resolve that `--locked` then
# correctly refused, taking down `okf-no-legacy-concepts`, `check-stubs`,
# `check-cli-help`, and `pytest` fleet-wide. Declaring it here is the chokepoint: every
# caller of this project inherits the mode with no per-caller flag, and it makes
# pyproject.toml agree with what the lock already recorded. `uv lock --check` before and
# after resolves the identical 366 packages — this is a declaration, not a re-resolution.
prerelease = "allow"
override-dependencies = [
    # CONCEPT:PHASE2-RECONCILE — nltk transitively pinned below 3.10 by an older
    # fleet dependency; the ecosystem-wide resolve needs the 3.10+ floor.
    "nltk>=3.10.0",
    # CONCEPT:AU-ECO.mcp.protocol-compat-bridge — fastmcp 4 is the default (see the
    # `[mcp]` extra above). `fastmcp==4.0.0b1` pins an exact `fastmcp-slim[client,server]
    # ==4.0.0b1`, while pydantic-ai-slim 2.29.0 now declares
    # `fastmcp-slim[client]<5,>=3.3.0` and natively supports the FastMCP 4
    # protocol. This workspace-wide override remains the explicit fastmcp-4
    # policy for image/fleet consumers that do not carry AU's direct floor; it
    # is no longer compensating for a Pydantic-AI client cap.
    #
    # Both `client` and `server` extras MUST be listed here: uv's override
    # replaces the ENTIRE requirement (extras included) for every requester of
    # `fastmcp-slim` project-wide, including `fastmcp`'s own metadata pin
    # (`fastmcp-slim[client,server]==4.0.0b1`) that server-side code
    # (`agent_utilities/mcp/server_factory.py`, `from fastmcp import Context`)
    # needs. Verified empirically: an override listing only `[client]` silently
    # strips the `server` extra's transitive deps (`uncalled-for`, `cyclopts`,
    # `griffelib`, …) project-wide, breaking every `from fastmcp import
    # FastMCP/Context` — a real regression this exact override could have
    # caused, caught only by installing the full `agent-runtime` extra into a
    # real venv and importing `fastmcp.Context`.
    "fastmcp-slim[client,server]>=4.0.0b1",
]

# CONCEPT:PHASE2-RECONCILE — searxng has no published wheel for the current
# interpreter floor, so uv must build it from sdist; its build backend needs
# these declared explicitly since it doesn't ship a PEP 517 build-requires
# that resolves cleanly against the rest of the workspace lock.
[tool.uv.extra-build-dependencies]
searxng = ["pyyaml", "msgspec", "typing-extensions", "setuptools"]

[tool.uv.sources]
# D-UVN-1: keep the engine as a plain editable PATH source rather than a nested
# uv workspace member. `.uv-workspace-siblings/` is materialized by the AU
# workspace helper for isolated development and fleet consumers.
#
# Langfuse's optional MCP provider is deployment composition, not an AU runtime
# dependency. GraphOS installs the provider as its own image component when the
# deployment enables it, so AU intentionally has no provider source declaration
# here. The SDK contract remains in the `[langfuse]` extra above.
epistemic-graph = { path = ".uv-workspace-siblings/epistemic-graph", editable = true }

[dependency-groups]
guardrails = [
    "jsonschema>=4.26.0",
    "owlrl>=7.6.2",
    "pyshacl>=0.40.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "rdflib>=7.6.0",
]
# Build-backend tooling only: `build_backend.py` imports `setuptools` and
# `packaging` at module scope (`wheel` is required transitively — setuptools's
# `bdist_wheel` command is implemented by the `wheel` distribution and
# discovered via its entry points). The release job builds with
# `--no-build-isolation`, which deliberately skips installing
# `[build-system] requires` and instead reuses whatever is already synced —
# so these three MUST be present in the synced environment or the backend
# import fails (`ModuleNotFoundError: setuptools`). Kept as its own group
# (not folded into `guardrails`, which is guardrail-domain tooling and
# unrelated to packaging) and synced ONLY by the `build` job — mirrors
# `[build-system] requires` so the pinned floors stay one source of truth in
# spirit. `[tool.uv.extra-build-dependencies]` was considered and rejected:
# that mechanism only supplements an *isolated* build env and is a no-op
# under `--no-build-isolation`, which this job uses on purpose.
build = [
    "setuptools>=83.0.0",
    "wheel>=0.47.0",
    "packaging>=26.2.0",
]


# Pytest configuration lives in pytest.ini, not here. Both files used to carry
# a [tool.pytest.ini_options]/[pytest] block that silently disagreed (timeout
# 30 vs 300, testpaths tests/unit+tests/integration vs the whole tests/ tree)
# -- pytest's own config-file precedence (pytest.ini > pyproject.toml) means
# pytest.ini always won and this block was dead weight that only misled
# readers. Removed 2026-08-13; see pytest.ini for the effective config.
# (VALIDATION_MODE=true here was also redundant even when live: DEFAULT_
# VALIDATION_MODE in agent_utilities/core/config.py already ORs in
# AGENT_UTILITIES_TESTING, which pytest.ini sets unconditionally.)

[tool.coverage.run]
source = ["agent_utilities"]
omit = ["tests/*", "setup.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
