    # needing no optional package at all — the `ModuleNotFoundError: No module
    # named 'llama_index.embeddings'` dead-lettering failure this extra was
    # originally added to route around is now structurally impossible.
    # `embeddings`/`embeddings-openai` are kept as no-op aliases (an external
    # manifest — vector-mcp — still pins `embeddings-openai`); listed here so
    # that reference keeps resolving, not because it ships anything.
    # Include Logfire so the enabled OTel/Langfuse profile can instrument
    # Pydantic-AI calls in the shipped GraphOS process instead of degrading to a
    # configuration-only warning.
