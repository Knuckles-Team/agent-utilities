]
documents = [
    "llama-index-core>=0.14.23",
    "llama-index-readers-file>=0.6.0",
    # Security floors: transitive via llama-index-*. uv resolves one version
    # graph-wide, so these raise the floor for the whole all-extras lock.
    "banks>=2.4.5",     # CVE-2026-44209 — CRITICAL Jinja2 SSTI RCE
    "nltk>=3.10.0",     # CVE-2026-54293 — path traversal in nltk.data.load (already latest)
    "pypdf>=6.15.0",    # CVE-2026-57204 — stream-length limit bypass;
                        # GHSA-fp3f-mc75-235c + GHSA-fwg2-594c-jp42 — both
                        # first fixed in 6.15.0, so the previous >=6.14.2
                        # floor is itself vulnerable (OSV audit gate).
    # CONCEPT:PHASE2-RECONCILE — relaxed off the modernize-bump's 3.14.2 floor:
