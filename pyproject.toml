agent-groq = [
    "pydantic-ai-slim[groq]==2.29.0"
]
agent-mistral = [
    "pydantic-ai-slim[mistral]==2.29.0"
]
agent-anthropic = [
    "pydantic-ai-slim[anthropic]==2.29.0"
]
agent-huggingface = [
    "pydantic-ai-slim[huggingface]==2.29.0"
