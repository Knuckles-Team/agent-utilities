    # connector package (see the `gateway-widgets` extra above for the full rationale) —
    # without it here, every configured dashboard tile logs
    # `ModuleNotFoundError: No module named '<connector>_mcp'` on every aggregator cache
    # refresh in production.
    "agent-utilities[mcp,feeds,embeddings-openai,neo4j,falkordb,auth,metrics,otel,agent-headless,rdf,logfire,langfuse,messaging-telegram,messaging-mattermost,vault,gateway-widgets]",
