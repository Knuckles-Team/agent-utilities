[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0", "packaging>=26.2.0"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "agent-utilities"
dynamic = ["version"]
description = "GraphOS runtime for governed AI agents, orchestration, and the epistemic-graph knowledge engine"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3"]
requires-python = ">=3.12,<3.15"
license = "MIT"
# CURRENT BASE. RF-ADR-009 fixed AU's role as the agent plane that plans and acts
# BY QUERYING epistemic-graph (EG) — EG is AU's context and inference engine, not
# an optional accelerator. GOC-73 (2026-08) had moved `epistemic-graph[full]` OUT
# of base into the `[graphos]` extra because a hard base dependency on an
# unpublished eg floor (`>=2.27.0`, PyPI's newest was 2.23.0) blocked every
# consumer that imports `agent_utilities` but never touches the engine (e.g.
# agent-webui: 151 `agent_utilities` import sites, zero real `epistemic_graph`
# usage at the time). That trade made the package's OWN declared metadata lie
# about its own code: `agent_utilities/numeric/__init__.py` has always
# unconditionally imported `epistemic_graph.numeric` at module-load time (see the
# module docstring) regardless of which extras were requested, so a "plain"
# `pip install agent-utilities` could never actually import large parts of the
# package it claimed to provide — the AU-RELEASE-BASELINE-20260913 report's cause
# #1, blocking `gates` (Test suite), and `numeric-runtime-gate`. Per RF-ADR-009 §2
# phase 4 (AU depends on the EG client; EG is phase 2, strictly earlier), EG is
# reinstated here as a genuine BASE dependency so the declaration matches the
# code's actual, unconditional requirement instead of contradicting it. The floor
# stays `>=2.27.0,<3.0.0` — the compatibility-matrix release this ecosystem
# workspace requires (see the numeric-kernel rationale that used to live on the
# `graphos` extra, preserved below) — so this repository's OWN
# `scripts/release/check_eg_pypi_resolvable.py` gate (`gates` job step 6) is
# EXPECTED to stay red until epistemic-graph actually publishes that floor to
# PyPI: that is the real, external cross-repo release order (eg must publish
# before au, D11), not a packaging defect to route around. `[graphos]` remains
# below as a no-op compatibility alias (same pattern as `[auth]`) for the fleet
# manifests that already pin `agent-utilities[graphos, ...]`. Optional
# Python application layers such as the agent runtime, document readers, provider
# SDKs, Kafka, ACP, RSS, and mirror backends remain in named extras — those are
# genuinely optional; the engine is not. See "Dependency discipline" in AGENTS.md.
dependencies = [
    # RF-ADR-009: AU contributes its semantic pack through the fleet's one
    # ConnectorContent contract. The SDK is phase 3 and may not depend on AU;
    # AU (phase 4) may depend on the published SDK.
    "agent-connector-sdk>=0.1.0,<1.0.0",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "PyYAML>=6.0.3",
    # CONCEPT:KG-2.324 / CONCEPT:AU-OS.deployment.engine-resolver-auto-provision —
    # RF-ADR-009: epistemic-graph is AU's context and inference engine (not an
    # optional accelerator), so it is a hard base dependency, not an extra. See
    # the base-dependency block comment above for the GOC-73 history and why this
    # supersedes it. The canonical wheel contract builds the whole main CPU
    # feature set (`MATURIN_FEATURES=full,ast-extended` → compute/finance/
    # datascience/mining/graphlearn/reasoning + query/cypher + redb-authoritative
    # durability + security + every wire protocol) and bundles the
    # `epistemic-graph-server` binary (next to `sys.executable`) that graph-os
    # autostarts + supervises over a private UDS socket (EngineResolver, OS-5.63)
    # — no external DB/service. `[full]` is the sole supported engine profile. It
    # includes the compiled `epistemic_graph.numeric` kernel, whose Python
    # boundary accepts built-in sequences and has no NumPy package dependency;
    # agent-utilities imports NumPy nowhere on the runtime path.
    #
    # Floor `>=2.27.0` — never an exact pin. Below 2.26.2 the kernel hands back a
    # numpy ndarray, which agent_utilities/numeric's boundary rejects with a
    # TypeError on every engine init (eg `b7d5825` fixed that, first in 2.26.2).
    # 2.26.2 itself removed the numpy passthrough but did not reimplement the
    # construction surface it had been forwarding (no `zeros`/`eye`/`array`/
    # `concatenate`); eg 2.27.0 (NE-249) is the first release that ships those
    # natively, still with no numpy. See docs/guides/numeric-kernel.md.
    "epistemic-graph[full]>=2.27.0,<3.0.0",
    # Native engine envelopes, analytics jobs, and ingestion batches use msgpack
    # directly on the base GraphOS path.
    "msgpack>=1.2.1",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
    # Security floor: pulled transitively by requests/httpx/anyio; CVE-2026-45409.
    "idna>=3.18",
    # Security floor: pulled transitively by CLI frameworks; PYSEC-2026-2132.
    "click>=8.4.2",
    # Security floor: pulled transitively by document/media features;
    # PYSEC-2026-2253..2257.
    "pillow>=12.3.0",
    # Floor raised to the current major (49.0.0); repo carries no usage of the
    # aliases/modes/ciphers removed in 49 (PUBLIC_KEY_TYPES-style aliases, CFB/OFB/
    # CFB8, Camellia) — verified clean via grep before lifting the old `<49` cap.
    # D-W5AL-1: raised again to 50.0.0 to close GHSA-g6cj-pr64-35w5 / PYSEC-2026-3552
    # (fixed=50.0.0) — the OSV dependency-audit gate fails closed on the unpatched
    # 49.0.0 floor otherwise, and a bare `>=49.0.0` floor lets a future re-lock
    # silently re-select the vulnerable version.
    "cryptography>=50.0.0",
    "pathspec>=1.1.1",
    "platformdirs>=4.11.0",
    "packaging>=26.2.0",
    "psutil>=7.2.2",
    "filelock>=3.32.0",
    # Tiny pure-Python safe-XML parser used on the hydration path; kept in base so the
    # XML path is never unguarded.
    "defusedxml>=0.7.1",
    # Parse external GraphQL documents into a bounded AST.  Connector read-only
    # enforcement must not rely on lexical keyword checks that can be confused by
    # comments, strings, fragments, or multiple operations.
    "graphql-core>=3.2.11,<4",
    # Exact release/certification commands validate their packaged JSON Schema
    # subjects at runtime; this cannot live only in the test guardrail group.
    "jsonschema>=4.26.0",
    # CONCEPT:AU-OS.config.secrets-authentication — JWT bearer verification
    # (security/auth.py `_decode_jwt`, security/request_identity.py) is a base
    # capability of every served profile (non-loopback listeners REQUIRE this
    # boundary), not an opt-in extra. Formerly gated behind `[auth]`, a runtime
    # image that installed agent-utilities without that extra had NO joserfc, so
    # `_decode_jwt`'s ImportError was mis-surfaced as a 401 "Token validation
    # failed" for every caller — a dependency accident masquerading as a
    # rejected credential; see the fixed error-reporting path in
    # `security/auth.py`/`security/request_identity.py`. Promoted to base so
    # enforcement is a pure runtime/config toggle (`AUTH_JWT_JWKS_URI` set or
    # not — see `TestVerifyCredentials` in `tests/unit/core/test_auth.py`),
    # never a packaging accident. Pure-Python (no compiled extension); its only
    # dependency is `cryptography`, already required above — so this adds ~71 KB
    # wheel / ~560 KB installed and zero new transitive packages. Import is
    # lazy (inside `_decode_jwt`), so processes that never verify a JWT pay
    # nothing; the one-time cost when the path IS exercised is ~80ms (pulling
    # additional `cryptography.x509` submodules `import cryptography` alone
    # does not load). `[auth]` is kept below as a no-op alias extra: ~69
    # external fleet manifests still pin `agent-utilities[auth]` and must keep
    # resolving.
    "joserfc>=1.7.4",
    # `knowledge_graph/extraction/pdf.py` (`_pdf_worker`, the single bounded,
    # license-approved PDF text extraction path every reader in this package
    # routes through) does `from pypdf import PdfReader` unconditionally, with
    # no ImportError guard — like joserfc above, a dependency accident that
    # only worked because `pypdf` rode along transitively via
    # `llama-index-readers-file` in the (now removed, D2/nltk) `documents`
    # extra. A plain `pip install agent-utilities` with no extras would raise
    # `ModuleNotFoundError` on the first PDF. Promoted to base so PDF
    # ingestion is never a packaging accident.
    "pypdf>=6.16.1",  # CVE-2026-57204 — stream-length limit bypass;
                       # GHSA-fp3f-mc75-235c + GHSA-fwg2-594c-jp42
]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@example.invalid"

[project.optional-dependencies]
# CONCEPT:KG-2.324 / CONCEPT:AU-OS.deployment.engine-resolver-auto-provision.
# RF-ADR-009 SUPERSEDES GOC-73: `epistemic-graph[full]>=2.27.0,<3.0.0` moved back
# into the base `dependencies` above (see that block's comment for the full
# rationale — the engine is AU's context/inference engine, not an optional
# accelerator, and the package's own code already required it unconditionally).
# `graphos` is kept as a no-op compatibility alias, same pattern as `[auth]`
# below: fleet manifests across the ecosystem already pin
# `agent-utilities[graphos, ...]`, and removing the extra name would break every
# one of them for zero benefit now that the engine ships unconditionally.
graphos = []
# CONCEPT:ORCH-1.38 — RLM sandbox tiers. `monty` is the default fast/isolated tier
# (small pure-Rust wheel, no transitive deps; backend import guarded so absence degrades
# to the local floor); the CPython-WASI/wasm tier needs `wasmtime`. Both kept here so the
# base install stays light — the RLM router degrades to the local floor when neither is present.
sandbox = [
    "wasmtime>=47.0.1",
    "pydantic-monty>=0.0.18,<0.1.0"
]
# CONCEPT:KG-2.121 — native RSS/Atom feed connector (robust feed parsing). Pulled by
# `serving` (ingestion) and lazily imported by the connector; absent from the lean core.
feeds = [
    "feedparser>=6.0.12"
]
kafka = [
    "aiokafka>=0.14.0"
]
# CONCEPT:AU-KG.search.opensearch-cdc-indexer (CA-24, DEC-CA-09) — the search-tier
# client. Optional so the base install stays light; `knowledge_graph/search/client.py`
# import-guards it (mirrors `kafka_adapter.py`'s aiokafka optionality) — absent, only
# constructing a LIVE connection fails, not the module import or the unit-test suite
# (which runs against an injected fixture/mock client).
opensearch = [
    "opensearch-py>=2.6.0"
]
# CONCEPT:OS-5.23 — Python-tier gateway Prometheus metrics. Optional so the
# base install stays light; without it every gateway metric degrades to a
# no-op and GET /metrics returns a placeholder.
metrics = [
    "prometheus-client>=0.25.0"
]
# CONCEPT:AU-OS.observability.telemetry-observability (OBS-P1-2/X2) — standalone OTLP
# trace export. `TelemetryEngine._setup_otel()` (observability/__init__.py) and the
# engine-RPC span in `knowledge_graph/core/graph_compute.py` import-guard these two
# packages, so the base install/`[mcp]`/`[serving]` stay unaffected without this extra.
# `[logfire]` already carries `opentelemetry-sdk` + this same OTLP/HTTP exporter
# transitively (for the Logfire+pydantic-ai-instrumentation pipeline in
# `custom_observability.py`) — this extra is for a deployment that wants ONLY the
# standard OTel SDK + OTLP/HTTP exporter (e.g. a plain k8s Tempo/Alloy collector)
# without pulling Logfire's heavier dependency chain.
otel = [
    "opentelemetry-sdk>=1.30.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0,<2",
]
nats = [
    "nats-py>=2.15.0"
]
# CONCEPT:AU-KG.query.knowledge-stream-consumer — decode the engine's bounded Arrow-IPC
# `KnowledgeBatch` stream (`Method::KnowledgeStream`) into `pyarrow.RecordBatch`
# pages. Optional so the base install stays light: `knowledge_stream._pyarrow()`
# import-guards it and BOTH `KnowledgeGraph.query_batches` / `stream_epistemic_by_label`
# degrade to `None` when it (or the engine's `.knowledge` surface) is absent — a caller
# falls back to a non-columnar read. pyarrow >= 17 needs no numpy and no ML/CUDA wheel,
# so it is dependency-discipline safe on the serving plane.
pyarrow = [
    "pyarrow>=17.0.0"
]
# NE-114 — operator-only data-quality certification.  These extras are mutually
# optional and intentionally do not enter the serving/agent hot path.  The job
# imports the selected provider only when executed; the Arrow currency remains
# the existing pyarrow extra and the Rust engine remains the SHACL/ICV authority.
data-quality-ge = [
    "pyarrow>=17.0.0",
    "great-expectations>=1.3.0,<2",
]
data-quality-pandera = [
    "pyarrow>=17.0.0",
    "pandera>=0.26.0,<1",
]
mcp = [
    # fastmcp 4 is the default (CONCEPT:AU-ECO.mcp.protocol-compat-bridge). Empirically
    # verified (see agent_utilities/mcp/protocol_compat.py + docs/architecture/fastmcp4-default.md):
    # `pydantic_ai.mcp` (pydantic-ai-slim 2.29.0, the supported release) natively
    # handles both MCP SDK field spellings and modern FastMCP sessions. The exact
    # Pydantic-AI pin below is intentional: protocol_compat.py verifies this
    # contract and refuses an unverified runtime version; it no longer monkeypatches
    # upstream MCPToolset methods or installs process-global aliases.
    "fastmcp>=4.0.0b1",
    # Schema-only dependency. The native middleware avoids eunomia-mcp's
    # unpatched python-jose/ecdsa transitive chain and unsafe HTTP defaults.
    "eunomia-core>=0.3.10",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    # Security floors: pulled transitively by mcp/fastmcp/fastapi.
    "pyjwt>=2.13.0",            # CVE-2026-48522..48526 (PyJWKClient SSRF/DoS/bypass)
    "starlette>=1.3.1",        # CVE-2026-54283 (form() limits ignored)
    "python-multipart>=0.0.32", # CVE-2026-42561/53537-53540 (DoS / param smuggling)
    # Default LLM connector for graph-os: the OpenAI-compatible model client. Local
    # LLMs (vLLM/llama.cpp/Ollama) all speak the OpenAI API, so `openai` is the ONE
    # provider graph-os ships by default (`graph_orchestrate` drives the local model
    # through it). Other providers are opt-in add-ons — `[agent-anthropic]`,
    # `[agent-google]`, `[agent-groq]`, `[agent-mistral]`, `[agent-huggingface]`.
    # `pydantic-ai-slim[openai]` is the lean provider extra (httpx + openai SDK, no
    # torch) — dependency-discipline safe on the serving plane.
    "pydantic-ai-slim[openai]==2.29.0"
]
agent-runtime = [
    "agent-utilities[mcp,ag-ui,terminal,sandbox]>=1.0.0",
    "universal-skills>=1.3.1",
    "skill-graphs>=1.1.0",
    "pydantic-ai-skills>=1.2.0",
    # openai is the default bundled provider (local LLMs use the OpenAI API); other
    # providers are opt-in add-ons (`[agent-anthropic]`, `[agent-google]`, …).
    "pydantic-ai-slim[mcp,openai,ag-ui,ui,web,cli]==2.29.0",
    "pydantic-graph==2.29.0",
    "fasta2a[pydantic-ai]>=0.6.1",
    # CONCEPT:AU-OS.safety.harness-guardrails-adoption — bare harness (no extras): its
    # own metadata requires only httpx + pydantic-ai-slim (both already required above),
    # so it rides along wherever an agent can be built. Provides InputGuardrail/
    # OutputGuardrail, the live replacement for the dead PolicyEngine (D-48), wired
    # default-on via capabilities/content_guardrails.py. NOT `[dynamic-workflow]`/`[acp]`
    # — those extras' heavier deps (pydantic-monty, agent-client-protocol) stay opt-in.
    "pydantic-ai-harness>=0.14.0,<0.15.0",
]
# Server-side agent runtime WITHOUT the frontend component libraries. `agent-runtime`
# pulls `ag-ui` (agent-webui) + `terminal` (agent-terminal-ui), which a serving
# process never renders — and agent-webui depends on the FULL `pydantic-ai`
# meta-package, dragging temporalio/botocore/google-genai/grpc/mistralai onto the
# serving image (~140 MB). `agent-headless` is the same skill/runtime stack the
# agent actually needs at serve time, minus those two frontend libs. Used by
# `[serving]`. See AGENTS.md "Dependency discipline".
agent-headless = [
    "agent-utilities[mcp,sandbox]>=1.0.0",
    "universal-skills>=1.3.1",
    "skill-graphs>=1.1.0",
    "pydantic-ai-skills>=1.2.0",
    # openai is the default bundled provider (local LLMs use the OpenAI API); other
    # providers are opt-in add-ons (`[agent-anthropic]`, `[agent-google]`, …).
    "pydantic-ai-slim[mcp,openai,web,cli]==2.29.0",
    "pydantic-graph==2.29.0",
    "fasta2a[pydantic-ai]>=0.6.1",
    # See agent-runtime above: bare harness for InputGuardrail/OutputGuardrail
    # (CONCEPT:AU-OS.safety.harness-guardrails-adoption), the serving-plane path.
    "pydantic-ai-harness>=0.14.0,<0.15.0",
]
agent-google = [
    "pydantic-ai-slim[google]==2.29.0"
]
agent-groq = [
    "pydantic-ai-slim[groq]==2.29.0"
]
agent-mistral = [
    "pydantic-ai-slim[mistral]==2.29.0"
]
agent-anthropic = [
    "pydantic-ai-slim[anthropic]==2.29.0"
]
agent-huggingface = [
    "pydantic-ai-slim[huggingface]==2.29.0"
]
dynamic-workflow = [
    # Optional only: the governed adapter remains on GraphPlan/ParallelEngine and
    # never grants the upstream sandbox a second GraphOS execution plane.
    "pydantic-ai-harness[dynamic-workflow]>=0.14.0,<0.15.0",
]
ag-ui = [
    # 1.1.0's server.py called `Agent.to_web(builtin_tools=...)`; pydantic-ai's
    # `to_web()` dropped that kwarg in favor of `capabilities=[NativeTool(...)]`
    # on the Agent constructor, so 1.1.0 raised
    # `TypeError: Agent.to_web() got an unexpected keyword argument 'builtin_tools'`
    # against any current pydantic-ai. Fixed upstream in agent-webui 2.4.0.
    "agent-webui>=2.4.0"]
terminal = [
    "agent-terminal-ui>=1.0.0"]
browser = [
    "playwright>=1.61.0"]
# CONCEPT:ECO-4.93 — GUI computer-use over a gui-sandbox container. Reuses
# container-manager-mcp's manager abstraction (which transitively brings the
# docker[ssh] + tunnel-manager deps), so the actuator never re-implements
# exec-over-ssh. Imported lazily by the driver; absent from lean core.
computer-use = [
    "container-manager-mcp>=2.3.0"]
# Gateway Service Dashboard widgets (agent_utilities/gateway/widgets/*.py,
# CONCEPT:AU-OS.config.gateway-service-dashboard) each do an IN-PROCESS import of
# their connector package's API client (e.g. `caddy.py`: `from caddy_mcp.api_client
# import Api as CaddyApi`) rather than calling out over the network, so the
# connector packages themselves must be installed wherever the dashboard runs.
# None of these are declared as base dependencies (Configuration discipline: no
# widget's connector is needed unless that specific service tile is configured),
# so without this extra every configured widget logs
# `ModuleNotFoundError: No module named '<connector>_mcp'` on every aggregator
# cache-refresh cycle (`WidgetAggregator._cache_ttl`, gateway/aggregator.py) —
# this extra is what makes the dashboard's connector imports actually resolve.
# Floors are each connector's newest version actually PUBLISHED on PyPI today
# (verified via the PyPI JSON API, not the ecosystem checkout under
# agent-packages/agents/<name>, which for most of these has since moved ahead —
# e.g. locally caddy-mcp is 2.1.0 but PyPI tops out at 1.0.1). A floor above what
# is published would make this extra UNRESOLVABLE from PyPI (uv proved this: pinning
# to the local container-manager-mcp version, 3.1.0, when only <=2.3.0 is published,
# hard-fails `uv sync`/`pip install` — see the worked example in the fix's PR/commit
# notes). Spot-checked (caddy/jellyfin/mattermost/openbao/technitium/twenty/mealie)
# that the published floor version's `<pkg>.api_client` already exports the same
# `Api` facade class the widgets now import — see the `Api as <Name>` alias fix in
# the widget files below. None of the 33 pull torch/transformers/sentence-
# transformers/CUDA (verified against each package's own `dependencies`), so this
# stays dependency-discipline safe on the serving plane.
#
# NOT included: `ear_agent`, `sentry_mcp`, `zulip_agent` — the `ear.py`/`sentry.py`/
# `zulip.py` widgets import these, but no such distribution exists locally or on
# PyPI. `ear.py` already guards its import
# (`except ImportError: return WidgetData(status="skipped", ...)`); `sentry.py` and
# `zulip.py` do not and will keep flooding logs until those connectors are published.
#
# `container_manager.py`, `arr.py`, `tunnel_manager.py`,
# `atlassian.py`, `repository_manager.py` and `media_downloader.py` used to import a
# `<pkg>.api_client` submodule those packages never shipped at any version — a second,
# deeper bug a dependency declaration alone could not fix. That has since been fixed
# separately (`fix(gateway): point 9 dashboard widgets at their real connector
# clients`): each now imports its package's ACTUAL public entry point
# (`container_manager_mcp.create_manager`, `arr_mcp.api.api_client_sonarr`,
# `tunnel_manager.HostManager`,
# `atlassian_agent.api.api_client_jira_cloud`, `repository_manager.repository_manager`,
# `media_downloader.api_client`), so declaring their distributions here does make them
# work rather than merely moving the ModuleNotFoundError one level deeper.
#
# `vector-mcp` is deliberately NOT declared here (nor is it a dependency
# anywhere in this project): it is a workspace phase-7 connector, and
# agent-utilities is phase 4 -- RF-ADR-009 forbids a lower phase depending on
# a higher one. `vector_db.py`'s widget reaches it over its MCP server
# (the same fleet transport every `mcp_tool` source connector uses,
# `protocols/source_connectors/connectors/mcp_tool.call_tool_once`), never a
# package import. This is also what let nltk (GHSA-8mgp-746c-j5xp, no
# patched release) leave `uv.lock` for good -- vector-mcp's own published
# metadata has an unconditional `llama-index-core` dependency with no way to
# exclude it, and it was the sole remaining source once D2 removed AU's own
# llama-index use.
#
# `portainer-agent` IS declared below, but its newest PUBLISHED version (1.1.0) imports
# `agent_utilities.http`, a module this package renamed to `agent_utilities.httpsupport`;
# the local sibling checkout (2.1.0) already carries the fix but is unpublished. The
# widget degrades safely through `BaseWidget._safe_fetch` meanwhile, and the floor
# (`>=1.1.0`) picks the fix up automatically once 2.1.0 reaches PyPI. Asserted in
# `tests/unit/gateway/test_gateway_widgets_extra.py::KNOWN_BROKEN` so the note cannot
# outlive the defect.
gateway-widgets = [
    "ansible-tower-mcp>=2.0.1",
    "arr-mcp>=2.1.0",
    "atlassian-agent>=1.1.0",
    "caddy-mcp>=1.0.1",
    "container-manager-mcp>=2.3.0",
    "documentdb-mcp>=1.0.1",
    "erpnext-agent>=1.0.1",
    "github-agent>=1.4.2",
    "gitlab-api>=26.4.0",
    "home-assistant-agent>=1.0.2",
    "jellyfin-mcp>=1.0.1",
    "keycloak-agent>=1.0.1",
    "langfuse-agent>=1.0.1",
    "listmonk-api>=1.0.1",
    "mattermost-mcp>=1.0.1",
    "mealie-mcp>=0.3.0",
    "media-downloader>=3.0.1",
    "microsoft-agent>=1.0.1",
    "nextcloud-agent>=1.0.1",
    "openbao-mcp>=1.0.1",
    "owncast-agent>=1.0.1",
    "plane-agent>=1.1.0",
    "portainer-agent>=1.1.0",
    "postiz-agent>=1.0.1",
    "qbittorrent-agent>=1.0.1",
    "repository-manager>=2.0.1",
    "servicenow-api>=2.0.1",
    "technitium-dns-mcp>=1.0.1",
    "tunnel-manager>=2.1.0",
    "twenty-mcp>=1.0.1",
    "uptime-kuma-agent>=1.0.1",
    "wger-agent>=1.0.1",
]
acp = [
    "pydantic-ai-harness[acp]>=0.14.0,<0.15.0",
]
