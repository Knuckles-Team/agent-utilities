# No-op alias, kept for external compatibility only. `joserfc` moved into the
# base `dependencies` above (JWT verification is now always installed;
# enforcement is a runtime/config toggle, not a packaging accident — see the
# comment on the base `joserfc` entry). ~69 external fleet manifests still
# pin `agent-utilities[auth]`; removing the extra name would break every one
# of them for zero benefit, so `agent-utilities[auth]` keeps resolving as a
# deliberate no-op rather than an error.
auth = []
serving = [
    # The serving plane (graph-os MCP, host daemon, messaging): NO heavy ML/native deps.
    # Heavy compute is remote (vLLM) or in the Rust engine; torch/transformers/AVX-ann are
    # excluded on purpose (they SIGILL on old CPUs + bloat the image). See AGENTS.md dep rule.
    #
    # Deliberately EXCLUDED from the serving plane (kept in the host-daemon / domain images):
    #   - finance: scipy + pandas + statsmodels (~360 MB). The only serving consumer was the
    #     `quant` MCP tool's boot-time registration; that registration is now guarded
    #     (mcp/tools/ontology_tools.py) so kg_server boots cleanly without it.
    #   - agent-runtime (→ ag-ui/terminal): agent-webui + agent-terminal-ui are FRONTEND component
    #     libs a server never renders, and agent-webui pulls the full pydantic-ai meta
    #     (temporalio/botocore/google-genai/grpc/mistralai, ~140 MB). Replaced by the
    #     `agent-headless` extra (same skill/runtime stack, no frontends).
    #   - documents: document readers are ingestion-only; the MCP query/serving
    #     surface never parses PDFs. PDF extraction uses the bounded pypdf path.
    #
    #   - graph (ladybug): a contrib MIRROR backend only (primary store is engine + postgres);
    #     it is opt-in via `[graph]`, never shipped on the serving default. neo4j/falkordb stay
    #     because they remain actively-selectable mirrors; ladybug does not.
    #
    # GOC-73: `epistemic-graph[full]` is no longer a hard BASE dependency (see the
    # `graphos` extra above), but the serving plane (graph-os MCP / host daemon) is
    # THE engine consumer, so `serving` pulls `graphos` explicitly here — an existing
    # `pip install agent-utilities[serving]` still gets the engine unchanged. `feeds`
    # remains an optional serving dependency for RSS ingestion. Code parsing is
    # delegated to the engine's native tree-sitter — no Python tree-sitter is added
    # to the serving plane.
    #
    # Full external OWL-DL reasoning (owlready2, the `owl` extra) stays excluded: GraphOS
    # delegates classification to the engine's native RDF/SPARQL/OWL surface. The narrower
    # ``ontology-guardrails`` extra (owlrl + pyshacl, no owlready2) IS shipped here
    # (CONCEPT:AU-KG.ontology.activation-icv-fallback): the hosted-ontology lifecycle's
    # validate/activate gate needs an OWL-RL closure + SHACL check to run at serve time —
    # without it, `graph_ontology action=activate` degraded to reporting
    # ``ImportError: owlrl not installed`` as a soft warning instead of actually gating
    # activation, so a candidate that would break reasoning could still be marked active.
    # The light ``rdf`` extra is unrelated: workflow and ontology ingestion need rdflib
    # parsing at runtime regardless of whether the guardrail reasoners are present.
    # CONCEPT:KG-2.3 — the serving/host plane RUNS ingestion + enrichment, so it needs the
    # CANONICAL embedder, not the bare `embeddings` core. `embeddings` pulls only
    # `llama-index-core` (no provider), so `create_embedding_model()` / `make_embed_fn()`
    # (which import `llama_index.embeddings.openai` to talk to the bge-m3 vLLM endpoint) raise
    # `ModuleNotFoundError: No module named 'llama_index.embeddings'` on the host — dead-lettering
    # every document ingest and producing ZERO embeddings fleet-wide. `embeddings-openai` ships the
    # OpenAI-compatible provider (+ llms-openai) the vLLM embedding plane requires. See AGENTS.md.
    # Include Logfire so the enabled OTel/Langfuse profile can instrument
    # Pydantic-AI calls in the shipped GraphOS process instead of degrading to a
    # configuration-only warning.
    # messaging platforms: the serving plane runs the always-on messaging co-service; the
    # deployed platforms (Telegram + Mattermost) ship their drivers here so a served graph-os
    # can connect them without an ad-hoc install. Add a platform's extra here when it is wired.
    # D-OG-1: `otel` is now explicit, not merely transitive through `logfire`. The
    # OTLP trace pipeline (TelemetryEngine._setup_otel / custom_observability.setup_otel)
    # directly imports opentelemetry-sdk + opentelemetry-exporter-otlp-proto-http, and
    # relying on a sibling extra's dependency tree to happen to provide them is a latent
    # break the moment Logfire drops the OTLP/HTTP exporter or `serving` ships without
    # `logfire`. This is a metadata-only change (the resolved versions are unchanged —
    # both packages already satisfy `otel`'s `>=1.30.0,<2` range via `logfire`).
    # vault: CONCEPT:AU-KG.ontology.release-key-rotation (D-DP-2/D-OC-*) — release signing now
    # REQUIRES versioned secret custody (`vault://`/`secret://`; see
    # `release_signer_for_publication` and `SecretsClient.resolve_ref`'s `@<version>` KV v2 pin).
    # `hvac` is the only client that satisfies that on the serving plane, and it is a small
    # pure-Python HTTP client (no ML/native weight), so it belongs in `serving`, not a bespoke
    # second OpenBao client.
    "agent-utilities[graphos,mcp,feeds,embeddings-openai,neo4j,falkordb,auth,metrics,otel,agent-headless,rdf,logfire,langfuse,messaging-telegram,messaging-mattermost,vault,ontology-guardrails]",
]
