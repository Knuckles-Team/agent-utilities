# D-OB-18 — rebuild the unified graph-os image with the workspace dependency override
# applied, so the runtime finally ships the fastmcp 4 / mcp 2 stack its own source
# targets. Same Dockerfile as every other variant; what changes is that the build now
# resolves through `overrides.txt` (the build-side mirror of the workspace root's
# `[tool.uv] override-dependencies`) instead of a hand-copied `fastmcp==3.4.5` literal.
#
# D-PCC-1: templated via envsubst -- the tracked file carries zero host-specific strings;
# see docker/kaniko-build.env.example.
#
#   export KANIKO_BUILD_NODE=<node hostname>
#   export WORKSPACE_HOSTPATH=<this lane's au worktree path on that node>
#   export EG_WHEEL_HOSTPATH=<the staged eg wheel's path on that node>
#   export LANGFUSE_AGENT_HOSTPATH=<the langfuse-agent sibling checkout's path on that node>
#   envsubst < docker/graphos-unified-fastmcp4-kaniko-job.yaml | kubectl apply -f -
#   kubectl logs -n image-build -f job/graphos-unified-fastmcp4-image-build
#
# The context is THIS LANE'S worktree rather than the main checkout, because the
# Dockerfile + overrides.txt changes live on `fix/image-fastmcp4` and merging is the
# orchestrator's call, not this lane's. Point WORKSPACE_HOSTPATH at the canonical au
# checkout once the branch lands — the two trees are otherwise identical.
#
# Caching stays ON (as in every sibling job) and is SAFE for this particular change:
# kaniko's composite cache key for a RUN layer covers the command string plus every
# preceding layer, including the content hash of copied context files. `overrides.txt` is
# both new-in-position and changed-in-content immediately before the install, and the
# `uv pip install` command line itself changed, so the dependency-resolving layer cannot
# hit a warm entry and replay the old fastmcp-3 closure. The earlier apt/uv/eg-wheel
# layers are genuinely unchanged and are exactly what we want served from cache.
#
# ⚠ `--cache=false` was tried first, on the reasoning that correctness beats build time.
# It does not work here: kaniko wedges in uninterruptible disk sleep during the initial
# "Taking snapshot of full filesystem" pass and makes no progress (observed 25+ minutes at
# 0m CPU, State: D, on an otherwise healthy node). Do not "harden" this back to
# `--cache=false` — it does not build.
apiVersion: batch/v1
kind: Job
metadata:
  name: graphos-unified-fastmcp4-image-build
  namespace: image-build
  labels:
    app: graphos-unified-fastmcp4-image-build
    purpose: graphos-fastmcp4
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: graphos-unified-fastmcp4-image-build
        purpose: graphos-fastmcp4
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: ${KANIKO_BUILD_NODE}
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --context=dir:///workspace
            - --dockerfile=/workspace/docker/graphos-unified.Dockerfile
            - --destination=knucklessg1/graph-os-unified:fastmcp4
            - --cache=true
            - --cache-repo=knucklessg1/graph-os-unified-cache
            - --verbosity=info
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 24Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: eg-wheel
              mountPath: /workspace/build-artifacts/eg-wheel
            - name: langfuse-agent-src
              mountPath: /workspace/build-artifacts/langfuse-agent-src
            - name: docker-config
              mountPath: /kaniko/.docker/config.json
              subPath: config.json
      volumes:
        - name: workspace
          hostPath:
            path: ${WORKSPACE_HOSTPATH}
            type: Directory
        - name: eg-wheel
          hostPath:
            path: ${EG_WHEEL_HOSTPATH}
            type: Directory
        - name: langfuse-agent-src
          hostPath:
            path: ${LANGFUSE_AGENT_HOSTPATH}
            type: Directory
        - name: docker-config
          secret:
            secretName: kaniko-dockerhub-config
            items:
              - key: config.json
                path: config.json
