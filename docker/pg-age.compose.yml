# pg-age on Apache AGE (+ pgvector) — real openCypher-on-Postgres.
#
# CONCEPT:KG-2.7 — durable graph tier with native Cypher. Replaces the
# regex-transpiler path (paradedb) with AGE's `cypher()` execution.
#
# Usage:
#   docker compose -f docker/pg-age.compose.yml up -d --build
#
# Environment for agent-utilities:
#   GRAPH_BACKEND=postgresql
#   GRAPH_PG_AGE=1
#   GRAPH_DB_URI is injected from the deployment secret provider.

services:
  pg-age:
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${DATA_SERVICE_MEMORY_LIMIT:-4g}
    cpus: ${DATA_SERVICE_CPU_LIMIT:-2.0}
    build:
      context: ./pg-age
    image: agent-utilities/pg-age:local
    container_name: agent-pg-age
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD from a secret}"
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pg-age-data:/var/lib/postgresql/data
      - ./pg-age-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U '$${POSTGRES_USER}' -d '$${POSTGRES_DB}'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pg-age-data:
