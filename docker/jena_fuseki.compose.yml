# Apache Jena Fuseki — SPARQL 1.1 server for agent-utilities
#
# CONCEPT:KG-2.7 / KG-2.52 — Optional SPARQL/RDF tier. Backs the JenaFusekiBackend
# and the ontology publish daemon tick (KG_FUSEKI_PUBLISH), both resolved through
# the ONE canonical endpoint field: KG_FUSEKI_ENDPOINT (config.kg_fuseki_endpoint).
#
# This is for manual/enterprise use; the live test suite stands Fuseki up on a
# random port via testcontainers (tests/integration/conftest.py::ephemeral_fuseki),
# so it never collides with this fixed-port instance. In the real k8s deployment,
# KG_FUSEKI_ENDPOINT defaults to the in-cluster Service DNS
# (the runtime service-discovery URL) instead of this compose instance.
#
# Usage:
#   docker compose -f docker/jena_fuseki.compose.yml up -d
#
# Environment:
#   KG_FUSEKI_ENDPOINT=http://localhost:3030
#   GRAPH_FUSEKI_DATASET=agent_kg
#   GRAPH_FUSEKI_USER=admin
#   GRAPH_FUSEKI_PASSWORD is supplied by the deployment secret provider.

services:
  fuseki:
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${DATA_SERVICE_MEMORY_LIMIT:-4g}
    cpus: ${DATA_SERVICE_CPU_LIMIT:-2.0}
    image: ${JENA_FUSEKI_IMAGE:?set-JENA_FUSEKI_IMAGE-to-image@sha256-digest}
    container_name: agent-fuseki
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?set FUSEKI_ADMIN_PASSWORD}
      # Persist a TDB2 dataset named agent_kg across restarts.
      FUSEKI_DATASET_1: agent_kg
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - fuseki-data:/fuseki
    restart: unless-stopped

volumes:
  fuseki-data:
