# ParadeDB (pgvector + pg_search) PostgreSQL Stack
# Provides a graph-enabled PostgreSQL instance for the agent-utilities KG backend.
#
# Usage:
#   docker compose -f docker/paradedb.compose.yml up -d
#
# Environment:
#   GRAPH_BACKEND=postgresql
#   GRAPH_DB_URI is injected from the deployment secret provider.

services:
  paradedb-db:
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${DATA_SERVICE_MEMORY_LIMIT:-4g}
    cpus: ${DATA_SERVICE_CPU_LIMIT:-2.0}
    image: ${PARADEDB_IMAGE:?set-PARADEDB_IMAGE-to-image@sha256-digest}
    container_name: agent-paradedb
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD from a secret}"
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - paradedb-data:/var/lib/postgresql
      - ./paradedb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U '$${POSTGRES_USER}' -d '$${POSTGRES_DB}'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  paradedb-data:
