# W-C — builds docker/graphos-unified.Dockerfile via kaniko (no dockerd on the hosts;
# Docker is sunset cluster-wide) and pushes to Docker Hub. Run once, ad hoc.
#
# D-PCC-1: this manifest is node-pinned by construction (a kaniko build context is a
# literal hostPath, and kubectl does no env substitution), which used to mean every
# host-specific value -- including a personal account path -- was baked in as a tracked
# literal. Templated via envsubst instead, so the tracked file carries zero host-specific
# strings; see docker/kaniko-build.env.example for what each variable means and a safe
# placeholder value.
#
#   export KANIKO_BUILD_NODE=<node hostname>              # e.g. the NFS server this workspace lives on
#   export WORKSPACE_HOSTPATH=<this au worktree's path on that node>
#   export EG_WHEEL_HOSTPATH=<the staged eg wheel's path on that node>
#   envsubst < docker/graphos-unified-kaniko-job.yaml | kubectl apply -f -
#   kubectl logs -n image-build -f job/graphos-unified-image-build
#
# Prereqs this manifest assumes are already in place (not created by this file):
#   1. The au worktree checked out at WORKSPACE_HOSTPATH (git worktree add ... <name>),
#      materialized under the shared `apps` build account, NOT a personal account (D-PCC-1: GitHub
#      is public-facing, so tracked manifests must never leak a personal account name).
#   2. A Secret `kaniko-dockerhub-config` in the `image-build` namespace holding a standard
#      docker config.json (auths for index.docker.io) — e.g.:
#        kubectl create secret generic kaniko-dockerhub-config \
#          --from-file=config.json=$HOME/.docker/config.json -n image-build
#      (this repo's existing `knucklessg1/*` fleet images are all Docker Hub, so pushing a
#      NEW knucklessg1/graph-os-unified repo needs the same docker.io credentials already
#      used to push those — reused here rather than fabricated.)
#
# Context composition: kaniko takes exactly ONE --context directory. The build needs BOTH
# the au worktree (the Dockerfile + source) AND the staged eg wheel (which lives at
# EG_WHEEL_HOSTPATH on this same node, outside the worktree). Rather than copying the
# 77MB wheel into the worktree (git-tracked bloat) or hardlinking it, this Job mounts the
# eg-wheel hostPath AT a path *inside* the workspace mount (build-artifacts/eg-wheel/) — a
# pod-local mount composition, not a change to either directory on disk. This path is at
# the context ROOT, not under docker/ — this repo's .dockerignore excludes `docker/*`
# wholesale, which would silently drop anything staged there from the build context (hit
# this the hard way on the first attempt: kaniko logged "No files to copy" and the
# subsequent `uv pip install` failed with "Distribution not found"). Both hostPaths must be
# on the SAME node as KANIKO_BUILD_NODE, hence the nodeSelector.
apiVersion: batch/v1
kind: Job
metadata:
  name: graphos-unified-image-build
  namespace: image-build
  labels: {app: graphos-unified-image-build, workstream: w-c}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app: graphos-unified-image-build, workstream: w-c}
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: ${KANIKO_BUILD_NODE}
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --context=dir:///workspace
            - --dockerfile=/workspace/docker/graphos-unified.Dockerfile
            - --destination=knucklessg1/graph-os-unified:latest
            - --destination=knucklessg1/graph-os-unified:w-c-validation
            - --cache=true
            - --cache-repo=knucklessg1/graph-os-unified-cache
            - --verbosity=info
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "4Gi"}
            limits: {cpu: "4", memory: "6Gi", ephemeral-storage: "16Gi"}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: eg-wheel, mountPath: /workspace/build-artifacts/eg-wheel}
            - {name: docker-config, mountPath: /kaniko/.docker/config.json, subPath: config.json}
      volumes:
        - name: workspace
          hostPath:
            path: ${WORKSPACE_HOSTPATH}
            type: Directory
        - name: eg-wheel
          hostPath:
            path: ${EG_WHEEL_HOSTPATH}
            type: Directory
        - name: docker-config
          secret:
            secretName: kaniko-dockerhub-config
            items:
              - {key: config.json, path: config.json}
