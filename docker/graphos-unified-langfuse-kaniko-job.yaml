# W-C follow-up — builds docker/graphos-unified.Dockerfile (langfuse-agent restored, see
# its header/step-2b comments) via kaniko and pushes a NEW validation tag. This is a
# SIBLING of docker/graphos-unified-kaniko-job.yaml, not a replacement for it: that job
# still builds/pushes the original `:latest` / `:w-c-validation` tags; this one is scoped
# to validating the langfuse-agent restoration alone, on its own tag
# (`knucklessg1/graph-os-unified:langfuse`), so it can never race or clobber those.
#
#   kubectl apply -f docker/graphos-unified-langfuse-kaniko-job.yaml
#   kubectl logs -n image-build -f job/graphos-unified-langfuse-image-build
#
# Prereqs (same as the original job — not created by this file):
#   1. The au worktree checked out at the hostPath below (this follow-ups worktree),
#      materialized under the shared `apps` build account, NOT a personal account (D-PCC-1: GitHub
#      is public-facing, so tracked manifests must never leak a personal account name).
#   2. Secret `kaniko-dockerhub-config` in the `image-build` namespace (already exists —
#      reused here unchanged, same as the original job).
#
# Context composition: identical trick to the original job, TWICE over. kaniko takes
# exactly ONE --context directory, but this build needs the au worktree (Dockerfile +
# source) AND two artifacts that live outside it on this same node (rw710): the staged eg
# wheel (unchanged from the original job) AND, new here, the langfuse-agent SIBLING repo
# (agent-packages/agents/langfuse-agent) that step 2b of the Dockerfile now installs from.
# Both are mounted at paths *inside* the workspace mount (build-artifacts/eg-wheel/ and
# build-artifacts/langfuse-agent-src/) — a pod-local mount composition, not a change to any
# of the three directories on disk. All three hostPaths are on rw710, hence the
# nodeSelector (same reasoning as the original job).
apiVersion: batch/v1
kind: Job
metadata:
  name: graphos-unified-langfuse-image-build
  namespace: image-build
  labels: {app: graphos-unified-langfuse-image-build, workstream: w-c, followup: langfuse-agent}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app: graphos-unified-langfuse-image-build, workstream: w-c, followup: langfuse-agent}
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: rw710
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --context=dir:///workspace
            - --dockerfile=/workspace/docker/graphos-unified.Dockerfile
            - --destination=knucklessg1/graph-os-unified:langfuse
            - --cache=true
            - --cache-repo=knucklessg1/graph-os-unified-cache
            - --verbosity=info
          resources:
            requests: {cpu: "1", memory: "2Gi", ephemeral-storage: "4Gi"}
            limits: {cpu: "4", memory: "6Gi", ephemeral-storage: "16Gi"}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: eg-wheel, mountPath: /workspace/build-artifacts/eg-wheel}
            - {name: langfuse-agent-src, mountPath: /workspace/build-artifacts/langfuse-agent-src}
            - {name: docker-config, mountPath: /kaniko/.docker/config.json, subPath: config.json}
      volumes:
        - name: workspace
          hostPath:
            path: /home/apps/worktrees/au-followups
            type: Directory
        - name: eg-wheel
          hostPath:
            path: /home/apps/eg-wheel
            type: Directory
        - name: langfuse-agent-src
          hostPath:
            path: /home/apps/workspace/agent-packages/agents/langfuse-agent
            type: Directory
        - name: docker-config
          secret:
            secretName: kaniko-dockerhub-config
            items:
              - {key: config.json, path: config.json}
