# lane-engine-image-0801 — rebuild the unified graph-os image with an engine binary that
# carries three eg fixes. Same Dockerfile as every sibling variant; the ONLY thing that
# changes is which epistemic-graph wheel is staged into build-artifacts/eg-wheel.
#
#   kubectl apply -f docker/graphos-unified-engine-fix-0801-kaniko-job.yaml
#   kubectl logs -n image-build -f job/graphos-unified-engine-fix-0801-image-build
#
# What is in the engine binary (eg main @ the merge landed by this lane):
#   * D-INC-1 / D-SH-5 / D-ML-5 — RenewWorkItemLease's "missing" and "fenced" result
#     shapes omitted `changed_work_item_ids`, so commit_work_item bailed AFTER the durable
#     commit and core.mark_dirty() never ran. The serving projection was left one version
#     behind the authority and the graph went permanently READ-ONLY. This is the fix that
#     un-bricks live writes.
#   * D-OP-1 / D-OB-20 — GraphReadAuthority::project_core materialized a full second
#     GraphCore on every RLS-active read (~103 MB memcpy at 25k nodes). Now cached per
#     (actor, GraphCore::version()): measured 1.506s -> 7.57us per call.
#   * D-EIMG-2 — new epistemic_graph_dispatch_lock_wait_seconds{mode} histogram on the
#     process-wide ServerState lock, so the engine's latency tail can finally be
#     attributed to contention or exonerated.
#
# ── Why the wheel, not the binary ──
# The engine is NOT scp'd anywhere and is NOT mounted in. It ships INSIDE this image: the
# maturin `bindings="bin"` epistemic-graph wheel drops `epistemic-graph-server` into
# /usr/local/bin (wheel `data/scripts`), and the live Deployment's `engine` initContainer
# execs exactly that path with no volume mounted over it. So "deploy the engine" ==
# "rebuild this image and roll it out". See the lane report for the full step list
# (D-IMG-2 — this image has no CI pipeline; it is built by hand-applied steps).
#
# ── Context composition ──
# kaniko takes exactly ONE --context directory, but the build needs the au worktree (the
# Dockerfile + au source) AND artifacts that live outside it. Those are mounted AT paths
# inside the workspace mount rather than copied in. build-artifacts/ is at the context
# ROOT on purpose: .dockerignore excludes `docker/*` wholesale, so anything staged under
# docker/ is silently dropped from the context (a sibling job hit this — kaniko logged
# "No files to copy" and the later `uv pip install` failed with "Distribution not found").
#
# `workspace` is a DEDICATED DETACHED au worktree pinned at 36446919 (au main), NOT the
# canonical checkout: ~20 lanes are concurrently mutating
# ${WORKSPACE_ROOT}/agent-packages/agent-utilities, and pointing the build there would
# bake whatever half-finished tree happened to exist at build time. This is an
# engine-only change, so the au layer must be a clean, named, reproducible commit.
#
# `eg-wheel` is a DEDICATED staging dir (${STAGING_ROOT}/eg-wheel-eimg0801), NOT the shared
# ${STAGING_ROOT}/eg-wheel. The shared one is NFS-mounted read-only into the LIVE graph-os pod
# (`eg-wheel` volume), so overwriting the wheel in place would mutate a path the running
# production pod can see. A separate dir keeps this build side-effect-free.
#
# Caching stays ON. `--cache=false` was tried on a sibling job and does not work here:
# kaniko wedges in uninterruptible disk sleep during "Taking snapshot of full filesystem"
# and makes no progress (25+ min at 0m CPU, State: D). Caching is SAFE for this change —
# kaniko's composite cache key for a RUN layer covers the command string plus the content
# hash of every context file copied in, and the eg wheel's content changed, so the layer that
# installs it cannot hit a warm entry.
#
# Both hostPaths are on ${BUILD_NODE} (this workspace's NFS server, and where the worktrees live),
# hence the nodeSelector.
apiVersion: batch/v1
kind: Job
metadata:
  name: graphos-unified-engine-fix-0801-image-build
  namespace: image-build
  labels:
    app: graphos-unified-engine-fix-0801-image-build
    purpose: graphos-engine-fix
    lane: lane-engine-image-0801
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: graphos-unified-engine-fix-0801-image-build
        purpose: graphos-engine-fix
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: ${BUILD_NODE}
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --context=dir:///workspace
            - --dockerfile=/workspace/docker/graphos-unified.Dockerfile
            - --destination=knucklessg1/graph-os-unified:engine-fix-0801
            - --cache=true
            - --cache-repo=knucklessg1/graph-os-unified-cache
            - --verbosity=info
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 24Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: eg-wheel
              mountPath: /workspace/build-artifacts/eg-wheel
            - name: langfuse-agent-src
              mountPath: /workspace/build-artifacts/langfuse-agent-src
            - name: docker-config
              mountPath: /kaniko/.docker/config.json
              subPath: config.json
      volumes:
        - name: workspace
          hostPath:
            path: ${WORKTREE_ROOT}/au-image-eimg0801
            type: Directory
        - name: eg-wheel
          hostPath:
            path: ${STAGING_ROOT}/eg-wheel-eimg0801
            type: Directory
        - name: langfuse-agent-src
          hostPath:
            path: ${WORKSPACE_ROOT}/agent-packages/agents/langfuse-agent
            type: Directory
        - name: docker-config
          secret:
            secretName: kaniko-dockerhub-config
            items:
              - key: config.json
                path: config.json
