# Build the current local main into a validation image for the GraphOS skill runtime.
# The resulting deployment remains the one existing Kubernetes GraphOS instance; this
# job only produces a digest-pinnable image and exits.
#
# D-PCC-1: templated via envsubst -- the tracked file carries zero host-specific strings;
# see docker/kaniko-build.env.example.
#
#   export KANIKO_BUILD_NODE=<node hostname>
#   export WORKSPACE_HOSTPATH=<the canonical au checkout's path on that node>
#   export EG_WHEEL_HOSTPATH=<the staged eg wheel's path on that node>
#   export LANGFUSE_AGENT_HOSTPATH=<the langfuse-agent sibling checkout's path on that node>
#   envsubst < docker/graphos-unified-skill-runtime-kaniko-job.yaml | kubectl apply -f -
#   kubectl logs -n image-build -f job/graphos-unified-skill-runtime-image-build
apiVersion: batch/v1
kind: Job
metadata:
  name: graphos-unified-skill-runtime-image-build
  namespace: image-build
  labels:
    app: graphos-unified-skill-runtime-image-build
    purpose: graphos-skill-runtime
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: graphos-unified-skill-runtime-image-build
        purpose: graphos-skill-runtime
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: ${KANIKO_BUILD_NODE}
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
            - --context=dir:///workspace
            - --dockerfile=/workspace/docker/graphos-unified.Dockerfile
            - --destination=knucklessg1/graph-os-unified:skill-runtime
            - --cache=true
            - --cache-repo=knucklessg1/graph-os-unified-cache
            - --verbosity=info
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 4Gi
            limits:
              cpu: "4"
              memory: 6Gi
              ephemeral-storage: 16Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: eg-wheel
              mountPath: /workspace/build-artifacts/eg-wheel
            - name: langfuse-agent-src
              mountPath: /workspace/build-artifacts/langfuse-agent-src
            - name: docker-config
              mountPath: /kaniko/.docker/config.json
              subPath: config.json
      volumes:
        - name: workspace
          hostPath:
            path: ${WORKSPACE_HOSTPATH}
            type: Directory
        - name: eg-wheel
          hostPath:
            path: ${EG_WHEEL_HOSTPATH}
            type: Directory
        - name: langfuse-agent-src
          hostPath:
            path: ${LANGFUSE_AGENT_HOSTPATH}
            type: Directory
        - name: docker-config
          secret:
            secretName: kaniko-dockerhub-config
            items:
              - key: config.json
                path: config.json
