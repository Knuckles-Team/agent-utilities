# Genesis Manifest — generated by scripts/gen_genesis_manifest.py. Do NOT edit by hand.
#
# The single index an agent (or scripts/install.sh) loops to deploy agent-utilities:
#   1. pick a `profile`            (tiny | single-node-prod | enterprise)
#   2. run `preflight`             (does this host have the runtimes/tools?)
#   3. install + generate config   (scripts/install.sh -> setup-config)
#   4. wire the MCP `servers`      (via the profile's `skill`)
#   5. wire any `components` + `ide_targets`, then `verify`
#
# Composes existing sources (mcp-fleet.registry.yml, config profiles, docs/recipes/*,
# the deployment preflight) — it does not duplicate them. Regenerate after changing
# any of those; scripts/check_genesis_manifest.py gates drift.
version: 1
entrypoints:
  substrate: agent-os-genesis
  preflight: agent-utilities-doctor --preflight --profile <profile> [--component <c>]
  install: 'scripts/install.sh (Windows: scripts/install.ps1)'
  config: setup-config generate --profile <profile>
  verify: agent-utilities-doctor
  single_node_skill: agent-utilities-deployment
  multi_node_skill: agent-utilities-deployment
  handoff: agent-os-genesis -> InfrastructureHandoff(substrate_resolved=true) -> agent-utilities-deployment
profiles:
  tiny:
    summary: zero-external-infrastructure local evaluation or development; graph-os and the bundled engine
      operate as one managed unit
    recipe: docs/recipes/tiny.md
    docker: false
    secrets: engine-encrypted-or-runtime-reference
    servers: none
    skill: agent-utilities-deployment
    orchestrator: bare-metal
    install_mode: deploy-baremetal
    idp: none
    ontology_host: local
    engine: autostart
    engine_lifecycle: refcounted
    engine_idle_shutdown_secs: 60
    engine_topology: unified-in-process
  single-node-prod:
    summary: one durable secured host with graph-os, the bundled engine, and a selected core connector
      set
    recipe: docs/recipes/single-node-prod.md
    docker: true
    secrets: openbao-or-engine-encrypted
    servers: core
    skill: agent-utilities-deployment
    orchestrator: docker-compose
    install_mode: deploy-container
    idp: keycloak
    ontology_host: local
    engine: container
    engine_lifecycle: refcounted
    engine_idle_shutdown_secs: 60
    engine_topology: unified-in-process
  enterprise:
    summary: multi-host production with a provider-neutral Kubernetes default, reusable existing identity/secrets/ingress/observability,
      and a selected scale-out connector fleet
    recipe: docs/recipes/enterprise.md
    docker: true
    secrets: openbao
    servers: all
    skill: agent-utilities-deployment
    orchestrator: kubernetes
    install_mode: deploy-container
    idp: keycloak
    ontology_host: local
    engine: remote
    engine_lifecycle: refcounted
    engine_idle_shutdown_secs: 60
    engine_topology: out-of-process-shared
run_plan:
  actions:
  - deploy-container
  - deploy-baremetal
  - use-existing
  - skip
  orchestrators:
  - bare-metal
  - docker-compose
  - docker-swarm
  - podman
  - podman-compose
  - kubernetes
  podman_modes:
  - rootful
  - rootless
  substrate_authority:
  - host-admin
  - namespace-only
  - cluster-admin
  - provision-cluster
  - provision-multi-node
  idp:
  - keycloak
  - okta
  - other-oidc
  - none
  secrets_store:
  - engine
  - vault
  - env
  ontology_hosts:
  - stardog
  - apache-jena
  - local
  engine:
  - autostart
  - container
  - remote
  engine_topology:
  - unified-in-process
  - out-of-process-shared
  install_modes:
  - deploy-container
  - deploy-baremetal
  - use-existing
  - skip
  install_variants:
  - prod
  - dev
  messaging:
    channels:
    - slack
    - teams
    - telegram
    - mattermost
    - discord
    - whatsapp
    - matrix
    - signal
    reach_modes:
    - last-active
    - broadcast
  single_package_deploy:
    invoke: deploy <package> with agent-utilities-deployment
    catalog: agent-utilities-deployment
  provisioner_by_orchestrator:
    bare-metal: agent-os-genesis
    docker-swarm: swarm-mesh-provisioner
    kubernetes: kubernetes-mesh-provisioner
    podman: podman-mesh-provisioner
    podman-compose: podman-mesh-provisioner
    docker-compose: docker-compose-operator
preflight:
  command: agent-utilities-doctor --preflight
  mcp_action: graph_configure action=preflight config_key=<profile>
  always:
  - python>=3.11,<3.15
  - uv-or-pip
  - epistemic-graph[full]>=2.23.2,<3.0.0 — the hard Agent Utilities base dependency; install the approved
    platform wheel with its bundled server and folded numeric kernel. Runtime installation never compiles.
  docker_when: profile != tiny
engine:
  version: epistemic-graph[full]>=2.23.2,<3.0.0
  install: pip install agent-utilities (the full engine is a hard base dependency)
  authority: redb-authoritative durable by default (CONCEPT:AU-KG.backend.backend-modes)
  resolver: CONCEPT:AU-OS.deployment.engine-resolver-auto-provision — remote -> share-running-local ->
    autostart the bundled full binary; refcounted (auto-stops idle) or persistent lifecycle
  wheel: one approved platform wheel containing the full server and folded ABI3 numeric kernel; runtime
    installation never compiles
  docker_image: engine-as-a-DB image for container/remote shapes (single-node-prod, enterprise)
  topology:
    values:
    - unified-in-process
    - out-of-process-shared
    unified-in-process: 'REQUESTED single-unit topology (tiny, single-node-prod). The resolver must record
      the EFFECTIVE process boundary: use a true in-process engine only when the deployed build proves
      it; otherwise the bundled supervised engine is an operational unit but remains out of process.'
    out-of-process-shared: HYPERSCALING shape (enterprise default) — graph-os talks to a shared, independently-scaled
      engine over UDS/TCP (epistemic_graph.client, GIL-free); build the engine with the eg `cluster` cargo
      feature (raft, multi-Raft sharding) and run N graph-os client pods behind the gateway, scaled via
      k8s HPA independently of the engine.
    rule: both shapes keep engine calls BATCHED (one call = one batch op over graph-resident data, never
      a per-element Python loop) and the engine's compute internals pure Rust.
  secret_store:
    graph: __secrets__
    label: Secret
    encryption_key_env: EPISTEMIC_GRAPH_ENCRYPTION_KEY
    note: default embedded secret store (OS-5.66) in the full engine. Local SQLite caches (registry graph,
      card cache, time-series) also route to the engine — no SQLite fallback.
components:
  agent-terminal-ui:
    connect: http
    deps:
    - python>=3.11
    container: true
    note: thin Textual TUI over the gateway; many fit on a Pi-class node
  agent-webui:
    connect: http
    deps:
    - node>=18
    - pnpm>=10
    container: needs-dockerfile
    note: React/Vite SPA + FastAPI; talks to the gateway over /api/*
  geniusbot:
    connect: import
    deps:
    - python>=3.11
    - PySide6/Qt6
    - libGL
    - libxcb
    - display
    container: false
    note: PySide6 desktop app; needs an X11/Wayland display — not headless/cloud
ide_targets:
  install: agent-utilities install
  install_mcp: mcp-installer --all-detected
  register_codex_mcp: setup-config codex
  harness_fence: setup-config harness-fence --target ~/.claude
  tools:
  - claude
  - claude-desktop
  - windsurf
  - opencode
  - openclaw
  - antigravity
  - codex
  - devin
  - cursor
  - zed
  - agent-utilities
  - agent-terminal-ui
servers:
  source: deploy/mcp-fleet.registry.yml
  transport: streamable-http
  count: 59
  core_count: 7
  core:
  - caddy-mcp
  - container-manager-mcp
  - freshrss-mcp
  - openbao-mcp
  - pulselink-mcp
  - technitium-dns-mcp
  - vector-mcp
private_repos:
  concept: AU-OS.deployment.standard-repo-templates
  purpose: Standard operator-owned PRIVATE repos genesis provisions per profile — abstract/templated;
    operator env lives only in XDG config + these repos, never in the public repo.
  repos:
    inventory:
      purpose: Host inventory — the source of truth for hosts, roles & SSH access.
      seed_from: ~/.config/agent-utilities/inventory.yaml
      ci: false
    config:
      purpose: 'Resolved agent-utilities config: workspace.yml + redacted config/mcp examples.'
      seed_from: ~/.config/agent-utilities/{workspace.yml,config.json,mcp_config.json}
      ci: false
    networks:
      purpose: Overlay/network bootstrap (Swarm overlays / k8s CNI + CIDR allocations).
      seed_from: deployment-planner network plan
      ci: false
    secrets-config:
      purpose: Secrets CONVENTION — service->reference map (OpenBao/Vault or engine __secrets__). No plaintext.
      seed_from: secret-store reconcile (graph_configure vault_sync)
      ci: false
    infrastructure:
      purpose: Deployment manifests (compose/swarm/k8s stacks) for this deployment.
      seed_from: workspace.yml stacks
      ci: true
    pipelines:
      purpose: Generalized, reusable GitLab CI templates shared by every repo.
      seed_from: null
      ci: true
  per_profile:
    tiny:
    - inventory
    - config
    single-node-prod:
    - inventory
    - config
    - networks
    - secrets-config
    - infrastructure
    enterprise:
    - inventory
    - config
    - networks
    - secrets-config
    - infrastructure
    - pipelines
  git_mode:
    tiny: local
    single-node-prod: remote
    enterprise: remote
  ci_templates:
  - agent-package-ci.yml
  - service-deploy.yml
  - stages.yml
  runners:
    tiny: 0
    single-node-prod: 1
    enterprise: 2
  step: agent-utilities-deployment enterprise workflow (CONCEPT:AU-OS.deployment.concept-2)
  tokens:
  - GIT_NAMESPACE
  - DEFAULT_BRANCH
  - CI_TEMPLATES_PROJECT
  - RUNNER_TAG
  - REGISTRY
