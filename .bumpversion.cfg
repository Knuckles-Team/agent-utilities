[bumpversion]
current_version = 3.0.0
commit = True
tag = True

[bumpversion:file:agent_utilities/_version.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:README.md]
search = *Version: {current_version}*
replace = *Version: {new_version}*

[bumpversion:file:CHANGELOG.md]
# `search` MUST differ from `replace`, or the bump is a silent no-op: the old
# rule replaced `## [Unreleased]` with itself, so no version heading was ever
# written. 2.2.0 through 2.5.0 have no CHANGELOG entry for exactly that reason,
# and `check_version_consistency.py`'s `release-surface:CHANGELOG.md` check has
# been failing ever since without anyone connecting it to the bumper.
# This keeps `## [Unreleased]` in place and inserts the new version below it.
search = ## [Unreleased]
replace = ## [Unreleased]

	## [{new_version}] - {now:%Y-%m-%d}
