[bumpversion]
current_version = 2.1.1
commit = True
tag = True

[bumpversion:file:agent_utilities/_version.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:README.md]
search = *Version: {current_version}*
replace = *Version: {new_version}*

[bumpversion:file(matrix-self):deploy/release/compatibility-matrix.yml]
search = version: "=={current_version}"
replace = version: "=={new_version}"

[bumpversion:file(matrix-au):deploy/release/compatibility-matrix.yml]
search = agent-utilities: "=={current_version}"
replace = agent-utilities: "=={new_version}"

[bumpversion:file:scripts/install.sh]
search = {current_version}
replace = {new_version}

[bumpversion:file:scripts/install.ps1]
search = {current_version}
replace = {new_version}

[bumpversion:file(docs-eco):docs/ecosystem.md]
search = agent-utilities>={current_version},<3.0.0
replace = agent-utilities>={new_version},<3.0.0

[bumpversion:file(docs-mcp):docs/guides/building-mcp-servers.md]
search = agent-utilities[agent-runtime]>={current_version},<3.0.0
replace = agent-utilities[agent-runtime]>={new_version},<3.0.0

[bumpversion:file(docs-agent):docs/guides/creating-an-agent.md]
search = agent-utilities[agent-runtime]>={current_version},<3.0.0
replace = agent-utilities[agent-runtime]>={new_version},<3.0.0

[bumpversion:file(docs-day0):docs/guides/day0.md]
search = agent-utilities[serving]>={current_version},<3.0.0
replace = agent-utilities[serving]>={new_version},<3.0.0

[bumpversion:file(docs-install):docs/guides/installation.md]
search = agent-utilities[serving]>={current_version},<3.0.0
replace = agent-utilities[serving]>={new_version},<3.0.0

# NOTHING may be added here that a signed connector source attestation depends on.
# The attestation compatibility band is DERIVED from the version authority
# (CONCEPT:AU-KG.ontology.derived-compatibility-band); a bumpversion section that
# rewrites it turns every patch release into a fleet-wide invalidation. The
# `bumpversion-attestation-coupling` finding in scripts/check_version_consistency.py
# fails closed if one reappears.
