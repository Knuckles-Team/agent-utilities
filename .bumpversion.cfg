[bumpversion]
current_version = 1.27.1
commit = True
tag = True

# --- canonical version source (pyproject reads this via version = {attr = ...}) ---
[bumpversion:file:agent_utilities/_version.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

# --- docs badge / header ---
[bumpversion:file:README.md]
search = *Version: {current_version}*
replace = *Version: {new_version}*

# --- release compatibility matrix (4 pinned occurrences, all "==X.Y.Z") ---
[bumpversion:file(matrix-self):deploy/release/compatibility-matrix.yml]
search = version: "=={current_version}"
replace = version: "=={new_version}"

[bumpversion:file(matrix-au):deploy/release/compatibility-matrix.yml]
search = agent-utilities: "=={current_version}"
replace = agent-utilities: "=={new_version}"

# --- installers ---
[bumpversion:file:scripts/install.sh]
search = {current_version}
replace = {new_version}

[bumpversion:file:scripts/install.ps1]
search = {current_version}
replace = {new_version}

# --- documented install/pin examples -------------------------------------
# NOTE: these carry a "<2.0.0" upper ceiling that bump2version CANNOT
# parameterize (it does literal search/replace, so it cannot compute
# major+1). On a MAJOR bump the lower bound below updates correctly but the
# ceiling must be rewritten by the companion step -- see MAJOR-BUMP note at
# the bottom of this file. On minor/patch bumps these stanzas are complete.
[bumpversion:file(docs-eco):docs/ecosystem.md]
search = agent-utilities>={current_version},<2.0.0
replace = agent-utilities>={new_version},<2.0.0

[bumpversion:file(docs-mcp):docs/guides/building-mcp-servers.md]
search = agent-utilities[agent-runtime]>={current_version},<2.0.0
replace = agent-utilities[agent-runtime]>={new_version},<2.0.0

[bumpversion:file(docs-agent):docs/guides/creating-an-agent.md]
search = agent-utilities[agent-runtime]>={current_version},<2.0.0
replace = agent-utilities[agent-runtime]>={new_version},<2.0.0

[bumpversion:file(docs-day0):docs/guides/day0.md]
search = agent-utilities[serving]>={current_version},<2.0.0
replace = agent-utilities[serving]>={new_version},<2.0.0

[bumpversion:file(docs-install):docs/guides/installation.md]
search = agent-utilities[serving]>={current_version},<2.0.0
replace = agent-utilities[serving]>={new_version},<2.0.0

# --- in-code attestation pin ---
[bumpversion:file:agent_utilities/knowledge_graph/integrations/connector_source_attestation.py]
search = ">={current_version},<2"
replace = ">={new_version},<2"

# =========================================================================
# DELIBERATELY NOT MANAGED HERE
#
#   CHANGELOG.md  -- contains the historical heading "## [1.27.1] - ...".
#                    That is release HISTORY and must never be rewritten by a
#                    bump; a bump ADDS a new entry, it does not mutate old ones.
#
#   tests/**      -- version literals in tests are assertions about behaviour;
#                    rewriting them mechanically would mask a real regression.
#
# MAJOR-BUMP note: the "<2.0.0" / "<2" ceilings above, plus the 246 fleet-wide
# pin occurrences in the other 73 repos, must be rewritten in the SAME change
# as a major bump (>=2.0.0,<3.0.0). Bumping without them leaves the fleet
# uninstallable, since the old ceilings exclude the new major.
# =========================================================================
