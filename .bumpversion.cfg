[bumpversion]
current_version = 2.4.0
commit = True
tag = True

[bumpversion:file:agent_utilities/_version.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:README.md]
search = *Version: {current_version}*
replace = *Version: {new_version}*

[bumpversion:file(matrix-self):deploy/release/compatibility-matrix.yml]
search = version: "=={current_version}"
replace = version: "=={new_version}"

[bumpversion:file(matrix-au):deploy/release/compatibility-matrix.yml]
search = agent-utilities: "=={current_version}"
replace = agent-utilities: "=={new_version}"

# `check_compatibility.py` asserts the matrix EXACTLY equals these constants
# (`component_version != _CURRENT_COMPONENT_VERSIONS[name]` ->
# "matrix component ... is not the current source version", and the same for
# `_CURRENT_COMPONENT_DEPENDENCIES`). The two stanzas above move the matrix; if
# these two do not move the constants with it, the very next bump makes that
# gate fail -- the matrix would say the new version while its checker still
# expects the old one. Both halves of one fact, so both move together.
[bumpversion:file(compat-self):scripts/release/check_compatibility.py]
search = "agent-utilities": "{current_version}"
replace = "agent-utilities": "{new_version}"

# One stanza covers all three `dependsOn` entries (langfuse-agent,
# connector-bundles, prebundled-skills) -- bump2version replaces every
# occurrence of `search`, and all three are the same "who depends on
# agent-utilities at exactly this version" fact.
[bumpversion:file(compat-deps):scripts/release/check_compatibility.py]
search = agent-utilities": "=={current_version}"
replace = agent-utilities": "=={new_version}"

[bumpversion:file:scripts/install.sh]
search = {current_version}
replace = {new_version}

[bumpversion:file:scripts/install.ps1]
search = {current_version}
replace = {new_version}

[bumpversion:file(docs-eco):docs/ecosystem.md]
search = agent-utilities>={current_version}
replace = agent-utilities>={new_version}

[bumpversion:file(docs-mcp):docs/guides/building-mcp-servers.md]
search = agent-utilities[agent-runtime]>={current_version}
replace = agent-utilities[agent-runtime]>={new_version}

[bumpversion:file(docs-agent):docs/guides/creating-an-agent.md]
search = agent-utilities[agent-runtime]>={current_version}
replace = agent-utilities[agent-runtime]>={new_version}

[bumpversion:file(docs-day0):docs/guides/day0.md]
search = agent-utilities[serving]>={current_version}
replace = agent-utilities[serving]>={new_version}

[bumpversion:file(docs-install):docs/guides/installation.md]
search = agent-utilities[serving]>={current_version}
replace = agent-utilities[serving]>={new_version}
