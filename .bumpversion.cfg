[bumpversion]
current_version = 2.1.1
commit = True
tag = True

[bumpversion:file:agent_utilities/_version.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:README.md]
search = *Version: {current_version}*
replace = *Version: {new_version}*

[bumpversion:file(matrix-self):deploy/release/compatibility-matrix.yml]
search = version: "=={current_version}"
replace = version: "=={new_version}"

[bumpversion:file(matrix-au):deploy/release/compatibility-matrix.yml]
search = agent-utilities: "=={current_version}"
replace = agent-utilities: "=={new_version}"

[bumpversion:file:scripts/install.sh]
search = {current_version}
replace = {new_version}

[bumpversion:file:scripts/install.ps1]
search = {current_version}
replace = {new_version}

[bumpversion:file(docs-eco):docs/ecosystem.md]
# NOTE: search/replace deliberately omit the static ",<3.0.0" upper bound.
# bump-my-version's legacy .cfg loader (bumpversion/autocast.py:listify,
# bumpversion/config/files_legacy.py:62-65) autocasts any search/replace
# value containing a literal comma into a list and rejoins it with "\n",
# corrupting the pattern into "agent-utilities>=2.1.1\n<3.0.0" (a
# VersionNotFoundError). The ",<3.0.0" suffix is a static constant, not a
# version mirror, so it does not need to be part of the search/replace pair.
search = agent-utilities>={current_version}
replace = agent-utilities>={new_version}

[bumpversion:file(docs-mcp):docs/guides/building-mcp-servers.md]
# See docs-eco note above: comma-free pattern to avoid the legacy-loader autocast bug.
search = agent-utilities[agent-runtime]>={current_version}
replace = agent-utilities[agent-runtime]>={new_version}

[bumpversion:file(docs-agent):docs/guides/creating-an-agent.md]
# See docs-eco note above: comma-free pattern to avoid the legacy-loader autocast bug.
search = agent-utilities[agent-runtime]>={current_version}
replace = agent-utilities[agent-runtime]>={new_version}

[bumpversion:file(docs-day0):docs/guides/day0.md]
# See docs-eco note above: comma-free pattern to avoid the legacy-loader autocast bug.
search = agent-utilities[serving]>={current_version}
replace = agent-utilities[serving]>={new_version}

[bumpversion:file(docs-install):docs/guides/installation.md]
# See docs-eco note above: comma-free pattern to avoid the legacy-loader autocast bug.
search = agent-utilities[serving]>={current_version}
replace = agent-utilities[serving]>={new_version}

# D-35-3: connector_source_attestation.py's SOURCE_COMPATIBILITY floor is deliberately
# NOT bumped here. It used to be rewritten on every patch release, which coupled the
# entire signed provider fleet's attestation validity to the au patch version -- a
# routine 2.1.0 -> 2.1.1 bump invalidated every already-signed bundle even though
# nothing about compatibility actually changed (see D-35-1's root-cause chain). The
# floor is a deliberate compatibility claim, not a version mirror: bump it by hand in
# connector_source_attestation.py only at a real minor/major compatibility boundary.
#
# NOTHING may be added here that a signed connector source attestation depends on.
# The attestation compatibility band is DERIVED from the version authority
# (CONCEPT:AU-KG.ontology.derived-compatibility-band); a bumpversion section that
# rewrites it turns every patch release into a fleet-wide invalidation. The
# `bumpversion-attestation-coupling` finding in scripts/check_version_consistency.py
# fails closed if one reappears.
