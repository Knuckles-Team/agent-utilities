[project]
name = "graphos-mcp-v2-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1,<1",
  "mcp>=2.0.0,<3",
  # CONCEPT:AU-ECO.mcp.v2-gateway-otel-tracing -- real span/trace export for the
  # request lifecycle, plus the W3C propagators used to honor the already-validated
  # `traceparent`/`tracestate`/`baggage` from `gateway.py`'s `_trace_context()`.
  # Pinned to the same floor `agent_utilities`' own `[logfire]`/observability extra
  # uses (`pyproject.toml`), but this is a fully separate dependency declaration --
  # this package must never import `agent_utilities` or `opentelemetry-exporter-otlp-
  # proto-http` beyond what's listed here (see `gateway.py`'s isolation docstring).
  "opentelemetry-api>=1.30.0,<2",
  "opentelemetry-sdk>=1.30.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30.0,<2",
]

[project.scripts]
graphos-mcp-v2-gateway = "mcp_v2_gateway.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_v2_gateway"]
package-dir = {mcp_v2_gateway = "."}
