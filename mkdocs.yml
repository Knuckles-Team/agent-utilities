site_name: "agent-utilities"
repo_name: "Knuckles-Team/agent-utilities"
repo_url: "https://github.com/Knuckles-Team/agent-utilities"
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
plugins:
  - search
validation:
  nav:
    omitted_files: ignore
  links:
    # Repository-relative source/config links live outside docs_dir and are
    # validated by scripts/docs_contract.py. Keep MkDocs focused on rendering.
    not_found: info
    absolute_links: info
    unrecognized_links: info
    anchors: info
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - toc:
      permalink: true
